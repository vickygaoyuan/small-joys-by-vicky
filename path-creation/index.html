      l.av = ((l.av || 0) + clamp(torque, -0.006, 0.006) * f) * Math.pow(0.9, f);
      l.a += (l.av + Math.sin(time * 0.3 + l.phase) * 0.0006) * f;
    }
  }
}

/* ---------- the water garden (watercolour only) ---------- */

// An autumn lake around the leaves: maple boughs hanging into the view, dry grasses, reeds,
// stones and golden banks that stay put, the odd leaf fragment drifting aside for the boat,
// koi under the leaves, ducks and dragonflies that keep away from it, and now and then the
// footbridge. Chunks have their own seed, so water you come back to holds the same garden.
// Counts are the average per chunk. Petals and lily buds belong to summer, so they're off.

const WILLOW_SPAN = 820, WILLOW_PARALLAX = 1.25;

let gardenStatic = [], gardenFloat = [], gardenKoi = [], gardenDucks = [], gardenFlies = [], gardenBridges = [];

// Strokes go down unfiltered and the whole sprite is softened once afterwards: a blur
// filter on every one of thousands of strokes made setup take seconds.
function gardenSprite(W, H, ax, ay, draw, wash = 0.9, soft = 0.6) {
  const [c, g] = makeCanvas(W, H);
  g.translate(ax, ay);
  draw(g);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  if (soft) {
    const t = document.createElement('canvas');
    t.width = c.width; t.height = c.height;
    const tg = t.getContext('2d');
    tg.filter = `blur(${soft * dpr}px)`;
    tg.drawImage(c, 0, 0);
    g.filter = 'none';
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(t, 0, 0);
  }
  g.filter = 'none';
  if (wash) watercolorWash(c, wash);
  return { canvas: c, w: W, h: H, ax, ay };
}

function softShadow(g, x, y, rx, ry, alpha, blur = 2.5) {
  g.filter = `blur(${blur}px)`;
  g.globalAlpha = 1;
  g.fillStyle = `rgba(24, 32, 110, ${alpha})`;
  g.beginPath();
  g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  g.fill();
}

    }
    // Dry grass gone to seed: pale feathery plumes nodding over the tuft.
    for (let i = 0; i < 2 + (rng() * 3 | 0); i++) {

      const tx = bx + Math.sin(lean) * len, ty = -Math.cos(lean) * len;
      brush(g, bx, 0, bx + Math.sin(lean) * len * 0.4, -len * 0.55, tx, ty, 1.2, '#a08a4c', 0.8);
      for (let k = 0; k < 7; k++) {
        const t = 0.72 + k * 0.04, px = bx + Math.sin(lean) * len * t, py = -Math.cos(lean) * len * t, side = k % 2 ? 1 : -1;
        brush(g, px, py, px + side * 3, py - 2, px + side * 5 + Math.sin(lean) * 4, py - 6, 2.2, pick(['#ecd8a0', '#f4e4b8', '#e0c88c']), 0.7);
      }
    }
    const blooms = rng() < 0.2 ? 1 : 0;
    for (let i = 0; i < blooms; i++) {
      const x = rand(-24, 24), y = -rand(72, 104);
      brush(g, x * 0.3, 0, x * 0.7, y * 0.5, x, y + 4, 1.6, '#7a7440', 0.8);
      const fall = pick(IRIS.falls), std = pick(IRIS.standards);
      const petal = (a, l, wd, color, alpha) => {
        const tx = x + Math.cos(a) * l, ty = y + Math.sin(a) * l;
        const cx = x + Math.cos(a) * l * 0.5 - Math.sin(a) * 2, cy = y + Math.sin(a) * l * 0.5 + Math.cos(a) * 2;
        paint(g, x, y, cx, cy, tx, ty, wd, color, alpha);
      };
      for (const a of [0.55, 1.57, 2.6]) petal(a + rand(-0.15, 0.15), rand(9, 13), rand(5.5, 7), fall, 0.9);
      for (const a of [-1.15, -1.57, -2]) petal(a + rand(-0.12, 0.12), rand(8, 11), rand(4.5, 5.5), std, 0.85);
      brush(g, x, y + 1, x + 0.5, y + 3, x, y + 6, 2.2, '#f2d070', 0.85);
    }
  });
}

// A low grassy bank seen from above: an irregular patch of meadow with a shaded lip where
// it meets the water, and loose clusters of garden flowers.
function paintBank(g, cx, cy, hw) {
  const ry = hw * 0.42, my = cy - ry * 0.75, seed = rand(0, 100);
  const edge = (a) => 1 + (noise(Math.cos(a) * 2 + seed, Math.sin(a) * 2) - 0.5) * 0.45;
  const inside = () => {
    const a = rand(0, Math.PI * 2), d = Math.sqrt(rng()) * edge(a) * 0.92;
    return [cx + Math.cos(a) * hw * d, my + Math.sin(a) * ry * d, a, d];
  };
  softShadow(g, cx + 5, my + ry * 0.55, hw * 1.08, ry * 0.75, 0.34, 4);
  g.filter = 'blur(2px)';
  g.globalAlpha = 0.85;
  g.fillStyle = BANK.grass[3];
  g.beginPath();
  for (let i = 0; i <= 28; i++) {
    const a = (i / 28) * Math.PI * 2;
    g.lineTo(cx + Math.cos(a) * hw * edge(a), my + Math.sin(a) * ry * edge(a));
  }
  g.fill();
  g.filter = 'none';
  for (let i = 0; i < hw * 2.6; i++) {
    const [x, y, a, d] = inside();
    const front = Math.sin(a) * d > 0.55;
    const len = rand(6, 14);
    const color = front ? pick(['#6a5432', '#5a4a34', '#4e4a44']) : rng() < 0.15 ? '#f0dc98' : pick(BANK.grass);
    paint(g, x, y, x + rand(-2, 2), y - len / 2, x + rand(-4, 4), y - len, rand(2.4, 4), color, 0.75);
  }
  for (let k = 0; k < Math.round(hw / 12); k++) {
    const [x0, y0] = inside(), c = pick(BANK.blooms);
    for (let i = 0; i < 4 + (rng() * 6 | 0); i++) {
      const x = x0 + rand(-7, 7), y = y0 + rand(-4, 3) - 4;
      brush(g, x - 1.2, y, x, y - 1.2, x + 1.2, y, rand(2.4, 3.6), shade(c, rand(-14, 10)), 0.82);
    }
  }
  brush(g, cx - hw * 0.95, my + ry * 0.5, cx, my + ry * 1.25, cx + hw * 0.95, my + ry * 0.5, 2, WATER.sky[1], 0.45);
}

}

function makeGardenDuck(drake) {
  const body = drake ? '#d8ccbc' : '#a07c5a', back = drake ? '#9a8c7c' : '#7a5c44';
  const head = drake ? '#2e6a50' : '#8a6a4c';
  return gardenSprite(70, 50, 32, 36, (g) => {
    softShadow(g, 2, 4, 24, 6, 0.32);
    brush(g, -26, 2, 0, 10, 26, 2, 1.6, WATER.sky[1], 0.5);
    g.filter = 'none';
    paint(g, -18, -6, 0, -15, 16, -7, 13, body, 0.95);
    brush(g, -16, -2, 0, 2, 14, -2, 5, shade(body, -40), 0.55);
    brush(g, -15, -8, -20, -12, -24, -14, 4, drake ? '#3a3a40' : '#6a4c38', 0.8);
    paint(g, -11, -11, 0, -15, 9, -11, 5, back, 0.75);
    brush(g, -6, -9, -2, -10, 2, -9, 2, '#4a5cc0', 0.8);
    if (drake) brush(g, 9, -7, 13, -10, 16, -12, 8, '#7a4a36', 0.9);
    brush(g, 13, -10, 16, -18, 17, -24, 5, head, 0.95);
    paint(g, 13, -26, 18, -30, 22, -26, 8, head, 0.95);
    if (drake) brush(g, 13, -15, 15.5, -15.8, 18, -15, 1.4, '#f4f0e8', 0.9);
    brush(g, 23, -25.5, 26, -25, 29, -24, 3, drake ? '#e8c050' : '#d08a40', 0.95);
    brush(g, 19, -27.5, 19.5, -27.8, 20, -27.5, 1.6, '#1a1a24', 0.9);
  }, 0.7);
}

function makeDragonflySprite(spread) {
  return gardenSprite(48, 48, 24, 24, (g) => {
    g.filter = 'none';
    for (const side of [-1, 1]) {
      for (const [x0, a, l] of [[3, Math.PI / 2 - 0.3 * spread, 15], [-1, Math.PI / 2 + 0.3 * spread, 14]]) {
        const tx = x0 + Math.cos(a) * l, ty = side * Math.sin(a) * l;
        brush(g, x0, 0, (x0 + tx) / 2 + 1.5, ty / 2, tx, ty, 4.5, '#eef2ff', 0.42);
        brush(g, x0, 0, (x0 + tx) / 2 + 2.5, ty / 2, tx, ty, 0.6, '#a8bce8', 0.55);
      }
    }
    brush(g, 1, 0, -8, 0, -19, rand(-1, 1), 1.9, '#3a7ad0', 0.95);
    brush(g, -14, 0, -17, 0, -19, 0, 1.4, '#1e3a6a', 0.9);
    brush(g, 1, 0, 4, 0, 7, 0, 3.6, '#2a5a7a', 1);
    brush(g, 8.5, 0, 9.5, 0, 10.5, 0, 4, '#3a8a9a', 1);
  }, 0, 0.4);
}

// A small maple leaf seen hanging on the bough: five soft lobes round a darker heart.
function mapleStamp(g, x, y, size, rot, color, alpha) {
  for (const [a, l] of [[0, 1], [0.95, 0.85], [-0.95, 0.85], [1.9, 0.55], [-1.9, 0.55]]) {
    const tx = x + Math.cos(rot + a) * size * l, ty = y + Math.sin(rot + a) * size * l;
    brush(g, x, y, (x + tx) / 2, (y + ty) / 2, tx, ty, size * 0.55, color, alpha);
  }
  brush(g, x - size * 0.1, y, x, y, x + size * 0.1, y, size * 0.4, shade(color, -40), alpha * 0.5);
}

// The tip of an autumn maple bough hanging into the view: a thin dark twig drooping under
// gold, orange and red leaves, thickest toward its end.
function makeWillowStrand() {
  const L = rand(110, 240), sway = rand(-22, 22);
  return gardenSprite(110, L + 34, 55, 4, (g) => {
    const twigs = Array.from({ length: 2 + (rng() * 2 | 0) }, () => {
      const dx = rand(-12, 12), len = L * rand(0.6, 1), ph = rand(0, 6.3);
      return [len, (t) => [dx * (0.4 + t) + sway * t * t + Math.sin(ph + t * 4) * 3, len * t]];
    });
    g.filter = 'none';
    for (const [, at] of twigs) {
      const [x1, y1] = at(0), [xm, ym] = at(0.5), [x2, y2] = at(1);
      brush(g, x1, y1, xm, ym, x2, y2, 1.6, pick(['#4a3020', '#5a3a26', '#3e2a22']), 0.8);
    }
    for (const [len, at] of twigs) {
      for (let i = 0; i < len / 6; i++) {
        const t = Math.pow(rng(), 0.6), [px, py] = at(t), side = rng() < 0.5 ? -1 : 1;
        const s = rand(6, 10) * (0.7 + t * 0.4), out = rand(2, 8) * side;
        const color = rng() < 0.08 ? pick(['#6a4a3a', '#5a4a52']) : rng() < 0.1 ? '#f8e0a0' : pick(WILLOW);
        mapleStamp(g, px + out, py + s * 0.6, s, Math.PI / 2 + side * rand(0.2, 0.7), color, rand(0.55, 0.85));
      }
    }
  }, 0.7);
}

function makeWillowCrown() {
  return gardenSprite(520, 150, 260, 0, (g) => {
    g.filter = 'blur(4px)';
    g.globalAlpha = 0.6;
    g.fillStyle = '#9a4a24';
    g.beginPath();
    for (let i = 0; i <= 24; i++) {
      const x = -250 + (i / 24) * 500;
      g.lineTo(x, (60 * (1 - (x / 260) ** 2) + 8) * (0.8 + noise(i * 0.6, 3.3) * 0.4));
    }
    g.lineTo(250, -10);
    g.lineTo(-250, -10);
    g.fill();
    g.filter = 'none';
    for (let i = 0; i < 3; i++) {
      const x0 = rand(-220, 220), x1 = x0 + rand(-160, 160);
      brush(g, x0, -10, (x0 + x1) / 2, rand(10, 30), x1, rand(30, 60), rand(3, 5), pick(['#4a3020', '#3e2a22']), 0.75);
    }
    for (let i = 0; i < 300; i++) {
      const x = rand(-245, 245), edge = 78 * (1 - (x / 255) ** 2) + 14, y = rand(-10, edge);
      const color = rng() < 0.1 ? pick(['#6a3a2a', '#5a3a3a']) : rng() < 0.12 ? '#f8e0a0' : pick(WILLOW);
      mapleStamp(g, x, y, rand(7, 12), rand(0, 6.3), color, rand(0.55, 0.85));
    }
  }, 0.8, 1);
}

// The bridge arch is painted front-on, as in the Giverny canvases, with wisteria along its
// rail and a grassy bank at each foot. Its reflection is a flipped, blurred, bluer copy.
function makeBridgeSprites() {
  const S = 230, W = S * 2 + 200, H = 230, ax = W / 2, ay = 190;
  const deckY = (x) => -40 - 58 * (1 - (x / S) ** 2);
  const bridge = gardenSprite(W, H, ax, ay, (g) => {
    paintBank(g, -S - 30, 0, 70);
    paintBank(g, S + 30, 0, 70);
    g.filter = 'none';
    for (const px of [-0.62, -0.2, 0.2, 0.62]) {
      const x = px * S;
      paint(g, x, deckY(x) + 6, x + rand(-1, 1), deckY(x) / 2, x, 0, 7, pick(BRIDGE_PAINT.deck), 0.55);
      brush(g, x + 2, deckY(x) + 8, x + 2, deckY(x) / 2, x + 2, 0, 3, pick(BRIDGE_PAINT.under), 0.35);
      brush(g, x - 6, 1, x, 3, x + 6, 1, 1.4, WATER.sky[1], 0.5);
    }
    const seg = (fy, width, colors, alpha) => {
      for (let x = -S; x < S; x += 18) {
        const x2 = Math.min(S, x + 22);
        paint(g, x, fy(x), (x + x2) / 2, fy((x + x2) / 2) + rand(-1, 1), x2, fy(x2), width, pick(colors), alpha);
      }
    };
    seg((x) => deckY(x) + 9, 7, BRIDGE_PAINT.under, 0.75);
    for (let x = -S + 6; x < S; x += 20) {
      paint(g, x, deckY(x), x + rand(-0.5, 0.5), deckY(x) - 16, x, deckY(x) - 34, 3, pick(BRIDGE_PAINT.deck), 0.9);
    }
    seg(deckY, 9, BRIDGE_PAINT.deck, 0.92);
    seg((x) => deckY(x) - 3, 3, BRIDGE_PAINT.light, 0.7);
    seg((x) => deckY(x) - 17, 2.6, BRIDGE_PAINT.deck, 0.85);
    seg((x) => deckY(x) - 34, 4.5, BRIDGE_PAINT.deck, 0.95);
    seg((x) => deckY(x) - 36, 2, BRIDGE_PAINT.light, 0.75);
    for (let i = 0; i < 70; i++) {
      const x = rand(-S, S), y = deckY(x) - 36;
      if (rng() < 0.4) {
        paint(g, x - 4, y - rand(0, 4), x, y - rand(3, 8), x + 4, y - rand(0, 4), rand(3, 5), pick(WILLOW), 0.7);
      } else {
        paint(g, x, y - 3, x + rand(-2, 2), y + 5, x + rand(-3, 3), y + rand(10, 24), rand(4, 7), pick(BRIDGE_PAINT.wisteria), 0.72);
      }
    }
  });
  const [rc, rg] = makeCanvas(W, ay);
  rg.filter = 'blur(3px)';
  rg.scale(1, -1);
  rg.drawImage(bridge.canvas, 0, -ay, W, H);
  rg.setTransform(dpr, 0, 0, dpr, 0, 0);
  rg.filter = 'none';
  rg.globalCompositeOperation = 'source-atop';
  rg.fillStyle = 'rgba(40, 60, 160, 0.4)';
  rg.fillRect(0, 0, W, ay);
  return { bridge, reflection: { canvas: rc, w: W, h: ay, ax, ay: 0 }, span: W };
}

function setupGarden() {
  gardenSprites = {
    irises: Array.from({ length: 5 }, makeIrisSprite),
    reeds: Array.from({ length: 6 }, makeGardenReeds),
    stones: Array.from({ length: 6 }, makeGardenStone),
    banks: Array.from({ length: 2 }, makeBankSprite),
    petals: Array.from({ length: 10 }, makePetalSprite),
    fallen: Array.from({ length: 6 }, makeFallenSprite),
    buds: Array.from({ length: 6 }, makeBudSprite),
    koi: KOI.map(makeKoiSprite),
    ducks: [makeGardenDuck(true), makeGardenDuck(false)],
    dragonfly: [makeDragonflySprite(0), makeDragonflySprite(1)],
    flyShadow: gardenSprite(16, 10, 8, 5, (g) => softShadow(g, 0, 0, 5, 2.5, 0.5, 1.5), 0),
    strands: Array.from({ length: 12 }, makeWillowStrand),
    crowns: Array.from({ length: 2 }, makeWillowCrown),
    bridge: makeBridgeSprites(),
  };
  gardenChunks = new Map();
  gardenWillows = new Map();
  willowLag = 0;
  gardenCamX = cam.x;
  updateGarden(0);
}

function growGardenChunk(cx, cy) {
  const S = gardenSprites, C = CHUNK * unit, x0 = cx * C, y0 = cy * C;
  rng = seeded((worldSeed ^ 0x5bd1e995) ^ Math.imul(cx, 83492791) ^ Math.imul(cy, 50331653));
  const count = (mean) => Math.floor(mean) + (rng() < mean % 1 ? 1 : 0);
  const at = () => [x0 + rand(0, C), y0 + rand(0, C)];
  const clear = (x, y, r) => Math.hypot(x - boat.x, (y - boat.y) * K) > (BOAT_LEN * 0.7 + r) * unit;
  const out = { still: [], float: [], koi: [], ducks: [], flies: [], bridges: [] };
  const still = (x, y, sprite, scale, sway) => {
    if (clear(x, y, 40 * scale)) out.still.push({ x, y, sprite, scale, sway, flip: rng() < 0.5 ? -1 : 1, phase: rand(0, 6.3), lean: 0 });
  };
  const float = (x, y, sprite, scale, spring, upright) => out.float.push({
    x, y, hx: x, hy: y, vx: 0, vy: 0, r: 8 * unit, spin: rng() < 0.5 ? -1 : 1,
    a: upright ? 0 : rand(0, Math.PI * 2), sprite, scale, spring, upright, phase: rand(0, 6.3), flip: rng() < 0.5 ? -1 : 1,
  });
  for (let i = count(GARDEN.irises); i--;) { const [x, y] = at(); still(x, y, pick(S.irises), rand(0.75, 1.1), 1); }
  for (let i = count(GARDEN.reeds); i--;) { const [x, y] = at(); still(x, y, pick(S.reeds), rand(0.75, 1.15), 1); }
  for (let i = count(GARDEN.banks); i--;) { const [x, y] = at(); still(x, y, pick(S.banks), rand(0.85, 1.2), 0); }
  for (let i = count(GARDEN.stones); i--;) {
    const [x, y] = at();
    for (let k = 1 + (rng() * 3 | 0); k--;) still(x + rand(-30, 30) * unit, y + rand(-20, 20) * unit, pick(S.stones), rand(0.6, 1.2), 0);
  }
  for (let i = count(GARDEN.petals); i--;) {
    const [x, y] = at();
    for (let k = 2 + (rng() * 4 | 0); k--;) float(x + rand(-28, 28) * unit, y + rand(-22, 22) * unit, pick(S.petals), rand(0.8, 1.2), 0.0012, false);
  }
  for (let i = count(GARDEN.fallen); i--;) { const [x, y] = at(); float(x, y, pick(S.fallen), rand(0.7, 1.15), 0.0012, false); }
  for (let i = count(GARDEN.buds); i--;) { const [x, y] = at(); float(x, y, pick(S.buds), rand(0.8, 1.2), 0.008, true); }
  for (let i = count(GARDEN.koi); i--;) {
    const [x, y] = at(), base = rand(10, 20) * unit;
    out.koi.push({ x, y, hx: x, hy: y, heading: rand(0, Math.PI * 2), speed: base, base, sprite: pick(S.koi), scale: rand(0.9, 1.4), phase: rand(0, 6.3) });
  }
  if (rng() < GARDEN.ducks) {
    const [x, y] = at(), heading = rand(0, Math.PI * 2), base = rand(8, 13) * unit;
    const lead = { x, y, hx: x, hy: y, heading, speed: 0, base, sprite: S.ducks[0], phase: rand(0, 6.3), wake: 0 };
    out.ducks.push(lead, { x: x - 30 * unit, y: y + 20 * unit, hx: x, hy: y, heading, speed: 0, base, sprite: S.ducks[1], phase: rand(0, 6.3), wake: 0, lead, side: rng() < 0.5 ? -1 : 1 });
  }
  for (let i = count(GARDEN.dragonflies); i--;) {
    const [x, y] = at();
    out.flies.push({ x, y, hx: x, hy: y, tx: x, ty: y, timer: rand(0.5, 3), heading: rand(-3, 3), alt: rand(16, 30) * unit, phase: rand(0, 6.3) });
  }
  if (rng() < GARDEN.bridge) {
    const [x, y] = at();
    if (clear(x, y, 260)) out.bridges.push({ x, y, scale: rand(0.9, 1.1) });
  }
  rng = Math.random;
  return out;
}

function growWillow(col) {
  rng = seeded((worldSeed ^ 0x7a11) ^ Math.imul(col, 0x2c1b3c6d));
  let tree = null;
  if (rng() < GARDEN.willow) {
    const strands = Array.from({ length: 9 + (rng() * 7 | 0) }, () => ({
      dx: rand(-200, 200), dy: rand(-40, 0), sprite: pick(gardenSprites.strands),
      scale: rand(0.8, 1.15), flip: rng() < 0.5 ? -1 : 1, phase: rand(0, 6.3),
    }));
    tree = { offset: rand(0.25, 0.75) * WILLOW_SPAN, strands, crown: pick(gardenSprites.crowns), lift: rand(30, 60), flip: rng() < 0.5 ? -1 : 1, scale: rand(0.85, 1.1) };
  }
  rng = Math.random;
  return tree;
}

function hullPush(x, y, r, A, B) {
  const hx = B.x - A.x, hy = (B.y - A.y) * K, len2 = hx * hx + hy * hy || 1;
  const px = x - A.x, py = (y - A.y) * K;
  const t = clamp((px * hx + py * hy) / len2, 0, 1);
  const dx = px - hx * t, dy = py - hy * t, d = Math.hypot(dx, dy);
  const R = BOAT_WIDTH * unit * 0.7 + r;
  if (d >= R || d === 0) return null;
  return { x: dx / d * (R - d) * 0.08, y: dy / d * (R - d) * 0.08 / K };
}

const turnToward = (from, to, rate) => from + Math.atan2(Math.sin(to - from), Math.cos(to - from)) * Math.min(1, rate);

function updateGarden(dt) {
  if (!gardenSprites) return;
  const C = CHUNK * unit, m = C * 0.5;
  const ax = Math.floor((cam.x - m) / C), bx = Math.floor((cam.x + w + m) / C);
  const ay = Math.floor((cam.y - m) / C), by = Math.floor((cam.y + worldH + m) / C);
  let changed = false;
  for (let cx = ax; cx <= bx; cx++) {
    for (let cy = ay; cy <= by; cy++) {
      const key = cx + ',' + cy;
      if (!gardenChunks.has(key)) { gardenChunks.set(key, growGardenChunk(cx, cy)); changed = true; }
    }
  }
  for (const key of gardenChunks.keys()) {
    const [cx, cy] = key.split(',').map(Number);
    if (cx >= ax - 2 && cx <= bx + 2 && cy >= ay - 2 && cy <= by + 2) continue;
    gardenChunks.delete(key);
    changed = true;
  }
  if (changed) {
    const all = [...gardenChunks.values()];
    gardenStatic = all.flatMap((c) => c.still).sort((a, b) => a.y - b.y);
    gardenFloat = all.flatMap((c) => c.float);
    gardenKoi = all.flatMap((c) => c.koi);
    gardenDucks = all.flatMap((c) => c.ducks);
    gardenFlies = all.flatMap((c) => c.flies);
    gardenBridges = all.flatMap((c) => c.bridges).sort((a, b) => a.y - b.y);
  }
  if (!dt) return;

  // Fronds trail behind as the view slides sideways, then settle.
  const camV = (cam.x - gardenCamX) / dt;
  gardenCamX = cam.x;
  willowLag += (clamp(-camV * 0.00012, -0.06, 0.06) - willowLag) * Math.min(1, dt * 2);

  const f = dt * 60, damp = Math.pow(0.86, f), effort = clamp(boat.effort || 0, 0, 1);
  const hullA = boatPoint(-BOAT_LEN * unit * 0.3, 0), hullB = boatPoint(BOAT_LEN * unit * 0.3, 0);
  for (const p of gardenFloat) {
    let fx = (p.hx - p.x) * p.spring, fy = (p.hy - p.y) * p.spring;
    for (const path of paths) {
      const c = channelForce(p, path);
      if (c) { fx += c.x * 0.7; fy += c.y * 0.7; }
    }
    const push = hullPush(p.x, p.y, p.r, hullA, hullB);
    if (push) { fx += push.x; fy += push.y; }
    p.vx = (p.vx + fx * f) * damp;
    p.vy = (p.vy + fy * f) * damp;
    p.x += p.vx * f;
    p.y += p.vy * f;
    if (!p.upright) p.a += (p.vx - p.vy) * 0.01 * p.spin * f;
  }

  for (const s of gardenStatic) {
    if (!s.sway) continue;
    const dx = s.x - boat.x, d = Math.hypot(dx, (s.y - boat.y) * K), R = 110 * unit;
    const target = d < R ? Math.sign(dx) * (1 - d / R) * (0.15 + 0.35 * effort) : 0;
    s.lean += (target - s.lean) * Math.min(1, dt * (Math.abs(target) > Math.abs(s.lean) ? 6 : 1.2));
  }

  for (const k of gardenKoi) {
    const dx = k.x - boat.x, dy = (k.y - boat.y) * K, d = Math.hypot(dx, dy);
    const fear = clamp(1 - d / (170 * unit), 0, 1) * (0.4 + 0.6 * effort);
    let want = k.heading + Math.sin(time * 0.3 + k.phase) * 0.9;
    if (fear > 0) want = Math.atan2(dy / K, dx);
    else if (Math.hypot(k.x - k.hx, k.y - k.hy) > 240 * unit) want = Math.atan2(k.hy - k.y, k.hx - k.x);
    k.heading = turnToward(k.heading, want, dt * (fear > 0 ? 4 : 0.8));
    k.speed += (k.base * (1 + fear * 5) - k.speed) * Math.min(1, dt * 2);
    k.x += Math.cos(k.heading) * k.speed * dt;
    k.y += Math.sin(k.heading) * k.speed * dt;
  }

  for (const q of gardenDucks) {
    const dx = q.x - boat.x, dy = (q.y - boat.y) * K, d = Math.hypot(dx, dy);
    const fear = clamp(1 - d / (210 * unit), 0, 1);
    let want = q.heading + Math.sin(time * 0.2 + q.phase) * 0.9;
    let target = q.base * Math.max(0, Math.sin(time * 0.13 + q.phase));
    if (fear > 0) {
      want = Math.atan2(dy / K, dx);
      target = q.base + 55 * unit * fear;
    } else if (q.lead) {
      const L = q.lead;
      const lx = L.x - Math.cos(L.heading) * 34 * unit - Math.sin(L.heading) * 16 * unit * q.side;
      const ly = L.y - Math.sin(L.heading) * 34 * unit + Math.cos(L.heading) * 16 * unit * q.side;
      const gap = Math.hypot(lx - q.x, ly - q.y);
      if (gap > 4 * unit) want = Math.atan2(ly - q.y, lx - q.x);
      target = clamp(gap * 0.8, 0, q.base * 4);
    } else if (Math.hypot(q.x - q.hx, q.y - q.hy) > 260 * unit) {
      want = Math.atan2(q.hy - q.y, q.hx - q.x);
      target = q.base;
    }
    q.heading = turnToward(q.heading, want, dt * (fear > 0 ? 3 : 1));
    q.speed += (target - q.speed) * Math.min(1, dt * 1.5);
    q.x += Math.cos(q.heading) * q.speed * dt;
    q.y += Math.sin(q.heading) * q.speed * dt;
    if (q.speed > 6 * unit && (q.wake -= dt) <= 0) {
      q.wake = rand(0.3, 0.45);
      const a = Math.atan2(Math.sin(q.heading) * K, Math.cos(q.heading));
      const v = Math.min(18, q.speed / unit * 0.4) * unit;
      for (const side of [-1, 1]) {
        ripples.push({
          x: q.x - Math.cos(q.heading) * 12 * unit, y: q.y * K - Math.sin(a) * 12 * unit,
          vx: Math.cos(a + Math.PI + side * 1.2) * v, vy: Math.sin(a + Math.PI + side * 1.2) * v,
          angle: a + side * 0.5, len: rand(9, 14) * unit, age: 0, life: rand(1.2, 1.6), sprite: pick(dabSprites),
        });
      }
    }
  }

  for (const fl of gardenFlies) {
    const dx = fl.x - boat.x, dy = (fl.y - boat.y) * K, d = Math.hypot(dx, dy);
    const near = d < 120 * unit;
    fl.timer -= dt;
    if (fl.timer <= 0 || (near && !fl.fleeing)) {
      const a = near ? Math.atan2(dy, dx) + rand(-0.6, 0.6) : rand(0, Math.PI * 2);
      const r = rand(50, 170) * unit * (near ? 1.6 : 1);
      fl.tx = fl.x + Math.cos(a) * r;
      fl.ty = fl.y + Math.sin(a) * r / K;
      if (!near) { fl.tx += (fl.hx - fl.tx) * 0.35; fl.ty += (fl.hy - fl.ty) * 0.35; }
      fl.timer = rand(0.8, 3.4);
      fl.fleeing = near;
    }
    const mx = fl.tx - fl.x, my = (fl.ty - fl.y) * K;
    if (Math.hypot(mx, my) > 3 * unit) {
      const e = 1 - Math.exp(-dt * (fl.fleeing ? 7 : 4.5));
      fl.x += mx * e;
      fl.y += (fl.ty - fl.y) * e;
      fl.heading = turnToward(fl.heading, Math.atan2(my, mx), dt * 10);
    } else {
      fl.fleeing = false;
    }
  }
}

function drawGardenSprite(sp, x, y, s, flip, rot, alpha) {
  const c = Math.cos(rot) * s * rs, n = Math.sin(rot) * s * rs;
  ctx.setTransform(c * flip, n * flip, -n, c, x * rs, y * rs);
  ctx.globalAlpha = alpha;
  ctx.drawImage(sp.canvas, -sp.ax, -sp.ay, sp.w, sp.h);
}

const gardenOff = (sx, sy, r) => sx < -r || sx > w + r || sy < -r || sy > h + r;

// Beneath the pads: the bridge's reflection and the koi, so they show mostly in gaps and
// in the channels the boat opens.
function drawGardenUnder() {
  if (!gardenSprites) return;
  const S = gardenSprites;
  for (const b of gardenBridges) {
    const sx = b.x - cam.x, sy = (b.y - cam.y) * K;
    if (gardenOff(sx, sy, S.bridge.span * unit)) continue;
    drawGardenSprite(S.bridge.reflection, sx + swellX(sy) * 0.85, sy, unit * b.scale, 1, 0, 0.32);
  }
  for (const k of gardenKoi) {
    const sx = k.x - cam.x, sy = (k.y - cam.y) * K;
    if (gardenOff(sx, sy, 60 * unit)) continue;
    const a = Math.atan2(Math.sin(k.heading) * K, Math.cos(k.heading));
    const wiggle = Math.sin(time * (3 + k.speed / unit * 0.1) + k.phase) * 0.07;
    drawGardenSprite(k.sprite, sx + swellX(sy) * 0.6, sy, unit * k.scale * depthScale(sy), 1, a + wiggle, k.sprite.dark ? 0.4 : 0.78);
  }
  ctx.globalAlpha = 1;
}

// On the water: drifting petals and leaves first (behind the boat only), then the things
// that stand up, split by depth so the boat passes in front of or behind them.
function drawGardenOver(front) {
  if (!gardenSprites) return;
  if (!front) {
    for (const p of gardenFloat) {
      const sx = p.x - cam.x, sy = (p.y - cam.y) * K;
      if (gardenOff(sx, sy, 40 * unit)) continue;
      const bob = Math.sin(p.x * 0.011 / unit + time * 0.9 + p.phase * 0.3) * 0.5 * unit;
      const rot = p.upright ? Math.sin(time * 0.7 + p.phase) * 0.06 + clamp(p.vx * 0.2, -0.4, 0.4) : p.a;
      drawGardenSprite(p.sprite, sx + swellX(sy) * 0.85, sy + bob, unit * p.scale * depthScale(sy), p.flip, rot, 0.9);
    }
  }
  for (const s of gardenStatic) {
    if ((s.y > boat.y) !== front) continue;
    const sx = s.x - cam.x, sy = (s.y - cam.y) * K, sc = unit * s.scale * depthScale(sy);
    if (gardenOff(sx, sy, Math.max(s.sprite.w, s.sprite.h) * sc)) continue;
    const rot = s.sway ? s.lean + Math.sin(time * 0.7 + s.phase) * 0.025 + swellX(sy) * 0.002 / unit : 0;
    drawGardenSprite(s.sprite, sx + swellX(sy) * 0.85 * (s.sway ? 0.4 : 1), sy, sc, s.flip, rot, 0.92);
  }
  for (const q of gardenDucks) {
    if ((q.y > boat.y) !== front) continue;
    const sx = q.x - cam.x, sy = (q.y - cam.y) * K;
    if (gardenOff(sx, sy, 50 * unit)) continue;
    const a = Math.atan2(Math.sin(q.heading) * K, Math.cos(q.heading));
    const flip = Math.cos(a) < 0 ? -1 : 1;
    const tilt = clamp(Math.atan2(Math.sin(a), Math.abs(Math.cos(a))), -0.5, 0.5) * 0.5 * flip;
    const bob = Math.sin(time * 2 + q.phase) * 0.6 * unit;
    drawGardenSprite(q.sprite, sx + swellX(sy) * 0.85, sy + bob, unit * depthScale(sy), flip, tilt, 0.95);
  }
  ctx.globalAlpha = 1;
}

// Above everything: the footbridge, dragonflies, and the willow hanging into the top of the
// view. The willow sits closer than the water, so it slides a little faster as you pan.
function drawGardenAir() {
  if (!gardenSprites) return;
  const S = gardenSprites;
  for (const b of gardenBridges) {
    const sx = b.x - cam.x, sy = (b.y - cam.y) * K;
    if (gardenOff(sx, sy, S.bridge.span * unit)) continue;
    drawGardenSprite(S.bridge.bridge, sx, sy, unit * b.scale, 1, 0, 0.95);
  }
  for (const fl of gardenFlies) {
    const sx = fl.x - cam.x, sy = (fl.y - cam.y) * K;
    if (gardenOff(sx, sy, 60 * unit)) continue;
    const hx = Math.sin(time * 7 + fl.phase) * 1.2 * unit, hy = Math.cos(time * 5.3 + fl.phase) * 1.6 * unit;
    drawGardenSprite(S.flyShadow, sx + fl.alt * 0.3, sy + fl.alt, unit, 1, fl.heading, 0.35);
    drawGardenSprite(S.dragonfly[(time * 6 + fl.phase) & 1], sx + hx, sy + hy, unit * 0.8, 1, fl.heading, 0.95);
  }
  const span = WILLOW_SPAN * unit, off = cam.x * WILLOW_PARALLAX;
  const c0 = Math.floor((off - span) / span), c1 = Math.floor((off + w + span) / span);
  for (let col = c0; col <= c1; col++) {
    let tree = gardenWillows.get(col);
    if (tree === undefined) { tree = growWillow(col); gardenWillows.set(col, tree); }
    if (!tree) continue;
    const base = col * span + tree.offset * unit - off;
    for (const st of tree.strands) {
      const sway = Math.sin(time * 0.5 + st.phase) * 0.035 + Math.sin(time * 1.3 + st.phase * 2) * 0.01 + willowLag;
      drawGardenSprite(st.sprite, base + st.dx * unit * tree.scale, (st.dy - tree.lift * 0.3) * unit, unit * st.scale, st.flip, sway, 0.9);
    }
    drawGardenSprite(tree.crown, base, -tree.lift * 0.4 * unit, unit * tree.scale, tree.flip, 0, 0.95);
  }
  ctx.globalAlpha = 1;
}

/* ---------- rendering ---------- */

function drawShimmer() {
  for (const s of shimmer) {
    const sway = Math.sin(time * s.speed + s.phase);
    const x = s.x + swellX(s.y) + sway * 2.5 * unit;
    drawDab(s.sprite, x, s.y, s.tilt + sway * 0.02, s.len, 0.13 + 0.05 * (sway * 0.5 + 0.5));
  }
  ctx.globalAlpha = 1;
}

function drawRipples() {
  for (const r of ripples) {
    const t = r.age / r.life;
    const fade = Math.min(1, t * 8) * Math.pow(1 - t, 1.4);
    const y = r.y - cam.y * K;
    const x = r.x - cam.x + swellX(y) * 0.85;
    if (r.ring) {
      const radius = (5 + t * 30) * unit;
      for (const d of r.dabs) {
        const cx = x + Math.cos(d.a) * radius, cy = y + Math.sin(d.a) * radius * K;
        const tangent = Math.atan2(Math.cos(d.a) * K, -Math.sin(d.a));
        drawDab(d.sprite, cx, cy, tangent, radius * 0.7 + 6 * unit, fade * 0.3);
      }
    } else {
      drawDab(r.sprite, x, y, r.angle, r.len * (0.8 + t * 0.9), fade * 0.38);
    }
  }
  ctx.globalAlpha = 1;
}

// The open channel reads as deeper ultramarine than the pale pads around it. The stamps
// collect on their own layer first so overlaps don't darken, then multiply onto the water,
// which keeps its brushwork showing through.
function makeWash() {
  washBlob = document.createElement('canvas');
  washBlob.width = washBlob.height = 64;
  const bg = washBlob.getContext('2d');
  const grad = bg.createRadialGradient(32, 32, 0, 32, 32, 32);
  // In the grass meadow the tint multiplies the light water ramp shade down to the deeper one.
  const tint = GRASS_MAT ? '196,196,224' : PIXEL_ART ? '158,164,214' : '128,164,204';
  grad.addColorStop(0, `rgba(${tint},1)`);
  grad.addColorStop(0.55, `rgba(${tint},0.8)`);
  grad.addColorStop(1, `rgba(${tint},0)`);
  bg.fillStyle = grad;
  bg.fillRect(0, 0, 64, 64);
  washLayer = document.createElement('canvas');
  washLayer.width = Math.ceil(w / 2);
  washLayer.height = Math.ceil(h / 2);
  washG = washLayer.getContext('2d');
}

function drawChannelWash() {
  let any = false;
  washG.clearRect(0, 0, washLayer.width, washLayer.height);
  for (const path of paths) {
    const hw = path.halfWidth, rw = hw * 1.2, gap = hw * 0.45;
    let next = -1;
    for (const p of path.pts) {
      if (p.s <= 0 || p.d < next) continue;
      next = p.d + gap;
      any = true;
      const sx = p.x - cam.x, sy = (p.y - cam.y) * K;
      if (sx < -rw || sx > w + rw || sy < -rw || sy > h + rw) continue;
      washG.globalAlpha = (GRASS_MAT ? 1 : 0.3) * p.s;
      washG.drawImage(washBlob, (sx + swellX(sy) * 0.85 - rw) / 2, (sy - rw * K) / 2, rw, rw * K);
    }
  }
  if (!any) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(washLayer, 0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'source-over';
}

// Sizes stay fixed on screen: scaling by view position made everything grow and shrink
// as the camera followed the boat.
const depthScale = () => 1;

// Pixel mode pins each plant to a whole pixel and only moves it once it has drifted most of
// a pixel away: any sub-pixel jitter makes pixelate() redraw its outline, so it seems to blink.
function pinned(l) {
  const x = rs * l.x, y = rs * K * l.y;
  if (l.pinX === undefined || Math.abs(x - l.pinX) > 0.75) l.pinX = Math.round(x);
  if (l.pinY === undefined || Math.abs(y - l.pinY) > 0.75) l.pinY = Math.round(y);
  return [l.pinX - Math.round(rs * cam.x), l.pinY - Math.round(rs * K * cam.y)];
}

function drawLeaves() {
  // Washes are transparent, so a little of the water shows through every leaf.
  ctx.globalAlpha = PIXEL_ART ? 1 : 0.94;
  for (const l of leaves) {
    if (l.solid) continue;
    const screenX = l.x - cam.x, screenY = K * (l.y - cam.y);
    if (screenX < -l.r * 2 || screenX > w + l.r * 2 || screenY < -l.r * 2 || screenY > h + l.r * 2) continue;
    const s = l.r * depthScale(screenY) / SPRITE_R;
    // Watercolour leaves are painted in plan view: turned in the lake plane, then foreshortened.
    const ang = PIXEL_ART ? 0 : l.a, fore = PIXEL_ART ? 1 : K;
    const ct = Math.cos(ang) * s, st = Math.sin(ang) * s;
    // Squash along the squeeze axis, spread across it, and shear a little so a pressed
    // leaf reads as bent rather than merely scaled.
    const c = Math.min(Math.hypot(l.qx, l.qy), SQUEEZE_MAX);
    const phi = Math.atan2(l.qy, l.qx) / 2;
    const cp = Math.cos(phi), sp2 = Math.sin(phi);
    const along = 1 - c, across = 1 + c * SQUEEZE_SPREAD, bend = c * 0.3 * l.spin;
    const a11 = along * cp * cp - bend * cp * sp2 + across * sp2 * sp2;
    const a12 = (along - across) * cp * sp2 + bend * cp * cp;
    const a21 = (along - across) * cp * sp2 - bend * sp2 * sp2;
    const a22 = along * sp2 * sp2 + bend * cp * sp2 + across * cp * cp;
    const bob = PIXEL_ART ? 0 : Math.sin(l.x * 0.011 / unit + time * 0.9 + l.phase * 0.3) * 0.5 * unit;
    // Each leaf is also mirrored and stretched its own way, so shared sprites never repeat.
    const fx = l.flip * l.stretch, fy = 1 / l.stretch;
    const [px, py] = PIXEL_ART ? pinned(l) : [rs * (screenX + swellX(screenY) * 0.85), rs * (screenY + bob)];
    ctx.setTransform(
      rs * (a11 * ct + a12 * st * fore) * fx, rs * (a21 * ct + a22 * st * fore) * fx,
      rs * (a12 * ct * fore - a11 * st) * fy, rs * (a22 * ct * fore - a21 * st) * fy,
      px, py,
    );
    const sp = l.sprite;
    const [sx, sy, sw, sh] = sp.rects[clamp(Math.floor(Math.log2(dpr / (s * rs))), 0, sp.rects.length - 1)];
    ctx.drawImage(padAtlas[sp.page], sx, sy, sw, sh, -sp.w / 2, -sp.h / 2, sp.w, sp.h);
  }
  ctx.globalAlpha = 1;
}

function drawFlowers() {
  for (const l of leaves) {
    if (!l.flower) continue;
    const fl = l.flower;
    const sx = l.x - cam.x, sy = K * (l.y - cam.y);
    if (sx < -80 * unit || sx > w + 80 * unit || sy < -80 * unit || sy > h + 80 * unit) continue;
    const s = clamp(l.r / unit, 22, 48) / 26 * unit * l.flowerScale * depthScale(sy);
    if (PIXEL_ART) {
      ctx.setTransform(rs * s * l.flowerFlip, 0, 0, rs * s, ...pinned(l));
    } else {
      const bob = Math.sin(l.x * 0.011 / unit + time * 0.9 + l.phase * 0.3) * 0.5 * unit;
      ctx.setTransform(rs * s * l.flowerFlip, 0, 0, rs * s, rs * (sx + swellX(sy) * 0.85), rs * (sy + bob));
    }
    ctx.drawImage(fl.canvas, -fl.w / 2, -fl.h * 0.68, fl.w, fl.h);
  }
}

function hullPath(g, L, W) {
  g.beginPath();
  g.moveTo(L / 2, 0);
  g.bezierCurveTo(L * 0.3, -W * 0.56, -L * 0.3, -W * 0.56, -L / 2, -W * 0.34);
  g.quadraticCurveTo(-L * 0.56, 0, -L / 2, W * 0.34);
  g.bezierCurveTo(-L * 0.3, W * 0.56, L * 0.3, W * 0.56, L / 2, 0);
  g.closePath();
}

// The hull outline as points, bow at +x, matching hullPath.
function hullOutline(L, W) {
  const pts = [];
  const cubic = (p0, p1, p2, p3, n) => {
    for (let i = 0; i < n; i++) {
      const t = i / n, u = 1 - t;
      pts.push([
        u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
        u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1],
      ]);
    }
  };
  cubic([L / 2, 0], [L * 0.3, -W * 0.56], [-L * 0.3, -W * 0.56], [-L / 2, -W * 0.34], 28);
  for (let i = 0; i < 8; i++) {
    const t = i / 8, u = 1 - t;
    pts.push([u * u * (-L / 2) + 2 * u * t * (-L * 0.56) + t * t * (-L / 2), u * u * (-W * 0.34) + t * t * (W * 0.34)]);
  }
  cubic([-L / 2, W * 0.34], [-L * 0.3, W * 0.56], [L * 0.3, W * 0.56], [L / 2, 0], 28);
  return pts;
}

// A broken loop of strokes laid along a closed outline, like the rims of the leaves.
function paintOutline(g, pts, width, colorAt, alpha) {
  let i = (Math.random() * 3) | 0;
  while (i < pts.length) {
    const k = 3 + ((Math.random() * 4) | 0);
    const a = pts[i % pts.length], m = pts[(i + (k >> 1)) % pts.length], b = pts[(i + k) % pts.length];
    paint(g, a[0], a[1], m[0], m[1], b[0], b[1], width * rand(0.8, 1.2), colorAt(m[0], m[1]), alpha * rand(0.8, 1));
    i += Math.max(2, Math.round(k * rand(0.7, 0.95)));
  }
}

// A Giverny rowboat in Monet's hand: viridian hull, ochre boards, a boater in a straw hat
// and a companion under a pale parasol, painted with the same brush as the leaves.
// Pixel art: the same rowboat in flat shades of vermilion, wood, cream and straw.
function makePixelBoat() {
  const L = BOAT_LEN * unit, W = BOAT_WIDTH * unit;
  const CW = L * 1.2, CH = W * 1.6;
  const R = PIXEL_RAMPS;
  const disc = (g, x, y, r, color) => {
    g.fillStyle = color;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  };
  // Lit top-left, shaded bottom-right: a darker shape with the lit one laid over it, offset.
  const shaded = (g, draw, dark, mid, dx, dy) => {
    g.save();
    draw();
    g.clip();
    g.fillStyle = dark;
    g.fillRect(-CW, -CH, CW * 2, CH * 2);
    g.translate(-dx, -dy);
    draw();
    g.fillStyle = mid;
    g.fill();
    g.restore();
  };

  const [shadow, sg] = makeCanvas(CW, CH);
  sg.translate(CW / 2, CH / 2);
  hullPath(sg, L, W);
  sg.fillStyle = R.water[0];
  sg.fill();

  const [c, g] = makeCanvas(CW, CH);
  g.translate(CW / 2, CH / 2);
  shaded(g, () => hullPath(g, L, W), R.red[1], R.red[2], L * 0.03, W * 0.12);
  g.save();
  hullPath(g, L, W);
  g.clip();
  g.strokeStyle = R.red[3];
  g.lineWidth = W * 0.12;
  g.beginPath();
  g.moveTo(-L * 0.42, -W * 0.3);
  g.quadraticCurveTo(0, -W * 0.5, L * 0.38, -W * 0.12);
  g.stroke();
  g.restore();

  g.save();
  g.scale(0.74, 0.56);
  shaded(g, () => hullPath(g, L, W), R.wood[1], R.wood[2], -L * 0.02, -W * 0.1);
  g.restore();
  for (const x of [0.04, -0.3]) {
    g.fillStyle = R.wood[1];
    g.fillRect(x * L - 2.4 * unit, -W * 0.26, 4.8 * unit, W * 0.52);
    g.fillStyle = R.wood[3];
    g.fillRect(x * L - 2.4 * unit, -W * 0.26, 2.2 * unit, W * 0.24);
  }

  const px = -L * 0.3, pr = W * 0.3;
  g.fillStyle = R.cream[1];
  g.fillRect(px - pr * 1.2, -pr * 0.45, pr * 0.6, pr * 0.9);
  shaded(g, () => { g.beginPath(); g.arc(px, 0, pr, 0, Math.PI * 2); }, R.pink[3], R.pink[4], -pr * 0.18, -pr * 0.22);
  g.strokeStyle = R.pink[3];
  g.lineWidth = 1.4 * unit;
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI + 0.3;
    g.beginPath();
    g.moveTo(px - Math.cos(a) * pr * 0.9, -Math.sin(a) * pr * 0.9);
    g.lineTo(px + Math.cos(a) * pr * 0.9, Math.sin(a) * pr * 0.9);
    g.stroke();
  }
  disc(g, px, 0, 1.8 * unit, R.pink[1]);

  const hx = W * 0.02, hr = W * 0.22;
  g.strokeStyle = R.cream[2];
  g.lineWidth = 3.4 * unit;
  g.lineCap = 'round';
  for (const side of [-1, 1]) {
    g.beginPath();
    g.moveTo(0, side * W * 0.18);
    g.lineTo(L * 0.03, side * W * 0.34);
    g.stroke();
  }
  shaded(g, () => { g.beginPath(); g.ellipse(-W * 0.04, 0, W * 0.14, W * 0.3, 0, 0, Math.PI * 2); }, R.cream[2], R.cream[3], W * 0.04, W * 0.08);
  shaded(g, () => { g.beginPath(); g.arc(hx, 0, hr, 0, Math.PI * 2); }, R.gold[1], R.gold[2], hr * 0.2, hr * 0.3);
  g.strokeStyle = R.red[1];
  g.lineWidth = 1.6 * unit;
  g.beginPath();
  g.arc(hx, 0, hr * 0.55, 0, Math.PI * 2);
  g.stroke();
  disc(g, hx - hr * 0.3, -hr * 0.3, hr * 0.22, R.gold[3]);
  return { hull: c, shadow, oar: makePixelOar(L), w: CW, h: CH };
}

function makePixelOar(L) {
  const pad = 4 * unit;
  const back = L * 0.14, reach = L * 0.56, bladeL = L * 0.1, bladeW = L * 0.045;
  const W = back + reach + bladeL + pad * 2, H = bladeW * 2 + pad * 2;
  const [c, g] = makeCanvas(W, H);
  const ox = back + pad;
  g.translate(ox, H / 2);
  g.fillStyle = PIXEL_RAMPS.wood[2];
  g.fillRect(-back, -1.4 * unit, back + reach, 2.8 * unit);
  g.fillStyle = PIXEL_RAMPS.wood[3];
  g.beginPath();
  g.ellipse(reach, 0, bladeL, bladeW, 0, 0, Math.PI * 2);
  g.fill();
  return { canvas: c, w: W, h: H, ox };
}

function makeBoatSprites() {
  if (PIXEL_ART) return makePixelBoat();
  const L = BOAT_LEN * unit, W = BOAT_WIDTH * unit;
  const CW = L * 1.2, CH = W * 1.6;
  const broken = [...WATER.lilac, ...WATER.sky];

  const [shadow, sg] = makeCanvas(CW, CH);
  sg.translate(CW / 2, CH / 2);
  sg.filter = `blur(${4 * unit}px)`;
  hullPath(sg, L * 1.04, W * 1.1);
  sg.fillStyle = '#2e3a6e';
  sg.globalAlpha = 0.55;
  sg.fill();

  const [c, g] = makeCanvas(CW, CH);
  g.translate(CW / 2, CH / 2);
  const outer = hullOutline(L, W);

  g.filter = `blur(${1.2 * unit}px)`;
  hullPath(g, L * 0.98, W * 0.98);
  g.fillStyle = '#226a5c';
  g.fill();
  g.filter = 'none';

  // Planking: strokes running bow to stern along the curve of the hull. Deep viridian, the
  // complement of the red and gold leaves, so the boat never sinks into a drift of them.
  const HULL = ['#24725f', '#1e6454', '#2e826c', '#3a927a', '#1a584c', '#2a7a66'];
  const halfW = (x) => W * 0.52 * Math.pow(Math.max(0, 1 - ((x + L * 0.04) / (L * 0.54)) ** 2), 0.6);
  g.save();
  hullPath(g, L, W);
  g.clip();
  for (let v = -0.95; v <= 0.95; v += rand(0.14, 0.2)) {
    let x = -L * 0.56 + rand(0, 4);
    while (x < L * 0.5) {
      const len = rand(0.14, 0.3) * L;
      const x2 = x + len, mx = (x + x2) / 2;
      const roll = Math.random();
      const color = roll < 0.05 ? pick(broken) : v < -0.4 && roll < 0.5 ? pick(['#5ea890', '#7cbca4', '#a0d2bc']) : pick(HULL);
      paint(g, x, v * halfW(x), mx, v * halfW(mx) + rand(-1, 1), x2, v * halfW(x2), rand(4.5, 7) * unit, color, rand(0.7, 0.95));
      x += len * rand(0.65, 0.9);
    }
  }
  g.restore();

  // Gunwale: warm cream where the light catches the near side, deep green-black on the far side.
  paintOutline(g, outer, 3.6 * unit, (x, y) => y < 0 ? pick(['#fde6d4', '#fff2e4', '#f8d8c0', '#fff8ee']) : pick(['#163a34', '#1c3440', '#204a40']), 0.85);

  // Inside the boat: ochre floorboards.
  const inner = outer.map(([x, y]) => [x * 0.8, y * 0.7]);
  g.save();
  g.scale(0.8, 0.7);
  g.filter = `blur(${unit}px)`;
  hullPath(g, L, W);
  g.fillStyle = '#b8885a';
  g.fill();
  g.filter = 'none';
  g.restore();
  g.save();
  g.beginPath();
  inner.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
  g.closePath();
  g.clip();
  for (let v = -0.9; v <= 0.9; v += rand(0.2, 0.28)) {
    let x = -L * 0.46 + rand(0, 3);
    while (x < L * 0.4) {
      const len = rand(0.18, 0.34) * L;
      const x2 = x + len, mx = (x + x2) / 2;
      const color = Math.random() < 0.12 ? pick(broken) : pick(['#c89a68', '#a07448', '#d8b080', '#9a6e48', '#e8c898', '#b08a6a']);
      paint(g, x, v * halfW(x) * 0.7, mx, v * halfW(mx) * 0.7, x2, v * halfW(x2) * 0.7, rand(4.5, 6.5) * unit, color, rand(0.65, 0.9));
      x += len * rand(0.7, 0.95);
    }
  }
  g.restore();
  // The inner wall: shaded under the far gunwale, lit under the near one.
  paintOutline(g, inner, 2.2 * unit, (x, y) => y > 0 ? pick(['#6a4e36', '#5a4a52', '#7e5c3c']) : pick(['#e0c498', '#d4b488']), 0.6);

  // Thwarts.
  for (const x of [0.04, -0.3]) {
    paint(g, x * L, -W * 0.32, x * L + rand(-1, 1), 0, x * L, W * 0.32, 4.5 * unit, '#8a6644', 0.9);
    impasto(g, x * L - 1, -W * 0.28, x * L - 1, -W * 0.05, 1.8 * unit, '#e0bc88', 0.7);
  }
  // Light on the bow.
  impasto(g, L * 0.28, -W * 0.3, L * 0.42, -W * 0.14, 2.2 * unit, '#e4ecd8', 0.8);

  // Companion at the stern: a pale blue skirt peeking out from under a parasol.
  const px = -L * 0.3, pr = W * 0.4;
  for (let i = 0; i < 4; i++) {
    const y = rand(-0.5, 0.5) * pr;
    paint(g, px - pr * 1.15, y, px - pr * 0.9, y + rand(-1, 1), px - pr * 0.6, y, rand(3, 4) * unit, pick(['#a8b8d8', '#c8d0e8', '#8ea0c8']), 0.85);
  }
  g.filter = `blur(${unit}px)`;
  g.fillStyle = '#ece0e8';
  g.beginPath();
  g.arc(px, 0, pr * 0.95, 0, Math.PI * 2);
  g.fill();
  g.filter = 'none';
  const panels = 8, rot = rand(0, 1);
  for (let i = 0; i < panels * 2; i++) {
    const a = rot + (i / (panels * 2)) * Math.PI * 2;
    const lit = Math.sin(a) < 0;
    const color = lit ? pick(['#fff8f8', '#f8eef0', '#f4dce4']) : pick(['#e0c8d6', '#cbbad8', '#d8c0d4']);
    paint(g, px + Math.cos(a) * pr * 0.12, Math.sin(a) * pr * 0.12, px + Math.cos(a + 0.12) * pr * 0.55, Math.sin(a + 0.12) * pr * 0.55, px + Math.cos(a) * pr * 0.9, Math.sin(a) * pr * 0.9, rand(3, 4.2) * unit, color, 0.8);
  }
  for (let i = 0; i < panels; i++) {
    const a = rot + (i / panels) * Math.PI * 2 + 0.2;
    brush(g, px, 0, px + Math.cos(a) * pr * 0.5, Math.sin(a) * pr * 0.5, px + Math.cos(a) * pr * 0.92, Math.sin(a) * pr * 0.92, 0.9 * unit, '#a898c0', 0.35);
  }
  const ring = Array.from({ length: 36 }, (_, i) => {
    const a = (i / 36) * Math.PI * 2;
    return [px + Math.cos(a) * pr * 0.92, Math.sin(a) * pr * 0.92];
  });
  paintOutline(g, ring, 2.2 * unit, (x, y) => y > 0 ? pick(['#a898c0', '#c890a8', '#8a80b0']) : pick(['#f0c8d4', '#fbe8ee', '#e4a8bc']), 0.8);
  for (let i = 0; i < 3; i++) {
    const x = px + rand(-0.4, 0.3) * pr, y = -rand(0.25, 0.6) * pr;
    impasto(g, x - pr * 0.15, y, x + pr * 0.15, y, 2 * unit, '#fffaf6', 0.9);
  }
  brush(g, px - 1, 0, px, -1, px + 1, 0, 3.2 * unit, '#8a7a90', 0.9);

  // The boater, rowing, in a white shirt and straw hat.
  const rx = 0, hr = W * 0.17;
  for (const side of [-1, 1]) {
    paint(g, rx, side * W * 0.18, rx + L * 0.02, side * W * 0.26, rx + L * 0.03, side * W * 0.34, 3.4 * unit, pick(['#ece4dc', '#f2eef4']), 0.9);
  }
  for (let i = 0; i < 6; i++) {
    const x = rx - W * 0.12 + (i / 5) * W * 0.2;
    const color = i < 4 ? pick(['#f2eef4', '#ffffff', '#e8e4f0']) : pick(['#b4acd0', '#c4bcd8']);
    paint(g, x, -W * 0.3, x - W * 0.06, 0, x, W * 0.3, rand(4.5, 5.5) * unit, color, 0.9);
  }
  impasto(g, rx - W * 0.16, -W * 0.26, rx - W * 0.16, -W * 0.06, 2 * unit, '#ffffff', 0.85);
  const hx = rx + W * 0.02;
  g.filter = `blur(${0.8 * unit}px)`;
  g.fillStyle = '#e0cc94';
  g.beginPath();
  g.arc(hx, 0, hr * 0.95, 0, Math.PI * 2);
  g.fill();
  g.filter = 'none';
  for (let s = 0.35; s <= 0.95; s += 0.3) {
    const arc = Array.from({ length: 18 }, (_, i) => {
      const a = (i / 18) * Math.PI * 2;
      return [hx + Math.cos(a) * hr * s, Math.sin(a) * hr * s];
    });
    paintOutline(g, arc, 1.8 * unit, (x, y) => y < 0 ? pick(['#f8ecc8', '#f2e4b4']) : pick(['#c8b070', '#b09858']), 0.8);
  }
  const band = Array.from({ length: 20 }, (_, i) => {
    const a = (i / 20) * Math.PI * 2;
    return [hx + Math.cos(a) * hr * 0.55, Math.sin(a) * hr * 0.55];
  });
  paintOutline(g, band, 1.6 * unit, () => pick(['#4f68a0', '#3e5890', '#6a7cb4']), 0.85);
  impasto(g, hx - hr * 0.25, -hr * 0.2, hx + hr * 0.15, -hr * 0.25, 1.8 * unit, '#fff6d6', 0.9);

  g.globalAlpha = 1;
  impastoRelief(c, 0.9, 0, 0.25);
  return { hull: c, shadow, oar: makeOarSprite(L), w: CW, h: CH };
}

// An oar along +x from its pivot, painted once and stamped every frame.
function makeOarSprite(L) {
  const pad = 4 * unit;
  const back = L * 0.14, reach = L * 0.56, bladeL = L * 0.1, bladeW = L * 0.04;
  const W = back + reach + bladeL + pad * 2, H = bladeW * 2 + pad * 2;
  const [c, g] = makeCanvas(W, H);
  const ox = back + pad;
  g.translate(ox, H / 2);
  paint(g, -back, 0, (reach - back) / 2, rand(-0.5, 0.5), reach, 0, 2.6 * unit, '#7a5e44', 0.95);
  brush(g, -back * 0.6, -0.7 * unit, reach * 0.4, -0.8 * unit, reach * 0.9, -0.7 * unit, 0.9 * unit, '#c8a878', 0.6);
  g.save();
  g.translate(reach, 0);
  g.filter = `blur(${0.6 * unit}px)`;
  g.fillStyle = '#c8a878';
  g.beginPath();
  g.ellipse(0, 0, bladeL, bladeW, 0, 0, Math.PI * 2);
  g.fill();
  g.filter = 'none';
  for (let i = 0; i < 4; i++) {
    const y = (i / 3 - 0.5) * bladeW * 1.2;
    const span = bladeL * Math.sqrt(1 - (y / bladeW) ** 2) * 0.85;
    paint(g, -span, y, 0, y + rand(-0.5, 0.5), span, y, bladeW * 0.55, pick(['#d8b888', '#b08858', '#e4cca0']), 0.85);
  }
  paint(g, -bladeL * 0.8, bladeW * 0.6, 0, bladeW * 1.05, bladeL * 0.8, bladeW * 0.6, 1.4 * unit, '#6a5038', 0.6);
  impasto(g, -bladeL * 0.4, -bladeW * 0.35, bladeL * 0.4, -bladeW * 0.4, 1.4 * unit, '#f0dcb0', 0.85);
  g.restore();
  return { canvas: c, w: W, h: H, ox };
}

function drawOar(L, side, sweep) {
  const px = -L * 0.02, py = side * BOAT_WIDTH * unit * 0.4;
  const a = side * (Math.PI / 2 + sweep);
  const oar = boatSprites.oar;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(a);
  ctx.scale(1, side);
  ctx.globalAlpha = 0.95;
  ctx.drawImage(oar.canvas, -oar.ox, -oar.h / 2, oar.w, oar.h);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBoat(b) {
  const L = BOAT_LEN * unit;
  const bob = Math.sin(time * 1.3) * 0.025;
  const heading = boatScreenAngle() + bob * (1 - (b.effort || 0)) + (PIXEL_ART ? skullWobble() : 0);
  const s = boatSprites;
  ctx.setTransform(rs, 0, 0, rs, 0, 0);
  ctx.translate(b.x - cam.x, (b.y - cam.y) * K);

  ctx.save();
  ctx.translate(3 * unit, 6 * unit);
  ctx.rotate(heading);
  ctx.drawImage(s.shadow, -s.w / 2, -s.h / 2, s.w, s.h);
  ctx.restore();
  ctx.rotate(heading);

  const effort = clamp(b.effort || 0, 0, 1);
  const sweep = Math.sin(b.row) * 0.55 * effort - 0.1 - (1 - effort) * 0.35;
  drawOar(L, 1, sweep);
  drawOar(L, -1, sweep);
  ctx.drawImage(s.hull, -s.w / 2, -s.h / 2, s.w, s.h);
}

// A slow, shallow swell that rocks the water sideways; leaves ride the same swell.
function swellX(sy) {
  return (PIXEL_ART ? 0.2 : 1) * (Math.sin(sy * 0.014 / unit + time * 0.42) * 5.4 + Math.sin(sy * 0.037 / unit - time * 0.28) * 2.4) * unit;
}

function drawWater() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = PIXEL_ART ? '#2a44a8' : '#3a6a9c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Strips are kept short enough that neighbouring ones shift by about a pixel at most.
  const band = Math.max(1, Math.round(6 * rs));
  const k = dpr / rs;
  for (let y = 0; y < canvas.height; y += band) {
    const bh = Math.min(band, canvas.height - y);
    // Whole-pixel shifts in pixel mode, so the flat water never smears between two shades.
    const dx = swellX(y / rs + 3) * rs;
    ctx.drawImage(water, 0, y * k, water.width, bh * k, PIXEL_ART ? Math.round(dx) : dx, y, canvas.width, bh);
  }
}

function render() {
  drawWater();
  if (!PIXEL_ART) drawSunlight();
  drawShimmer();
  drawChannelWash();
  drawRipples();
  if (!PIXEL_ART) drawGardenUnder();
  if (PIXEL_ART) drawFishAndShadows();
  if (GRASS_MAT) drawGrass(); else drawLeaves();
  if (!PIXEL_ART) drawGardenOver(false);
  if (PIXEL_ART) {
    drawMysteryGround();
    drawFloaters(false);
    drawBridges(false);
  }
  drawBoat(boat);
  drawFlowers();
  if (!PIXEL_ART) drawGardenOver(true);
  if (PIXEL_ART) {
    drawFrogs();
    drawFloaters(true);
    drawBridges(true);
    drawFlies();
    drawMysteryAir();
    pixelate();
    drawMoodTint();
    return;
  }
  drawSunVeil();
  drawGardenAir();

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = 0.32;
  ctx.fillStyle = grain;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// Cozy pixel-art shade ramps, darkest first. The first shade of every ramp doubles as its
// outline. Layers decide what gets outlined against what: water lies under pads, and pads
// under the boat and blooms.
const PIXEL_RAMPS = {
  water: ['#14215a', '#1c3584', '#2650ad', '#3168c4', '#62a0ea', '#b4dcff'],
  teal: ['#0c3630', '#176450', '#248e6e', '#46b888', '#98e2ae'],
  green: ['#143a1c', '#22672c', '#38963a', '#68c24e', '#b2e678'],
  olive: ['#2a3812', '#4c6820', '#74942e', '#9cba48', '#cce08a'],
  pink: ['#5a1236', '#a2265c', '#e04c8c', '#f78ebe', '#ffd8ea'],
  red: ['#48100c', '#8e2416', '#cc4228', '#f06c42', '#ffa877'],
  wood: ['#3a2010', '#6e4424', '#a26e3c', '#d4a05e', '#f2d08e'],
  cream: ['#4c4460', '#9c90b0', '#dcd4e6', '#fff6ec'],
  gold: ['#5c3a0c', '#b07818', '#f2c23a', '#fff09a'],
  grass: ['#23401c', '#4a7a2a', '#6a9e34', '#86b842', '#a2cc52', '#c4e276'],
  bank: ['#2a1610', '#56301e', '#844a2a', '#b0683a', '#cc8a50'],
  sand: ['#5e4424', '#b08a4c', '#d8b868', '#ecd28a', '#fbeab4'],
  leaf: ['#0f2e22', '#1e5a30', '#2e7e38', '#4ca23c', '#7ac448', '#b2e066'],
  bark: ['#24120c', '#4a2a1c', '#74442a', '#9c643c', '#c08a58'],
  stone: ['#26242e', '#55546a', '#8a8898', '#b6b4be', '#e2e0e0'],
  rust: ['#3a1408', '#7a2e12', '#b04a1c', '#d8702a', '#f4a04a'],
  berry: ['#4a0a1a', '#9e1a2e', '#e03a44', '#ff8a80'],
  bloomB: ['#1c2a6a', '#3a5ad0', '#6e9cff', '#cce0ff'],
  bloomY: ['#6a4a10', '#d89a1c', '#ffd23a', '#fff8c0'],
  petal: ['#3e3450', '#b8b0cc', '#f4f0f8', '#ffffff'],
  beak: ['#5a2408', '#c45a14', '#ff9a2a', '#ffd070'],
  bridge: ['#0a2634', '#1a5446', '#2a7e5e', '#4aa878', '#8ad49a'],
  turf: ['#1c3a22', '#2e6430', '#468a34', '#5ea23c', '#78ba46', '#9cd25a', '#c4e67c'],
  pine: ['#0c2622', '#154236', '#1d5e44', '#2a7a50', '#43985c', '#6cb86c'],
};
// Islets, rocks, wildlife and bridges (layer 2) are drawn unscaled with their outlines
// already painted in, so pixelate() leaves them alone; the boat and blooms (layer 3) sit
// above them.
const PIXEL_LAYER = { water: 0, teal: 1, green: 1, olive: 1 };
const SPRITE_RAMPS = ['grass', 'bank', 'sand', 'leaf', 'bark', 'stone', 'rust', 'berry', 'bloomB', 'bloomY', 'petal', 'beak', 'bridge', 'turf', 'pine'];
for (const name of SPRITE_RAMPS) PIXEL_LAYER[name] = 2;

let pixelPal = null, pixelIdx = null;
function buildPixelPalette() {
  const rgb = [], ramp = [], dark = [], darker = [], shadow = [], layer = [];
  Object.entries(PIXEL_RAMPS).forEach(([name, shades], ri) => {
    const base = rgb.length;
    shades.forEach((hex, j) => {
      const n = parseInt(hex.slice(1), 16);
      rgb.push([(n >> 16) & 255, (n >> 8) & 255, n & 255]);
      ramp.push(ri);
      dark.push(base);
      darker.push(base + Math.max(0, j - 1));
      shadow.push(base + Math.max(0, j - 2));
      layer.push(PIXEL_LAYER[name] ?? 3);
    });
  });
  // Nearest shade by a perceptual-ish weighted distance, for every 5-bit RGB cell.
  const lut = new Uint8Array(32768);
  for (let i = 0; i < 32768; i++) {
    const r = ((i >> 10) << 3) + 4, g = (((i >> 5) & 31) << 3) + 4, b = ((i & 31) << 3) + 4;
    let best = 0, bd = Infinity;
    for (let j = 0; j < rgb.length; j++) {
      if (layer[j] === 2) continue;
      const dr = r - rgb[j][0], dg = g - rgb[j][1], db = b - rgb[j][2];
      const d = dr * dr * 3 + dg * dg * 4 + db * db * 2;
      if (d < bd) { bd = d; best = j; }
    }
    lut[i] = best;
  }
  // Sprite colours only ever arrive exact, so they claim just their own cells and the soft
  // edges of leaves and the boat never snap to them.
  rgb.forEach(([r, g, b], j) => {
    if (layer[j] === 2) lut[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)] = j;
  });
  pixelPal = {
    lut, ramp: Uint8Array.from(ramp), dark: Uint8Array.from(dark), darker: Uint8Array.from(darker),
    shadow: Uint8Array.from(shadow), layer: Uint8Array.from(layer),
    rgba: Uint32Array.from(rgb, ([r, g, b]) => (0xff000000 | (b << 16) | (g << 8) | r) >>> 0),
  };
}

// Snap every pixel to a ramp shade, then outline each object in the darkest shade of its
// own ramp wherever it meets something beneath it, and drop a small shadow down-right.
function pixelate() {
  if (!pixelPal) buildPixelPalette();
  const { lut, ramp, dark, darker, shadow, layer, rgba } = pixelPal;
  const W = view.width, H = view.height;
  viewCtx.drawImage(canvas, 0, 0);
  const img = viewCtx.getImageData(0, 0, W, H);
  const d = img.data, out = new Uint32Array(d.buffer);
  if (!pixelIdx || pixelIdx.length !== W * H) pixelIdx = new Uint8Array(W * H);
  const idx = pixelIdx;
  for (let p = 0, i = 0; p < W * H; p++, i += 4) {
    idx[p] = lut[((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3)];
  }
  for (let y = 0, p = 0; y < H; y++) {
    for (let x = 0; x < W; x++, p++) {
      const c = idx[p], L = layer[c];
      const u = y > 0 ? idx[p - W] : c, l = x > 0 ? idx[p - 1] : c;
      const ul = y > 0 && x > 0 ? idx[p - W - 1] : c;
      let o = c;
      if (L === 0) {
        const ul2 = y > 1 && x > 0 ? layer[idx[p - 2 * W - 1]] : 0;
        if (layer[u] || layer[ul] || ul2) o = shadow[c];
      } else if (L === 2) {
        if (layer[ul] > L) o = darker[c];
      } else {
        const dn = y < H - 1 ? idx[p + W] : c, r = x < W - 1 ? idx[p + 1] : c;
        if (layer[u] < L || layer[dn] < L || layer[l] < L || layer[r] < L) o = dark[c];
        else if ((layer[u] === L && ramp[u] !== ramp[c]) || (layer[l] === L && ramp[l] !== ramp[c])) o = dark[c];
        else if (layer[ul] > L) o = darker[c];
      }
      out[p] = rgba[o];
    }
  }
  viewCtx.putImageData(img, 0, 0);
}

/* ---------- pixel-art water life ---------- */

// In pixel art the lake carries little floating islets of turf or sand, each with a tree,
// bushes, ferns, flowers or a rock on it, along with reed clumps, logs, ducks and frogs,
// all pushed aside like the pads. A few rocks and the rare arched footbridge stay put.
// Everything is pre-rendered at the virtual pixel size and drawn unscaled at whole pixels,
// so its exact palette colours survive pixelate(). Counts are means per chunk.
const ISLETS = 1.6, REED_CLUMPS = 0.6, FIXED_ROCKS = 0.3, LOGS = 0.3, DUCKS = 0.3, BRIDGE = 0.1;
const ISLET_MIX = [[16, 'grove'], [16, 'tree'], [18, 'bush'], [22, 'small'], [8, 'sandbar'], [8, 'rocky']];
// Islets are heavier than pads, so they give way slowly and drift home slowly.
const ISLET_MASS = 2.4;
// On the grass meadow the islets are groves and thickets standing on the turf, so there are
// more of them; streams and pools wind between the fields, and many pads carry a small plant.
const MEADOW_ISLETS = 4.5, PAD_DECOR = 0.22, RIVER_BANK = 0.55;
const MEADOW_MIX = [[18, 'grove'], [22, 'tree'], [20, 'pines'], [16, 'bush'], [14, 'small'], [8, 'rocky']];
// How far a pad's grass reaches, in pad radii, and the field level where it turns solid.
const GRASS_REACH = 1.45, GRASS_LEVEL = 0.5;
// Tiny details stamped onto the turf: digits are grass shades, letters are blooms and
// pebbles (see detailColors).
const DETAILS = {
  tuft: [['5.5', '434', '.2.'], ['..5..', '5.4.5', '43434', '.222.'], ['.5.', '4.4', '232'], ['3.3', '232', '.1.']],
  flower: [['.w.', 'wyw', '.w.', '.3.'], ['.r.', 'rRr', '.r.', '.3.'], ['.b.', 'bBb', '.b.', '.3.'], ['Y..', 'y.Y', '.y.'], ['R.r', '.3.', 'r.R']],
  pebble: [['.SS.', 'Ssss', '.dd.'], ['S.', 'sd']],
  sand: [['kK'], ['K'], ['.SS', 'Ssd']],
};
let pxs = 1, pixelChunks = new Map(), decorSprites = null, waterRGBA = null, outlineOf = null, detailColors = null;
let floaters = [], frogs = [], fishes = [], flies = [], bridges = [];
let grass = null;

// Roughly how far (in world units) a point is from open water: a winding stream along one
// noise contour and the odd round pool. Negative inside the water.
function riverAt(x, y) {
  const s = 0.0011 / unit;
  const river = (Math.abs(fbm(x * s, y * s * 1.3, 29.3) - 0.5) - 0.034) / (0.6 * s);
  const pool = (0.76 - fbm(x * s * 2.2, y * s * 2.2, 71.9)) / (1.2 * s);
  return Math.min(river, pool);
}

const hexRGBA = (hex) => {
  const n = parseInt(hex.slice(1), 16);
  return (0xff000000 | ((n & 255) << 16) | (n & 0xff00) | ((n >> 16) & 255)) >>> 0;
};

function setupPixelWorld() {
  if (!pixelPal) buildPixelPalette();
  outlineOf = new Map();
  for (const shades of Object.values(PIXEL_RAMPS)) {
    for (const hex of shades) outlineOf.set(hexRGBA(hex), hexRGBA(shades[0]));
  }
  waterRGBA = new Set(PIXEL_RAMPS.water.map(hexRGBA));
  const { grass: G, bloomY: Y, bloomB: B, petal: P, berry: R, stone: St, sand: Sd } = PIXEL_RAMPS;
  detailColors = {
    1: G[1], 2: G[2], 3: G[3], 4: G[4], 5: G[5], y: Y[2], Y: Y[3], b: B[2], B: B[3], w: P[2], r: R[2], R: R[3],
    s: St[2], S: St[3], d: St[1], k: Sd[1], K: Sd[4],
  };
  pxs = clamp(unit * rs * 2.55, 0.6, 1.6);
  pixelChunks = new Map();
  grass = null;
  decorSprites = makeDecorSprites();
  mysterySprites = makeMysterySprites();
}

/* pixel sprites */

// Hard-edged shapes in exact palette colours on a canvas measured in virtual pixels.
function pixelPen(W, H) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(W);
  c.height = Math.ceil(H);
  const g = c.getContext('2d');
  const fill = (color, x, y, fw, fh) => { g.fillStyle = color; g.fillRect(x, y, fw, fh); };
  return {
    c, g,
    dot: (x, y, color) => fill(color, Math.round(x), Math.round(y), 1, 1),
    rect: (x, y, rw, rh, color) => fill(color, Math.round(x), Math.round(y), Math.round(rw), Math.round(rh)),
    oval(cx, cy, rx, ry, color) {
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
        const t = (y + 0.5 - cy) / ry;
        if (Math.abs(t) > 1) continue;
        const half = rx * Math.sqrt(1 - t * t);
        const x0 = Math.round(cx - half), x1 = Math.round(cx + half);
        if (x1 > x0) fill(color, x0, y, x1 - x0, 1);
      }
    },
    line(x0, y0, x1, y1, color, lw = 1) {
      const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
      for (let i = 0; i <= n; i++) {
        fill(color, Math.round(x0 + ((x1 - x0) * i) / n - (lw - 1) / 2), Math.round(y0 + ((y1 - y0) * i) / n - (lw - 1) / 2), lw, lw);
      }
    },
  };
}

// A one-pixel outline in the darkest shade of whatever it borders. Water-coloured foam
// is left open, so rocks and ducks are outlined against it.
function finishSprite(p, ax, ay, extra = {}) {
  const { c, g } = p, W = c.width, H = c.height;
  const img = g.getImageData(0, 0, W, H);
  const px = new Uint32Array(img.data.buffer), src = px.slice();
  const solid = (q) => src[q] >>> 24 && !waterRGBA.has(src[q]);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const q = y * W + x;
      if (solid(q)) continue;
      const n = x > 0 && solid(q - 1) ? q - 1 : x < W - 1 && solid(q + 1) ? q + 1 : y > 0 && solid(q - W) ? q - W : y < H - 1 && solid(q + W) ? q + W : -1;
      if (n >= 0) px[q] = outlineOf.get(src[n]) ?? src[n];
    }
  }
  g.putImageData(img, 0, 0);
  return { c, ax: Math.round(ax), ay: Math.round(ay), ...extra };
}

function mirrored(sp) {
  const c = document.createElement('canvas');
  c.width = sp.c.width;
  c.height = sp.c.height;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.scale(-1, 1);
  g.drawImage(sp.c, -c.width, 0);
  return c;
}

// Puffy foliage: overlapping round blobs, each with its own dark rim, body, lit cap and
// glint, lighter toward the upper left, back blobs first so the front ones cut into them.
function blobCluster(p, cx, cy, blobs, R, r) {
  const top = R.length - 1;
  for (const [bx, by, br] of blobs) p.oval(cx + bx + 0.6, cy + by + 1.4, br, br * 0.9, R[1]);
  for (const [bx, by, br] of blobs) {
    const lit = clamp(0.55 - ((bx * 0.6 + by) / r) * 0.7, 0, 1);
    const body = lit > 0.5 ? 3 : 2;
    p.oval(cx + bx, cy + by, br, br * 0.9, R[1]);
    p.oval(cx + bx - 0.4, cy + by - 0.6, br - 1, (br - 1) * 0.9, R[body]);
    p.oval(cx + bx - br * 0.3, cy + by - br * 0.34, br * 0.52, br * 0.4, R[Math.min(top, body + 1)]);
    if (lit > 0.4) p.oval(cx + bx - br * 0.42, cy + by - br * 0.5, Math.max(1, br * 0.22), Math.max(0.8, br * 0.15), R[Math.min(top, body + 2)]);
  }
}

function sprinkle(p, cx, cy, rx, ry, n, rampName) {
  const R = PIXEL_RAMPS[rampName];
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random());
    const x = Math.round(cx + Math.cos(a) * d * rx), y = Math.round(cy + Math.sin(a) * d * ry);
    if (rampName === 'bloomB') {
      p.dot(x - 1, y, R[2]); p.dot(x + 1, y, R[2]); p.dot(x, y - 1, R[2]); p.dot(x, y + 1, R[2]);
      p.dot(x, y, R[3]);
    } else {
      p.rect(x, y, 2, 2, R[2]);
      p.dot(x, y, R[3]);
      p.dot(x + 1, y + 1, R[1]);
    }
  }
}

function makePixelTree(rampName, fruit) {
  const R = PIXEL_RAMPS[rampName], B = PIXEL_RAMPS.bark;
  const r = Math.round(rand(11, 15) * pxs), trunkH = Math.round(rand(6, 9) * pxs), tw = Math.max(3, Math.round(r * 0.34));
  const W = r * 2 + 8, H = Math.round(r * 1.8) + trunkH + 6;
  const p = pixelPen(W, H), cx = W / 2, cy = r + 3, base = H - 3, tx = Math.round(cx - tw / 2);
  p.rect(tx - 1, base - 2, tw + 2, 2, B[2]);
  p.dot(tx - 2, base - 1, B[2]);
  p.dot(tx + tw + 1, base - 1, B[1]);
  p.rect(tx, cy, tw, base - cy, B[2]);
  p.rect(tx, cy, 1, base - cy - 1, B[3]);
  p.rect(tx + tw - 1, cy, 1, base - cy, B[1]);
  const blobs = [[0, -r * 0.1, r * 0.6]];
  const n = 6 + ((Math.random() * 2) | 0);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand(-0.2, 0.2), br = r * rand(0.38, 0.5);
    blobs.push([Math.cos(a) * (r - br) * 0.95, Math.sin(a) * (r - br) * 0.85, br]);
  }
  blobs.sort((a, b) => a[1] - b[1]);
  blobCluster(p, cx, cy, blobs, R, r);
  if (fruit) sprinkle(p, cx, cy, r * 0.7, r * 0.6, 6 + ((Math.random() * 3) | 0), fruit);
  return finishSprite(p, cx, base, { fr: r, sh: Math.round(r * 0.85) });
}

function makePixelBush(rampName, fruit) {
  const R = PIXEL_RAMPS[rampName];
  const r = Math.round(rand(6, 9) * pxs);
  const W = r * 2 + 6, H = Math.round(r * 1.6) + 6;
  const p = pixelPen(W, H), cx = W / 2, base = H - 3, cy = base - r * 0.75;
  const blobs = [[0, 0, r * 0.65]];
  const n = 5 + ((Math.random() * 2) | 0);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + rand(-0.3, 0.3), br = r * rand(0.42, 0.55);
    blobs.push([Math.cos(a) * (r - br), Math.sin(a) * (r - br) * 0.62, br]);
  }
  blobs.sort((a, b) => a[1] - b[1]);
  blobCluster(p, cx, cy, blobs, R, r);
  if (fruit) sprinkle(p, cx, cy - 1, r * 0.75, r * 0.5, 4 + ((Math.random() * 3) | 0), fruit);
  return finishSprite(p, cx, base, { fr: r, sh: r });
}

// Fronds fanning out from the middle, upper ones lit.
function makePixelFern() {
  const R = PIXEL_RAMPS.leaf;
  const L = Math.round(rand(7, 9.5) * pxs), W = L * 2 + 6, H = Math.round(L * 1.4) + 6;
  const p = pixelPen(W, H), cx = W / 2, cy = H - 4 - L * 0.3;
  const fronds = Array.from({ length: 8 }, (_, i) => -Math.PI + (i / 7) * Math.PI + rand(-0.15, 0.15));
  fronds.push(rand(0.4, 0.9), Math.PI - rand(0.4, 0.9));
  fronds.sort((a, b) => Math.sin(a) - Math.sin(b));
  for (const a of fronds) {
    const len = L * rand(0.8, 1.05) * (Math.sin(a) > 0 ? 0.65 : 1);
    const dx = Math.cos(a), dy = Math.sin(a) * 0.75;
    const tx = cx + dx * len, ty = cy + dy * len;
    const lit = dy < 0 && dx < 0.4;
    p.line(cx, cy, cx + dx * len * 0.6, cy + dy * len * 0.6, R[lit ? 2 : 1], 2);
    p.line(cx, cy, tx, ty, R[lit ? 3 : 2]);
    const nx = -dy, ny = dx;
    for (let t = 0.3; t < 0.95; t += 0.2) {
      const x = cx + dx * len * t, y = cy + dy * len * t, k = 1.8 * (1.1 - t);
      p.line(x, y, x + nx * k, y + ny * k, R[lit ? 4 : 3]);
      p.line(x, y, x - nx * k, y - ny * k, R[lit ? 3 : 2]);
    }
  }
  p.oval(cx, cy, 1.6, 1.2, R[1]);
  return finishSprite(p, cx, cy + 2, { fr: Math.round(L * 0.75), sh: Math.round(L * 0.65) });
}

// A rosette of pointed red leaves around a green heart, the back leaves standing up.
function makePixelSpiky(rampName) {
  const R = PIXEL_RAMPS[rampName], G = PIXEL_RAMPS.leaf;
  const L = Math.round(rand(5.5, 7) * pxs), W = L * 2 + 6, H = Math.round(L * 1.7) + 6;
  const p = pixelPen(W, H), cx = W / 2, cy = H - 3 - L * 0.6;
  const n = 7 + ((Math.random() * 3) | 0);
  const blades = Array.from({ length: n }, (_, i) => (i / n) * Math.PI * 2 + rand(-0.2, 0.2));
  blades.sort((a, b) => Math.sin(a) - Math.sin(b));
  for (const a of blades) {
    const back = Math.sin(a) < 0, len = L * rand(0.85, 1.1) * (back ? 1 : 0.75);
    const tx = cx + Math.cos(a) * len * 0.8, ty = cy + Math.sin(a) * len * 0.5 - (back ? len * 0.5 : 0);
    const lit = Math.cos(a) < 0.3 && back;
    p.line(cx, cy, cx + (tx - cx) * 0.55, cy + (ty - cy) * 0.55, R[lit ? 2 : 1], 2);
    p.line(cx, cy, tx, ty, R[lit ? 3 : 2]);
  }
  p.oval(cx, cy, 2, 1.4, G[3]);
  p.dot(cx - 1, cy - 1, G[4]);
  return finishSprite(p, cx, cy + 2, { fr: Math.round(L * 0.8), sh: Math.round(L * 0.7) });
}

function makePixelBoulder(rampName, r, foam) {
  const R = PIXEL_RAMPS[rampName];
  const W = Math.ceil(r * 2.6) + 8, H = Math.ceil(r * 1.9) + 7;
  const p = pixelPen(W, H), cx = W / 2, base = H - 3, cy = base - r * 0.72;
  if (foam) {
    const F = PIXEL_RAMPS.water;
    p.oval(cx, base - 0.5, r * 1.25 + 1.5, 2, F[4]);
    p.dot(cx - r * 1.3 - 2, base, F[5]);
    p.dot(cx + r * 1.2 + 2, base - 1, F[5]);
  }
  const lumps = [[0, 0, r, r * 0.74], [rand(-0.4, 0.4) * r, -r * 0.28, r * rand(0.6, 0.75), r * rand(0.5, 0.62)]];
  if (r > 5 && Math.random() < 0.6) lumps.push([rand(0.5, 0.8) * r * (Math.random() < 0.5 ? -1 : 1), r * 0.15, r * 0.55, r * 0.45]);
  for (const [x, y, a, b] of lumps) p.oval(cx + x, cy + y, a, b, R[1]);
  for (const [x, y, a, b] of lumps) p.oval(cx + x - 0.6, cy + y - 0.8, a - 0.8, b - 0.8, R[2]);
  for (const [x, y, a, b] of lumps) p.oval(cx + x - a * 0.3, cy + y - b * 0.35, a * 0.5, b * 0.42, R[3]);
  const [hx, hy, ha, hb] = lumps[1];
  p.oval(cx + hx - ha * 0.4, cy + hy - hb * 0.45, Math.max(1, r * 0.2), Math.max(0.7, r * 0.12), R[4]);
  if (r >= 5) {
    let x = cx + rand(-0.3, 0.3) * r, y = cy - r * 0.5;
    for (let k = 0; k < 3; k++) {
      const nx = x + rand(-1.6, 1.6), ny = y + r * 0.26;
      p.line(x + 1, y, nx + 1, ny, R[3]);
      p.line(x, y, nx, ny, R[1]);
      x = nx; y = ny;
    }
  }
  return finishSprite(p, cx, base, { fr: Math.round(r + 1), sh: Math.round(r * 1.1 + 1) });
}

function makePixelMushrooms() {
  const R = PIXEL_RAMPS[Math.random() < (GRASS_MAT ? 0.9 : 0.7) ? 'berry' : 'bloomY'], P = PIXEL_RAMPS.petal;
  const W = 16, H = 13, p = pixelPen(W, H), base = H - 3;
  const caps = [[8, 0, 1]];
  if (Math.random() < 0.7) caps.push([4, -1, 0.7]);
  if (Math.random() < 0.5) caps.push([11.5, 0.5, 0.65]);
  caps.sort((a, b) => a[1] - b[1]);
  for (const [x, dy, s] of caps) {
    const stem = Math.round(2.5 * s + 1), top = base + dy - stem;
    p.rect(x - 1, top, 2, stem, P[2]);
    p.rect(x, top, 1, stem, P[1]);
    p.oval(x + 0.3, top + 0.4, 3 * s + 0.6, 2 * s + 0.4, R[1]);
    p.oval(x, top, 3 * s + 0.3, 2 * s, R[2]);
    p.dot(x - 1.5 * s, top - 1 * s, R[3]);
    p.dot(x + 0.8 * s, top - 0.6 * s, P[3]);
    if (s > 0.8) p.dot(x - 2 * s, top + 0.4, P[3]);
  }
  return finishSprite(p, 8, base, { fr: 4, sh: 4 });
}

function makePixelStump() {
  const B = PIXEL_RAMPS.bark, S = PIXEL_RAMPS.sand;
  const r = Math.round(rand(4, 6) * pxs), W = r * 2 + 10, H = r + 12;
  const p = pixelPen(W, H), cx = Math.round(W / 2), base = H - 3, top = base - 4;
  p.oval(cx, base - 1, r + 2.5, 1.6, B[1]);
  p.rect(cx - r, top, r * 2, base - top, B[2]);
  p.oval(cx, base - 1, r, r * 0.4, B[2]);
  p.rect(cx - r, top, 1, base - top - 1, B[3]);
  p.rect(cx + r - 1, top, 1, base - top, B[1]);
  p.rect(cx - 1, top + 1, 1, base - top - 1, B[1]);
  p.oval(cx, top, r, r * 0.5, S[1]);
  p.oval(cx - 0.3, top - 0.4, r - 0.8, r * 0.5 - 0.6, S[2]);
  p.oval(cx, top, r * 0.5, r * 0.26, S[1]);
  p.dot(cx, top, S[3]);
  return finishSprite(p, cx, base, { fr: r + 1, sh: r + 2 });
}

function makePixelPalm() {
  const B = PIXEL_RAMPS.bark, G = PIXEL_RAMPS.leaf;
  const h = Math.round(rand(16, 22) * pxs), lean = rand(3, 6) * (Math.random() < 0.5 ? -1 : 1) * pxs, L = rand(10, 13) * pxs;
  const W = Math.ceil(L * 2 + Math.abs(lean) * 2 + 10), H = Math.ceil(h + L * 0.7 + 10);
  const p = pixelPen(W, H), bx = Math.round(W / 2), base = H - 3;
  let tx = bx, ty = base;
  for (let i = 0; i <= h; i++) {
    const t = i / h, x = Math.round(bx + lean * t * t - 1.5), y = base - i;
    p.rect(x, y, 3, 1, B[((i / 3) | 0) % 2 ? 3 : 2]);
    p.dot(x + 2, y, B[1]);
    tx = x + 1.5; ty = y;
  }
  const fronds = Array.from({ length: 7 }, (_, i) => (i / 7) * Math.PI * 2 + rand(-0.2, 0.2));
  fronds.sort((a, b) => Math.sin(a) - Math.sin(b));
  for (const a of fronds) {
    const dx = Math.cos(a), dy = Math.sin(a) * 0.55, len = L * rand(0.85, 1.05);
    let x0 = tx, y0 = ty;
    for (let k = 1; k <= len; k++) {
      const t = k / len, x = tx + dx * k, y = ty + dy * k + t * t * len * 0.45;
      p.line(x0, y0 + 1, x, y + 1, G[1], t < 0.7 ? 2 : 1);
      p.line(x0, y0, x, y, G[dy < 0 ? 4 : 3], t < 0.7 ? 2 : 1);
      x0 = x; y0 = y;
    }
  }
  p.rect(tx - 2, ty + 1, 2, 2, B[1]);
  p.rect(tx + 1, ty + 1, 2, 2, B[2]);
  return finishSprite(p, bx, base, { fr: 5, sh: 7 });
}

function makePixelCactus() {
  const G = PIXEL_RAMPS.leaf, P = PIXEL_RAMPS.petal;
  const h = Math.round(rand(10, 15) * pxs), bw = Math.max(4, Math.round(5 * pxs));
  const W = bw + 16, H = h + 8, p = pixelPen(W, H), cx = Math.round(W / 2), base = H - 3;
  const column = (x, y0, y1, cw) => {
    p.oval(x + cw / 2, y0 + cw / 2, cw / 2, cw / 2, G[3]);
    p.rect(x, y0 + cw / 2, cw, y1 - y0 - cw / 2, G[3]);
    p.rect(x, y0 + cw / 2, 1, y1 - y0 - cw / 2, G[4]);
    p.rect(x + cw - 1, y0 + cw / 2, 1, y1 - y0 - cw / 2, G[2]);
  };
  const x0 = cx - Math.round(bw / 2);
  for (const side of [-1, 1]) {
    if (Math.random() < 0.3) continue;
    const ya = Math.round(base - h * rand(0.35, 0.55)), ax = side < 0 ? x0 - 4 : x0 + bw + 1;
    p.rect(side < 0 ? x0 - 2 : x0 + bw, ya, 2, 3, G[2]);
    column(ax, ya - Math.round(rand(4, 6) * pxs), ya + 3, 3);
  }
  column(x0, base - h, base, bw);
  for (let i = 0; i < 4; i++) p.dot(x0 + 1 + rand(0, bw - 2), base - rand(2, h - 2), P[3]);
  if (Math.random() < 0.5) {
    p.rect(cx - 1, base - h - 1, 2, 2, PIXEL_RAMPS.berry[3]);
  }
  return finishSprite(p, cx, base, { fr: 4, sh: 4 });
}

function makePixelReeds() {
  const G = PIXEL_RAMPS.leaf, B = PIXEL_RAMPS.bark;
  const W = 18, H = Math.round(15 * pxs) + 5, p = pixelPen(W, H), cx = W / 2, base = H - 3;
  for (let i = 0; i < 2; i++) p.line(cx + rand(-3, 3), base, cx + rand(-7, 7), base - rand(4, 7) * pxs, G[4]);
  const n = 4 + ((Math.random() * 3) | 0);
  for (let i = 0; i < n; i++) {
    const x = cx + rand(-4, 4), ht = rand(7, 13) * pxs, lean = rand(-2, 2);
    p.line(x, base, x + lean, base - ht, G[i % 2 ? 3 : 2]);
    if (Math.random() < 0.35) {
      const hx = Math.round(x + lean * 0.85) - 1, hy = Math.round(base - ht + 1);
      p.rect(hx, hy, 2, 3, B[2]);
      p.dot(hx, hy, B[3]);
      p.dot(hx + 1, hy - 1, G[3]);
    }
  }
  return finishSprite(p, cx, base, { fr: 4, sh: 0 });
}

// A fir seen from above: a round crown of needle points, with a second ring of points inside
// it, lit at the upper left.
function makePixelFir() {
  const R = PIXEL_RAMPS.pine, B = PIXEL_RAMPS.bark;
  const r = Math.round(rand(9, 13) * pxs), trunkH = Math.round(rand(3, 5) * pxs), tw = Math.max(2, Math.round(r * 0.24));
  const W = r * 2 + 8, H = Math.round(r * 1.85) + trunkH + 6;
  const p = pixelPen(W, H), cx = W / 2, cy = r + 3, base = H - 3, tx = Math.round(cx - tw / 2);
  p.rect(tx, cy, tw, base - cy, B[2]);
  p.rect(tx + tw - 1, cy, 1, base - cy, B[1]);
  p.rect(tx - 1, base - 1, tw + 2, 1, B[2]);
  const n = 11 + ((Math.random() * 4) | 0), ph = rand(0, 6.3);
  const tooth = (a, off) => {
    const f = ((((a + ph) / (Math.PI * 2)) * n + off) % 1 + 1) % 1;
    return 1 - 2 * Math.abs(f - 0.5);
  };
  for (let y = 0; y < base - 1; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x + 0.5 - cx, dy = (y + 0.5 - cy) / 0.9, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
      const t = tooth(a, 0), edge = r * (0.74 + 0.26 * t);
      if (d > edge) continue;
      const lit = -(dx * 0.7 + dy) / r;
      let s = lit > 0.3 ? 3 : lit > -0.3 ? 2 : 1;
      const inner = r * (0.42 + 0.16 * tooth(a, 0.5));
      if (d > inner - 0.9 && d < inner + 0.4) s -= 1;
      else if (d < inner - 0.9) s += lit > -0.2 ? 1 : 0;
      if (d > edge - 1.2 && t > 0.55 && lit > 0) s += 1;
      p.dot(x, y, R[clamp(s, 1, 5)]);
    }
  }
  p.dot(cx - r * 0.35, cy - r * 0.45, R[5]);
  p.dot(cx - r * 0.1, cy - r * 0.2, R[5]);
  return finishSprite(p, cx, base, { fr: r, sh: Math.round(r * 0.9) });
}

// A pine from the side: stacked jagged tiers, each lit on the left and dark underneath, the
// upper ones laid over the lower.
function makePixelPine() {
  const R = PIXEL_RAMPS.pine, B = PIXEL_RAMPS.bark;
  const ht = Math.round(rand(24, 32) * pxs), half = Math.round(ht * rand(0.3, 0.35)), trunkH = Math.max(2, Math.round(3 * pxs));
  const W = half * 2 + 8, H = ht + trunkH + 6, p = pixelPen(W, H), cx = Math.round(W / 2), base = H - 3, top = base - trunkH - ht;
  p.rect(cx - 1, base - trunkH - 2, 3, trunkH + 2, B[2]);
  p.rect(cx + 1, base - trunkH - 2, 1, trunkH + 2, B[1]);
  const tiers = ht > 28 * pxs ? 4 : 3, th = ht * 0.42, stepY = (ht - th) / (tiers - 1);
  for (let i = tiers - 1; i >= 0; i--) {
    const y0 = top + i * stepY, hw0 = half * (0.4 + (0.6 * (i + 1)) / tiers);
    for (let y = Math.round(y0); y <= Math.round(y0 + th); y++) {
      const t = (y - y0) / th, jag = (y - Math.round(y0)) % 3;
      const hw = hw0 * (0.12 + 0.88 * t) - jag * 0.7;
      for (let x = Math.round(cx - hw); x <= Math.round(cx + hw); x++) {
        const u = (x - cx) / Math.max(1, hw);
        let s = u < -0.25 ? 3 : u < 0.4 ? 2 : 1;
        if (y >= Math.round(y0 + th) - 1) s = Math.max(1, s - 1);
        else if (u < -0.6 && jag === 0) s = 4;
        p.dot(x, y, R[s]);
      }
    }
  }
  p.dot(cx, top - 1, R[3]);
  return finishSprite(p, cx, base, { fr: half, sh: half });
}

function makePixelFlowerPatch() {
  const p = pixelPen(15, 11);
  stampPattern(p, pick(DETAILS.tuft), 5, 5);
  for (let i = 0; i < 3; i++) stampPattern(p, pick(DETAILS.flower), 1 + ((Math.random() * 10) | 0), 1 + ((Math.random() * 4) | 0));
  return finishSprite(p, 7, 9, { fr: 5, sh: 0 });
}

// A soft drop shadow on the turf, down and right of a plant's foot: a solid core with a
// checkered rim, so it fades into the grass.
function shadowOval(p, cx, cy, rx, ry) {
  const T = PIXEL_RAMPS.turf;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const t = ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2;
      if (t <= 1 && (t < 0.55 || (x + y) % 2 === 0)) p.dot(x, y, T[1]);
    }
  }
}

// Plants laid on the grass, back to front, each over its own shadow, on one sprite anchored at
// (0, 0) of the items' offsets.
function plantGroup(items) {
  const shadowOf = (sp) => [2, 1, sp.sh * 1.2, Math.max(1.5, sp.sh * 0.5)];
  let x0 = 0, y0 = 0, x1 = 0, y1 = 0;
  for (const [sp, dx, dy] of items) {
    const [sx, sy, rx, ry] = shadowOf(sp);
    x0 = Math.min(x0, dx - sp.ax, dx + sx - rx - 1); y0 = Math.min(y0, dy - sp.ay);
    x1 = Math.max(x1, dx - sp.ax + sp.c.width, dx + sx + rx + 1); y1 = Math.max(y1, dy - sp.ay + sp.c.height, dy + sy + ry + 1);
  }
  const ox = -Math.floor(x0), oy = -Math.floor(y0), p = pixelPen(Math.ceil(x1) + ox, Math.ceil(y1) + oy);
  for (const [sp, dx, dy] of items) {
    if (!sp.sh) continue;
    const [sx, sy, rx, ry] = shadowOf(sp);
    shadowOval(p, ox + dx + sx, oy + dy + sy, rx, ry);
  }
  items.sort((a, b) => a[2] - b[2]);
  for (const [sp, dx, dy] of items) p.g.drawImage(sp.c, Math.round(ox + dx - sp.ax), Math.round(oy + dy - sp.ay));
  return { c: p.c, ax: ox, ay: oy };
}

function makePixelLog() {
  const B = PIXEL_RAMPS.bark, S = PIXEL_RAMPS.sand, F = PIXEL_RAMPS.water;
  const len = Math.round(rand(16, 24) * pxs), th = Math.max(4, Math.round(5 * pxs));
  const W = len + 10, H = th + 9, p = pixelPen(W, H), x0 = 5, y0 = 3;
  p.line(x0 - 2, y0 + th + 1, x0 + len + 1, y0 + th + 1, F[4]);
  p.oval(x0 + 1.5, y0 + th / 2, 1.6, th / 2, B[2]);
  p.rect(x0 + 1, y0, len - 2, th, B[2]);
  p.rect(x0 + 1, y0, len - 2, 1, B[3]);
  p.rect(x0 + 1, y0 + th - 1, len - 2, 1, B[1]);
  for (let k = 0; k < len / 5; k++) p.rect(x0 + rand(3, len - 6), y0 + 1 + ((Math.random() * (th - 2)) | 0), rand(2, 4), 1, B[1]);
  p.oval(x0 + len - 1, y0 + th / 2, 1.8, th / 2, S[2]);
  p.dot(x0 + len - 1, y0 + th / 2, S[1]);
  p.rect(x0 + len * rand(0.25, 0.5), y0 - 2, 2, 2, B[2]);
  for (let k = 0; k < 3; k++) p.dot(x0 + rand(4, len - 4), y0, PIXEL_RAMPS.leaf[4]);
  return finishSprite(p, W / 2, y0 + th / 2);
}

function makePixelDuck(baby) {
  const R = PIXEL_RAMPS[baby ? 'bloomY' : 'petal'], O = PIXEL_RAMPS.beak, F = PIXEL_RAMPS.water;
  const s = baby ? 0.6 : 1, W = 18, H = 14, p = pixelPen(W, H), cx = 8, cy = 8;
  p.line(cx - 6 * s - 1, cy + 3 * s + 2, cx + 5 * s + 1, cy + 3 * s + 2, F[4]);
  p.oval(cx, cy + 0.5, 5 * s, 3 * s, R[1]);
  p.oval(cx - 0.4, cy - 0.2, 4.6 * s, 2.5 * s, R[2]);
  p.oval(cx - 1.5 * s, cy - s, 2.4 * s, 1.2 * s, R[3]);
  p.dot(cx - 5 * s, cy - 2 * s, R[2]);
  const hx = cx + 3.6 * s, hy = cy - 3.6 * s;
  p.oval(hx, hy, 2.3 * s + 0.3, 2.1 * s + 0.3, R[2]);
