  p.dot(hx - 1, hy - 1, R[3]);
  p.dot(hx + 0.6, hy - 0.4, R[0]);
  p.rect(hx + 2 * s + 0.5, hy, baby ? 1 : 2, 1, O[2]);
  const sp = finishSprite(p, cx, cy + 2);
  sp.c2 = mirrored(sp);
  return sp;
}

function makePixelFrog() {
  const G = PIXEL_RAMPS.leaf, P = PIXEL_RAMPS.petal;
  const p = pixelPen(13, 11), cx = 6.5, cy = 6;
  p.oval(cx - 3.6, cy + 2, 1.7, 1.2, G[2]);
  p.oval(cx + 3.6, cy + 2, 1.7, 1.2, G[2]);
  p.oval(cx, cy + 0.5, 3.6, 3, G[2]);
  p.oval(cx - 0.4, cy, 3.1, 2.5, G[3]);
  p.oval(cx - 1, cy - 0.8, 1.5, 0.9, G[4]);
  p.rect(cx - 3, cy - 3, 2, 2, P[3]);
  p.rect(cx + 1, cy - 3, 2, 2, P[3]);
  p.dot(cx - 2, cy - 2, P[0]);
  p.dot(cx + 2, cy - 2, P[0]);
  return finishSprite(p, cx, cy + 3);
}

// A dark silhouette under the surface, facing a, foreshortened like the lake.
function makePixelFish(a) {
  const p = pixelPen(17, 17), c = 8.5, ca = Math.cos(a), sa = Math.sin(a), col = PIXEL_RAMPS.water[1];
  for (let y = 0; y < 17; y++) {
    for (let x = 0; x < 17; x++) {
      const dx = x + 0.5 - c, dy = (y + 0.5 - c) / 0.75;
      const u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
      const body = (u / 4.4) ** 2 + (v / 1.7) ** 2 <= 1;
      const tail = u < -3.4 && u > -6.6 && Math.abs(v) < (-u - 3.4) * 0.9 + 0.4;
      if (body || tail) p.dot(x, y, col);
    }
  }
  return { c: p.c, ax: 8, ay: 8 };
}

function makePixelFly(frame) {
  const B = PIXEL_RAMPS.bloomB, P = PIXEL_RAMPS.petal;
  const p = pixelPen(13, 11), cx = 6, cy = 5, wl = frame ? 2 : 4;
  for (const sy of [-1, 1]) {
    p.line(cx - 1, cy + sy, cx - 2, cy + sy * wl, P[2]);
    p.line(cx + 1, cy + sy, cx + 2, cy + sy * wl, P[3]);
  }
  p.line(cx - 5, cy, cx + 2, cy, B[1]);
  p.line(cx - 4, cy, cx + 1, cy, B[2]);
  p.rect(cx + 2, cy - 1, 2, 2, B[3]);
  return { c: p.c, ax: cx, ay: cy };
}

function stampPattern(p, pat, x, y) {
  for (let r = 0; r < pat.length; r++) {
    for (let k = 0; k < pat[r].length; k++) if (pat[r][k] !== '.') p.dot(x + k, y + r, detailColors[pat[r][k]]);
  }
}

// A floating clump of turf (or sand) with a rooty underside and a rim of foam at the
// waterline. The turf is outlined on its own and the plants, already outlined, are laid on
// top, each with a shadow kept to the turf.
function makeIslet(P, kind) {
  const sandy = kind === 'sandbar', reedy = kind === 'reeds', items = [];
  const any = (...pools) => pick(pools.flat());
  let rx;
  const add = (sp, dx, dy) => items.push([sp, Math.round(dx), Math.round(dy)]);
  const trees = GRASS_MAT ? [...P.tree, ...P.lime, ...P.fir] : P.tree;
  if (kind === 'grove') {
    const t = pick(trees);
    rx = t.fr + 6 * pxs;
    add(t, -rx * 0.18, -rx * 0.08);
    add(any(P.bush, P.bush, P.fern), rx * 0.5, rx * 0.1);
    if (Math.random() < 0.7) add(any(P.redplant, P.mushroom, P.fern, P.bush), -rx * 0.58, rx * 0.16);
    if (GRASS_MAT) {
      add(pick(trees), rx * 0.62, -rx * 0.42);
      if (Math.random() < 0.5) add(any(P.mushroom, P.flowers, P.stump), rx * 0.05, rx * 0.4);
    }
  } else if (kind === 'tree') {
    const t = pick(GRASS_MAT ? [...trees, ...P.pine] : trees);
    rx = t.fr * 0.8 + 3 * pxs;
    add(t, 0, -1);
    if (GRASS_MAT && Math.random() < 0.6) add(any(P.bush, P.fern, P.mushroom, P.flowers), t.fr * 0.9, rx * 0.3);
  } else if (kind === 'pines') {
    const k = 1 + ((Math.random() * 3) | 0), a = any(P.fir, P.pine);
    rx = a.fr + 4 * pxs + (k - 1) * 4 * pxs;
    add(a, -rx * 0.12, -rx * 0.05);
    if (k > 1) add(any(P.fir, P.pine), rx * 0.5, rx * 0.22);
    if (k > 2) add(any(P.fir, P.pine, P.bush), -rx * 0.6, rx * 0.28);
  } else if (kind === 'bush') {
    const b = pick(P.bush);
    rx = b.fr * 1.45 + 3 * pxs;
    add(b, -b.fr * 0.35, 0);
    if (Math.random() < 0.65) add(any(P.bush, P.mushroom, P.fern, P.redplant), b.fr * 0.8, rx * 0.14);
  } else if (kind === 'small') {
    const sp = any(P.fern, P.fern, P.redplant, P.mushroom, P.stump);
    rx = sp.fr * 1.25 + 4 * pxs;
    add(sp, 0, 0);
  } else if (kind === 'sandbar') {
    const sp = any(P.palm, P.palm, P.cactus);
    rx = 10 * pxs + 2;
    add(sp, -rx * 0.12, 0);
    if (Math.random() < 0.5) add(pick(P.rock), rx * 0.55, rx * 0.12);
  } else if (kind === 'rocky') {
    const b = pick(P.boulder);
    rx = b.fr * 1.2 + 4 * pxs;
    add(b, -rx * 0.1, 0);
    if (Math.random() < 0.6) add(any(P.fern, P.rock, P.redplant), rx * 0.6, rx * 0.15);
  } else {
    rx = 7 * pxs + 2;
    for (let i = 0; i < 3; i++) add(pick(P.reeds), (i - 1) * rx * 0.5 + rand(-1, 1), (i % 2) * 2 - 1);
  }
  rx = Math.round(rx);
  // On the meadow the plants stand straight on the grass, which drawGrass() spreads under
  // them, and reeds stand in the water with a ring of foam.
  if (GRASS_MAT) {
    if (reedy) {
      const F = PIXEL_RAMPS.water, ring = pixelPen(rx * 2 + 6, 5);
      ring.oval(rx + 3, 2.5, rx + 1.5, 1.5, F[4]);
      ring.dot(0, 2, F[5]);
      ring.dot(rx * 2 + 5, 2, F[5]);
      items.push([{ c: ring.c, ax: rx + 3, ay: -1, sh: 0 }, 0, -3]);
    }
    return { ...plantGroup(items), r: rx / rs };
  }
  const ry = Math.max(3, Math.round(rx * 0.5)), depth = reedy ? 1 : Math.max(2, Math.round(2.5 * pxs));
  const T = PIXEL_RAMPS[sandy ? 'sand' : 'grass'], E = PIXEL_RAMPS[sandy ? 'sand' : 'bank'], F = PIXEL_RAMPS.water;
  const tw = rx * 2 + 8, th = ry * 2 + depth + 8, cx = tw / 2, cy = ry + 3;
  const turf = pixelPen(tw, th);
  turf.oval(cx + 0.5, cy + depth + 1, rx + 2, ry + 1.2, F[4]);
  turf.dot(cx - rx - 3, cy + depth + 1, F[5]);
  turf.dot(cx + rx + 2, cy + depth, F[5]);
  turf.oval(cx, cy + depth, rx, ry, E[1]);
  turf.oval(cx - 0.4, cy + depth * 0.5, rx - 0.5, ry, E[2]);
  if (!sandy) for (let i = 0; i < rx / 3; i++) turf.dot(cx + rand(-rx * 0.8, rx * 0.8), cy + ry * 0.7 + depth + rand(0, 1), E[3]);
  turf.oval(cx, cy, rx, ry, T[reedy ? 1 : 2]);
  turf.oval(cx - 0.4, cy - 0.6, rx - 0.8, ry - 0.8, T[reedy ? 2 : 3]);
  turf.oval(cx - rx * 0.22, cy - ry * 0.28, rx * 0.6, ry * 0.5, T[reedy ? 2 : 4]);
  if (!reedy) turf.oval(cx - rx * 0.32, cy - ry * 0.55, rx * 0.36, Math.max(0.8, ry * 0.2), T[T.length - 1]);
  if (!reedy) {
    const pats = sandy ? [...DETAILS.sand, ...DETAILS.pebble] : [...DETAILS.tuft, ...DETAILS.tuft, ...DETAILS.flower];
    for (let i = 0; i < Math.max(1, rx / 4); i++) {
      const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * 0.72, pat = pick(pats);
      stampPattern(turf, pat, Math.round(cx + Math.cos(a) * d * rx - 1), Math.round(cy + Math.sin(a) * d * ry - 1));
    }
  }
  const base = finishSprite(turf, cx, cy);
  let x0 = 0, y0 = 0, x1 = tw, y1 = th;
  for (const [sp, dx, dy] of items) {
    x0 = Math.min(x0, cx + dx - sp.ax); y0 = Math.min(y0, cy + dy - sp.ay);
    x1 = Math.max(x1, cx + dx - sp.ax + sp.c.width); y1 = Math.max(y1, cy + dy - sp.ay + sp.c.height);
  }
  const p = pixelPen(x1 - x0, y1 - y0), g = p.g, ox = -Math.floor(x0), oy = -Math.floor(y0);
  g.drawImage(base.c, ox, oy);
  g.globalCompositeOperation = 'source-atop';
  for (const [sp, dx, dy] of items) {
    if (!sp.sh) continue;
    p.oval(ox + cx + dx + 1, oy + cy + dy + 0.5, sp.sh, Math.max(1, sp.sh * 0.4), T[1]);
  }
  g.globalCompositeOperation = 'source-over';
  items.sort((a, b) => a[2] - b[2]);
  for (const [sp, dx, dy] of items) g.drawImage(sp.c, Math.round(ox + cx + dx - sp.ax), Math.round(oy + cy + dy - sp.ay));
  return { c: p.c, ax: Math.round(ox + cx), ay: Math.round(oy + cy), r: rx / rs };
}

// An arched footbridge seen front-on, as in the watercolour, between two stone piers
// standing in the water: the back railing, the plank deck and its front beam, then the
// front railing. The shadow is a separate sprite laid on the water beneath the pads.
function makePixelBridge(rampName) {
  const R = PIXEL_RAMPS[rampName], S = PIXEL_RAMPS.stone, F = PIXEL_RAMPS.water;
  const span = Math.round(rand(74, 92) * pxs), pw = Math.round(9 * pxs) + 3, ph = Math.round(10 * pxs) + 3;
  const archH = Math.round(span * 0.17), dt = Math.max(2, Math.round(2.5 * pxs)), rh = Math.round(7 * pxs) + 2;
  const back = Math.round(5 * pxs) + 1, step = Math.max(6, Math.round(11 * pxs));
  const W = span + pw + 12, H = ph + archH + rh + back + dt + 12;
  const p = pixelPen(W, H), base = H - 4, xl = 6 + pw / 2, xr = xl + span;
  const deck = (x) => base - ph - archH * Math.sin(Math.PI * clamp((x - xl) / span, 0, 1));
  const run = (dy, color, thick, x0 = xl - pw / 2, x1 = xr + pw / 2) => {
    for (let x = Math.round(x0); x < x1; x++) p.rect(x, Math.round(deck(x) + dy), 1, thick, color);
  };
  const posts = (dy, c1, c2) => {
    const n = Math.round(span / step);
    for (let i = 0; i <= n; i++) {
      const x = Math.round(xl + (span * i) / n) - (i === n ? 1 : 0);
      const y = Math.round(deck(x) + dy);
      p.rect(x, y - rh, 2, rh, c1);
      p.dot(x, y - rh, c2);
    }
  };
  posts(-back, R[1], R[2]);
  run(-back - rh, R[2], 1);
  for (let x = Math.round(xl - pw / 2); x < xr + pw / 2; x++) {
    p.rect(x, Math.round(deck(x) - back), 1, back, R[x % 3 ? 3 : 2]);
    p.dot(x, Math.round(deck(x) - back), R[x % 3 ? 4 : 3]);
  }
  run(0, R[2], dt);
  run(dt - 1, R[1], 1);
  for (const x of [xl, xr]) {
    const top = Math.round(deck(x) + dt), left = Math.round(x - pw / 2);
    p.oval(x, base + 0.5, pw * 0.75 + 2, 2, F[4]);
    p.rect(left, top, pw, base - top + 1, S[2]);
    p.rect(left, top, 2, base - top, S[3]);
    p.rect(left + pw - 2, top, 2, base - top + 1, S[1]);
    for (let y = top + 3; y < base; y += 3) {
      p.rect(left + 1, y, pw - 2, 1, S[1]);
      p.dot(left + ((y / 3) % 2 ? pw * 0.5 : 2), y + 1, S[1]);
    }
    p.rect(left - 1, top - 1, pw + 2, 2, S[3]);
    p.rect(left - 1, top - 1, pw + 2, 1, S[4]);
    const side = x === xl ? -1 : 1;
    p.oval(x + side * (pw * 0.6 + 2), base - 1, 2.5 * pxs + 1, 1.8 * pxs + 1, S[2]);
    p.dot(x + side * (pw * 0.6 + 2) - 1, base - 2, S[3]);
  }
  posts(0, R[3], R[4]);
  run(-rh, R[3], 2);
  run(-rh, R[4], 1);
  run(-Math.round(rh * 0.5), R[2], 1, xl, xr);
  const sp = finishSprite(p, (xl + xr) / 2, base);
  const sh = pixelPen(W + 8, archH + 10), shadowY = 4;
  for (let x = Math.round(xl - pw / 2); x < xr + pw / 2; x++) {
    sh.rect(x + 5, shadowY + (x > xl && x < xr ? 2 : 0), 1, dt + 3, F[1]);
  }
  return { ...sp, shadow: { c: sh.c, ax: sp.ax, ay: 0 }, half: span / 2 / rs, pier: pw / rs };
}

function makeDecorSprites() {
  const n = (k, f) => Array.from({ length: k }, f);
  const P = {
    tree: [...n(7, () => makePixelTree('leaf')), makePixelTree('leaf', 'berry'), makePixelTree('leaf', 'bloomY'), makePixelTree('leaf', 'petal'), makePixelTree(GRASS_MAT ? 'grass' : 'rust')],
    bush: [...n(3, () => makePixelBush('leaf')), makePixelBush('leaf', 'berry'), makePixelBush('leaf', 'berry'), makePixelBush('leaf', 'bloomB'), makePixelBush('leaf', 'bloomB'), makePixelBush('leaf', 'bloomY'), makePixelBush(GRASS_MAT ? 'grass' : 'rust')],
    fern: n(4, makePixelFern),
    redplant: [makePixelSpiky('berry'), makePixelSpiky('berry'), makePixelSpiky('rust')],
    boulder: [...n(4, () => makePixelBoulder('stone', rand(5, 8) * pxs)), makePixelBoulder('bank', rand(5, 7) * pxs)],
    rock: n(4, () => makePixelBoulder('stone', rand(2.5, 3.5) * pxs)),
    mushroom: n(4, makePixelMushrooms),
    stump: n(3, makePixelStump),
    palm: n(4, makePixelPalm),
    cactus: n(3, makePixelCactus),
    reeds: n(6, makePixelReeds),
  };
  let padDecor = [];
  if (GRASS_MAT) {
    Object.assign(P, {
      lime: [...n(3, () => makePixelTree('grass')), makePixelTree('grass', 'berry')],
      fir: n(5, makePixelFir),
      pine: n(4, makePixelPine),
      flowers: n(5, makePixelFlowerPatch),
    });
    const small = P.bush.filter((b) => b.fr <= 8 * pxs);
    padDecor = [...small, ...P.bush, ...P.fern, ...P.fern, ...P.mushroom, ...P.mushroom, ...P.flowers, ...P.flowers, ...P.stump, ...P.rock, ...P.redplant, ...P.fir.slice(0, 2), ...P.lime.slice(0, 1)]
      .map((sp) => plantGroup([[sp, 0, 0]]));
  }
  const islet = {};
  for (const [, kind] of GRASS_MAT ? MEADOW_MIX : ISLET_MIX) islet[kind] = n(kind === 'small' || kind === 'bush' ? 8 : 6, () => makeIslet(P, kind));
  return {
    islet,
    padDecor,
    reeds: n(5, () => makeIslet(P, 'reeds')),
    waterRock: n(5, () => makePixelBoulder('stone', rand(3.5, 7) * pxs, true)),
    bridge: [makePixelBridge('bridge'), makePixelBridge('bridge'), makePixelBridge('bark')],
    log: n(3, makePixelLog),
    duck: makePixelDuck(false),
    duckling: makePixelDuck(true),
    frog: n(3, makePixelFrog),
    fish: n(8, (_, i) => makePixelFish((i / 8) * Math.PI * 2)),
    fly: [makePixelFly(0), makePixelFly(1)],
  };
}

/* chunks */

function rollMix(mix) {
  let r = rng() * mix.reduce((s, m) => s + m[0], 0);
  for (const [weight, kind] of mix) if ((r -= weight) < 0) return kind;
  return mix[mix.length - 1][1];
}

// How close a pad or another floating thing may come to something solid. Pads may tuck a
// little under an islet's rim, but never under the middle of it.
function solidGap(a, b) {
  if (a.solid && b.solid) return (a.r + b.r) * 0.85;
  return a.solid ? a.r + b.r * 0.35 : b.r + a.r * 0.35;
}

// False as soon as ok() rejects a solid within reach of (x, y).
function solidsNear(x, y, reach, ok) {
  const g = Math.ceil(reach / leafCell), gx = Math.floor(x / leafCell), gy = Math.floor(y / leafCell);
  for (let ox = -g; ox <= g; ox++) {
    for (let oy = -g; oy <= g; oy++) {
      const bucket = placed.get((gx + ox) + ',' + (gy + oy));
      if (bucket) for (const o of bucket) if (o.solid && !ok(o)) return false;
    }
  }
  return true;
}

function padFits(x, y, r) {
  const pad = { r, solid: false };
  return solidsNear(x, y, r + 80 * unit, (o) => Math.hypot(o.hx - x, o.hy - y) > solidGap(pad, o) * 0.9);
}

// Blooms and frogs are drawn above the boat, so they'd show through a bridge behind it.
function underBridge(x, y, r) {
  for (const pc of pixelChunks.values()) {
    for (const b of pc.bridges) {
      if (Math.abs(x - b.x) < b.sp.half + r && y < b.y + r && y > b.y - b.sp.c.height / (K * rs) - r) return true;
    }
  }
  return false;
}

function floater(x, y, r, sprite, extra) {
  return {
    x, y, hx: x, hy: y, ox: x, oy: y, vx: 0, vy: 0, r, qx: 0, qy: 0, a: 0, spin: rng() < 0.5 ? -1 : 1,
    phase: rand(0, Math.PI * 2), float: sprite, solid: true, flip: 1, stretch: 1, flower: null, face: 1,
    cell: Math.floor(x / leafCell) + ',' + Math.floor(y / leafCell), ...extra,
  };
}

// Islets, rocks, wildlife and the odd bridge for a chunk. Everything standing in the water is
// returned as a leaf, so the channel, the hull and the pointer push it aside like the pads;
// rocks and bridge piers are fixed, so pads and islets simply bump into them.
function growPixelChunk(cx, cy) {
  const prev = rng;
  rng = seeded(worldSeed ^ Math.imul(cx, 668265263) ^ Math.imul(cy, 374761393) ^ 0x7f4a7c15);
  const D = decorSprites, C = CHUNK * unit, x0 = cx * C, y0 = cy * C;
  const count = (mean) => Math.floor(mean) + (rng() < mean % 1 ? 1 : 0);
  const out = [], fish = [], fly = [], own = [], spans = [];
  for (const pc of pixelChunks.values()) spans.push(...pc.bridges);
  // Nothing settles where the boat starts or between a bridge's piers, so it can row under.
  const clearOf = (x, y, r) => Math.hypot(x - boat.x, (y - boat.y) * K) > BOAT_LEN * unit * 0.9 + r
    && spans.every((b) => Math.abs(x - b.x) > b.sp.half + b.sp.pier + r || y < b.y - b.sp.c.height / (K * rs) - r || y > b.y + 30 * unit + r)
    && solidsNear(x, y, r + 80 * unit, (o) => Math.hypot(o.hx - x, o.hy - y) > solidGap({ r, solid: true }, o) * 1.15);
  const add = (l) => {
    out.push(l);
    if (!placed.has(l.cell)) placed.set(l.cell, []);
    placed.get(l.cell).push(l);
    return l;
  };
  // On the meadow, ground things keep out of the streams and water things keep to their banks.
  const where = { land: (x, y, r) => riverAt(x, y) > r, bank: (x, y, r) => Math.abs(riverAt(x, y) - r * 0.2) < r * 0.8 + 6 * unit };
  const place = (r, make, at) => {
    for (let k = 0; k < (GRASS_MAT && at ? 12 : 4); k++) {
      const x = x0 + rand(0, C), y = y0 + rand(0, C);
      if ((!GRASS_MAT || !at || where[at](x, y, r)) && clearOf(x, y, r)) return add(make(x, y));
    }
    return null;
  };
  if (rng() < BRIDGE) {
    const sp = pick(D.bridge), x = x0 + rand(0.3, 0.7) * C, y = y0 + rand(0.3, 0.7) * C, pr = sp.pier * 0.7;
    if (clearOf(x, y, sp.half) && [-1, 1].every((s) => clearOf(x + s * sp.half, y, pr))) {
      const b = { x, y, sp };
      own.push(b);
      spans.push(b);
      for (const s of [-1, 1]) add(floater(x + s * sp.half, y, pr, null, { fixed: true }));
    }
  }
  for (let i = count(GRASS_MAT ? MEADOW_ISLETS : ISLETS); i > 0; i--) {
    const sp = pick(D.islet[rollMix(GRASS_MAT ? MEADOW_MIX : ISLET_MIX)]);
    place(sp.r, (x, y) => floater(x, y, sp.r, sp, { mass: ISLET_MASS, mat: GRASS_MAT }), 'land');
  }
  for (let i = count(GRASS_MAT ? REED_CLUMPS * 2.5 : REED_CLUMPS); i > 0; i--) {
    const sp = pick(D.reeds);
    place(sp.r, (x, y) => floater(x, y, sp.r, sp, { mass: ISLET_MASS * 0.7 }), 'bank');
  }
  for (let i = count(GRASS_MAT ? FIXED_ROCKS * 2 : FIXED_ROCKS); i > 0; i--) {
    const sp = pick(D.waterRock), r = sp.fr / rs;
    place(r, (x, y) => floater(x, y, r, sp, { fixed: true }), 'bank');
  }
  for (let i = count(LOGS); i > 0; i--) {
    place(20 * unit, (x, y) => floater(x, y, 20 * unit, pick(D.log), { mass: 1.6 }));
  }
  if (rng() < DUCKS) {
    const x = x0 + rand(0.2, 0.8) * C, y = y0 + rand(0.2, 0.8) * C, loop = rand(50, 90) * unit;
    if (clearOf(x, y, loop * 0.6)) {
      const wander = rand(0.05, 0.09) * (rng() < 0.5 ? -1 : 1), ph = rand(0, Math.PI * 2);
      const kids = (rng() * 4) | 0;
      for (let k = 0; k <= kids; k++) {
        add(floater(x, y, (k ? 8 : 13) * unit, k ? D.duckling : D.duck, { wander, loop, phase: ph - Math.sign(wander) * k * 0.2 }));
      }
    }
  }
  for (let i = 0; i < 3; i++) {
    fish.push({ x: x0 + rand(0, C), y: y0 + rand(0, C), R: rand(30, 80) * unit, w: rand(0.15, 0.35) * (rng() < 0.5 ? -1 : 1), ph: rand(0, Math.PI * 2) });
  }
  if (rng() < 0.3) fly.push({ x: x0 + rand(0, C), y: y0 + rand(0, C), ph: rand(0, Math.PI * 2), sp: rand(0.5, 0.9) });
  const crates = placeBoxes(cx, cy, clearOf, count);
  rng = prev;
  pixelChunks.set(cx + ',' + cy, { fish, fly, bridges: own, boxes: crates });
  return out;
}

function gatherPixelWorld() {
  fishes = [];
  flies = [];
  bridges = [];
  boxes = [];
  for (const pc of pixelChunks.values()) {
    fishes.push(...pc.fish);
    flies.push(...pc.fly);
    bridges.push(...pc.bridges);
    boxes.push(...pc.boxes.filter((b) => !collectedBoxes.has(b.id)));
  }
  boxes.push(...pathBoxes.filter((b) => !collectedBoxes.has(b.id)));
  bridges.sort((a, b) => a.y - b.y);
  floaters = leaves.filter((l) => l.float || l.deco);
  frogs = leaves.filter((l) => l.frog);
}

/* ---------- mystery boxes (pixel art) ---------- */

// Crates bob along the streams. Rowing into one opens it: a symbol of something life brings
// rises out with its own sound, and for a little while it changes the boat or the scene.
const MYSTERY_BOXES = 0.2, EFFECT_TIME = 1, GOOD_CHANCE = 0.5;
const SFX_VOLUME = 0.25, MUSIC_VOLUME = 0.4, MUSIC_BPM = 80;
const GOOD_SYMBOLS = ['coin', 'heart', 'sprout', 'sun', 'bolt'];
const BAD_SYMBOLS = ['ghost', 'storm', 'broken', 'skull', 'thorns'];
const SYMBOL_LIFE = { coin: 4, heart: 5, sprout: 6, sun: 5, bolt: 4, ghost: 5, storm: 5, broken: 4, skull: 4, thorns: 5 };
// Each drawn path may float a few crates of its own along the open channel it cuts.
const PATH_BOX_EVERY = 1200, PATH_BOX_CHANCE = 0.3;
const SYMBOL_SPEED = { bolt: 2.0, broken: 0.45, thorns: 0.3, storm: 0.8 };
let mysterySprites = null, boxes = [], pathBoxes = [], effects = [], popups = [], sparks = [], props = [];
const collectedBoxes = new Set();

const toPix = (x, y) => [Math.round(rs * x) - Math.round(rs * cam.x), Math.round(rs * K * y) - Math.round(rs * K * cam.y)];

// Pixel patterns: '.' is empty, digits index the sprite's ramp, letters come from `extra`.
function patternSprite(rows, R, extra = {}, ax, ay) {
  const p = pixelPen(rows[0].length + 2, rows.length + 2);
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === '.') continue;
      p.dot(x + 1, y + 1, extra[ch] ?? R[+ch]);
    }
  });
  return finishSprite(p, ax ?? (rows[0].length + 2) / 2, ay ?? rows.length + 1);
}

// Every other body pixel left open, so the ghost reads as see-through in a fixed palette.
function dithered(sp, keep) {
  const c = document.createElement('canvas');
  c.width = sp.c.width;
  c.height = sp.c.height;
  const g = c.getContext('2d');
  g.drawImage(sp.c, 0, 0);
  const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      const i = (y * c.width + x) * 4;
      if (d[i + 3] && !keep(x, y)) d[i + 3] = 0;
    }
  }
  g.putImageData(img, 0, 0);
  return { ...sp, c };
}

const HEART_ROWS = ['.22...22.', '2332.2222', '232222221', '222222221', '.2222221.', '..22221..', '...221...', '....1....'];

function makeMysterySprites() {
  const { bark: Bk, bloomY: Y, berry: Br, leaf: L, petal: Pt, stone: St, bank: Bn, water: F } = PIXEL_RAMPS;
  const box = (() => {
    const p = pixelPen(16, 16);
    p.oval(8, 13, 7, 2, F[1]);
    p.line(1, 14, 14, 14, F[4]);
    p.rect(3, 3, 10, 3, Bk[4]);
    p.rect(4, 4, 8, 1, Bk[3]);
    p.rect(3, 6, 10, 7, Bk[2]);
    p.rect(3, 9, 10, 1, Bk[1]);
    p.rect(3, 6, 1, 7, Bk[3]);
    p.rect(12, 6, 1, 7, Bk[1]);
    [[6, 6], [7, 6], [8, 7], [7, 8], [7, 10]].forEach(([x, y]) => p.dot(x, y, Y[2]));
    p.dot(6, 6, Y[3]);
    return finishSprite(p, 8, 13);
  })();
  const coin = patternSprite([
    '...11111...',
    '.113222211.',
    '.132202221.',
    '13220000221',
    '13202032221',
    '12220003221',
    '12222030221',
    '12200003221',
    '.122203221.',
    '.112222211.',
    '...11111...',
  ], Y);
  const heart = patternSprite(HEART_ROWS, Br);
  const broken = (() => {
    const crack = [4, 4, 5, 4, 3, 4, 4, 4];
    const p = pixelPen(12, 11);
    HEART_ROWS.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] === '.' || x === crack[y]) continue;
        const right = x > crack[y];
        p.dot(x + 1 + (right ? 1 : 0), y + 1 + (right ? 1 : 0), St[+row[x]]);
      }
    });
    return finishSprite(p, 6, 10);
  })();
  const sprout = patternSprite(['.44.....', '4554..44', '.4433455', '...3343.', '....3...', '....3...', '..bbbbb.', '.bBBBBBb'], L, { b: Bn[2], B: Bn[3] });
  const sun = patternSprite([
    '.......2.......',
    '..2....3....2..',
    '...3...3...3...',
    '.....12221.....',
    '....1233322....',
    '...123333322...',
    '...223333322...',
    '23.223333222.32',
    '...222332222...',
    '...122222221...',
    '....1222221....',
    '.....11111.....',
    '...3...3...3...',
    '..2....3....2..',
    '.......2.......',
  ], Y);
  const bolt = patternSprite([
    '......33322',
    '.....33322.',
    '....33322..',
    '...33322...',
    '..333222222',
    '......2221.',
    '.....2221..',
    '....2221...',
    '...221.....',
    '..221......',
    '..21.......',
    '.21........',
    '.1.........',
  ], Y);
  const ghost = patternSprite(['...2222...', '..233332..', '.23333332.', '.23033032.', '.23333332.', '.23322332.', '.23333332.', '.22322322.', '.2..2..2..'], Pt);
  const skull = patternSprite(['..22222..', '.2333332.', '233333332', '200323002', '200323002', '233303332', '.2333332.', '..3.3.3..', '..2.2.2..'], Pt);
  const cloud = (scale) => {
    const W = Math.round(18 * scale), H = Math.round(12 * scale), p = pixelPen(W, H), s = scale;
    p.oval(9 * s, 8 * s, 7.5 * s, 3 * s, St[1]);
    p.oval(6 * s, 6 * s, 4 * s, 3.4 * s, St[2]);
    p.oval(11 * s, 5 * s, 4.6 * s, 4 * s, St[2]);
    p.oval(10.4 * s, 4.2 * s, 3.4 * s, 2.8 * s, St[3]);
    p.oval(5.4 * s, 5.2 * s, 2.4 * s, 2 * s, St[3]);
    p.oval(9.6 * s, 3 * s, 1.6 * s, 1.1 * s, St[4]);
    return finishSprite(p, W / 2, H - 1);
  };
  const stormIcon = (() => {
    const p = pixelPen(18, 17), c = cloud(1);
    p.g.drawImage(c.c, 0, 0);
    [[8, 11], [9, 12], [8, 13], [7, 14], [8, 15]].forEach(([x, y]) => p.dot(x, y, Y[2]));
    return finishSprite(p, 9, 16);
  })();
  const thorn = (seed) => {
    const p = pixelPen(14, 9), rnd = seeded(seed);
    const dot = (x, y, c) => p.dot(x, y, c);
    for (let x = 1; x < 13; x++) {
      const y = Math.round(4 + Math.sin(x * 0.8 + seed) * 1.5);
      dot(x, y, Bk[2]);
      dot(x, y + 1, Bk[1]);
      if (x % 3 === 0) { dot(x, y - 1, Bk[3]); dot(x + 1, y - 2, Bk[1]); }
      if (x % 3 === 1) dot(x, y + 2, Bk[1]);
      if (rnd() < 0.18) { dot(x, y - 1, L[3]); dot(x + 1, y - 1, L[4]); }
    }
    if (rnd() < 0.6) dot(6, 2, Br[2]);
    return finishSprite(p, 7, 7);
  };
  const bud = (R) => patternSprite(['.2.', '2Y2', '.2.'], R, { Y: Y[2] });
  const bloom = (R) => patternSprite(['.2.2.', '23232', '.3Y3.', '23232', '.2.2.'], R, { Y: Y[2] });
  const bloomRamps = [Br, Pt, PIXEL_RAMPS.bloomB];
  const miniHeart = patternSprite(['22.22', '23222', '.222.', '..2..'], Br);
  const sapling = patternSprite(['..44..', '.4554.', '445544', '.4434.', '..3...', '..3...', '.bbbb.'], L, { b: Bn[2] });
  const sunSoft = dithered(sun, (x, y) => (x + y) & 1);
  return {
    box, coin, heart, broken, sprout, sun, bolt, ghost, skull, storm: stormIcon, thorns: thorn(3),
    ghostSoft: dithered(ghost, (x, y) => (x + y) & 1), ghostFaint: dithered(ghost, (x, y) => !((x + y) % 3)),
    sunSoft, boltSoft: dithered(bolt, (x, y) => (x + y) & 1),
    bigCloud: cloud(1.8), thornVines: [thorn(1), thorn(2), thorn(5), thorn(8)],
    buds: bloomRamps.map(bud), blooms: bloomRamps.map(bloom),
    coinSpin: [patternSprite(['.222.', '23322', '23222', '22221', '.221.'], Y), patternSprite(['.2.', '232', '222', '221', '.1.'], Y)],
    glint: patternSprite(['.3.', '333', '.3.'], Y),
    miniHeart, sapling, trees: [makePixelTree('leaf'), makePixelTree('leaf'), makePixelTree('leaf')],
  };
}

function placeBoxes(cx, cy, clearOf, count) {
  const C = CHUNK * unit, x0 = cx * C, y0 = cy * C, out = [];
  for (let i = count(MYSTERY_BOXES), n = 0; i > 0; i--, n++) {
    for (let k = 0; k < 16; k++) {
      const x = x0 + rand(0, C), y = y0 + rand(0, C);
      if ((!GRASS_MAT || riverAt(x, y) < -14 * unit) && clearOf(x, y, 14 * unit)) {
        out.push({ id: cx + ',' + cy + ',' + n, x, y, flow: rng() < 0.5 ? -1 : 1, phase: rand(0, Math.PI * 2) });
        break;
      }
    }
  }
  return out;
}

// Along the stream: across the gradient of riverAt, nudged back toward deeper water.
function driftBox(b, dt) {
  const e = 4 * unit;
  const here = riverAt(b.x, b.y);
  const gx = riverAt(b.x + e, b.y) - riverAt(b.x - e, b.y), gy = riverAt(b.x, b.y + e) - riverAt(b.x, b.y - e);
  const g = Math.hypot(gx, gy) || 1;
  const v = 3 * unit * dt;
  b.x += (-gy / g) * b.flow * v - (here > -10 * unit ? (gx / g) * v : 0);
  b.y += (gx / g) * b.flow * v - (here > -10 * unit ? (gy / g) * v : 0);
}

// Grass spilling over a stream's edge, or closing back over an old channel, hides a crate:
// it only shows, and can only be collected, on open water.
function underGrass(b) {
  if (!grass) return false;
  const [px, py] = pinned(b);
  return px >= 0 && py >= 0 && px < grass.W && py < grass.H && grass.solid[py * grass.W + px] === 1;
}

function seedPathBoxes() {
  for (const p of paths) {
    p.boxAt ??= 200 * unit;
    while (p.length > p.boxAt + 60 * unit) {
      const d = p.boxAt;
      p.boxAt += PATH_BOX_EVERY * unit * rand(0.8, 1.2);
      if (rng() >= PATH_BOX_CHANCE || (boat.route === p && d < boat.d + 40 * unit)) continue;
      const q = pointAt(p, d);
      if (fixedNear(q.x, q.y, 40 * unit).length) continue;
      const b = { id: 'path' + pathBoxes.length, x: q.x, y: q.y, still: true, phase: rand(0, Math.PI * 2) };
      pathBoxes.push(b);
      boxes.push(b);
    }
  }
}

function openBox(b) {
  collectedBoxes.add(b.id);
  boxes.splice(boxes.indexOf(b), 1);
  const kind = pick(Math.random() < GOOD_CHANCE ? GOOD_SYMBOLS : BAD_SYMBOLS);
  popups.push({ kind, x: b.x, y: b.y, age: 0 });
  for (let i = 0; i < 6; i++) spark(b.x, b.y, 4, rand(-30, 30), rand(-30, 30), 40, 0.6, PIXEL_RAMPS.petal[3]);
  sfx('open');
  setTimeout(() => sfx(kind), 160);
  const life = SYMBOL_LIFE[kind] * EFFECT_TIME;
  const old = effects.find((f) => f.kind === kind);
  if (old) { old.age = 0; old.life = life; return; }
  const fx = { kind, age: 0, life };
  const S = mysterySprites;
  if (kind === 'heart') {
    // Blooms open outward in a ring, and only on open water: never on a bank or the meadow.
    for (let k = 0, n = 0; k < 600 && n < 38; k++) {
      const a = rand(0, Math.PI * 2), r = rand(30, 150) * unit;
      const p = { x: boat.x + Math.cos(a) * r, y: boat.y + Math.sin(a) * r };
      if (!onOpenWater(p.x, p.y)) continue;
      const i = (rng() * S.blooms.length) | 0;
      props.push({ kind: 'bloom', ...p, sp: S.blooms[i], bud: S.buds[i], fx, at: (r / unit - 30) / 120 + rand(0, 0.15), out: rand(0, 0.8) });
      n++;
    }
  }
  if (kind === 'sprout') {
    const side = rng() < 0.5 ? -1 : 1;
    const n = 3 + (rng() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const along = (i - 0.6) * 46 * unit, s = i % 2 ? -side : side;
      const x0 = boat.x + Math.cos(boat.angle) * along, y0 = boat.y + Math.sin(boat.angle) * along;
      const spot = bankSpot(x0, y0, boat.angle + s * Math.PI / 2);
      props.push({ kind: 'tree', ...spot, tree: S.trees[i % S.trees.length], fx, at: i * 0.2 });
    }
  }
  if (kind === 'thorns') {
    const route = boat.route;
    for (let i = -1; i <= 8; i++) {
      const d = boat.d + i * 22 * unit;
      const ahead = (t) => ({ x: boat.x + Math.cos(boat.angle) * t, y: boat.y + Math.sin(boat.angle) * t });
      const p = route ? pointAt(route, d) : ahead(i * 22 * unit);
      const q = route ? pointAt(route, d + 6 * unit) : ahead(i * 22 * unit + 6 * unit);
      const a = Math.atan2(q.y - p.y, q.x - p.x) + Math.PI / 2;
      // Sideways offsets shrink on screen by K, so push them out until they clear the hull.
      const onScreen = Math.max(K, Math.hypot(Math.cos(a), K * Math.sin(a)));
      const off = (BOAT_WIDTH * 0.5 + rand(26, 34)) * unit / onScreen;
      for (const s of [-1, 1]) props.push({ kind: 'thorn', sp: pick(S.thornVines), x: p.x + Math.cos(a) * s * off, y: p.y + Math.sin(a) * s * off, fx, at: (i + 1) * 0.07 });
    }
  }
  if (kind === 'ghost') fx.ghosts = [0, 1, 2].map((i) => ({ phase: (i * Math.PI * 2) / 3, bob: rand(0, 6) }));
  if (kind === 'storm') fx.flashIn = 0.7;
  if (kind === 'bolt') fx.flash = 0.25;
  effects.push(fx);
}

function onOpenWater(x, y) {
  return (!GRASS_MAT || riverAt(x, y) < -6 * unit) && !underGrass({ x, y });
}

// The first patch of meadow out from (x, y) along angle a, a step in from its edge; with no
// meadow near (or none at all), a spot a little way out on the water.
function bankSpot(x, y, a) {
  const c = Math.cos(a), s = Math.sin(a);
  if (GRASS_MAT) {
    for (let r = 30 * unit; r < 180 * unit; r += 4 * unit) {
      const p = { x: x + c * r, y: y + s * r };
      if (underGrass(p) || (!grass && riverAt(p.x, p.y) > 8 * unit)) return { x: p.x + c * 8 * unit, y: p.y + s * 8 * unit };
    }
  }
  return { x: x + c * 64 * unit, y: y + s * 64 * unit };
}

function spark(x, y, z, vx, vy, vz, life, color, gravity = 0, size = 1) {
  sparks.push({ x, y, z, vx, vy, vz, life, age: 0, color, gravity, size });
}

// How far into an effect we are, 0 to 1 and back: every effect eases in and out on it.
const fade = (f, inT = 0.5, outT = 0.8) => clamp(Math.min(f.age / inT, (f.life - f.age) / outT), 0, 1);
const boatSpeedMul = () => effects.reduce((m, f) => m * (1 + ((SYMBOL_SPEED[f.kind] ?? 1) - 1) * fade(f)), 1);
const effectOn = (kind) => effects.find((f) => f.kind === kind);
function skullWobble() {
  const f = effectOn('skull');
  return f ? Math.sin(time * 9) * 0.3 * fade(f, 0.4, 0.8) : 0;
}

function updateMystery(dt) {
  const view = (x, y, m) => x > cam.x - m && x < cam.x + w + m && y > cam.y - m && y < cam.y + worldH + m;
  const reach = BOAT_LEN * unit * 0.45 + 12 * unit;
  seedPathBoxes();
  for (const b of boxes.slice()) {
    if (!view(b.x, b.y, 200 * unit)) continue;
    if (GRASS_MAT && !b.still) driftBox(b, dt);
    if (underGrass(b)) continue;
    if (Math.hypot(b.x - boat.x, (b.y - boat.y) * K) < reach) openBox(b);
  }
  for (const p of popups) p.age += dt;
  popups = popups.filter((p) => p.age < 1.8);
  for (const s of sparks) {
    s.age += dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vz -= s.gravity * dt;
    s.z += s.vz * dt;
  }
  sparks = sparks.filter((s) => s.age < s.life && s.z > -1);
  const P = PIXEL_RAMPS, S = mysterySprites, L = BOAT_LEN * unit;
  for (const f of effects) {
    f.age += dt;
    f.timers ??= {};
    // How many times a `sec` timer named `key` went off this frame.
    const every = (key, sec) => {
      let n = 0;
      f.timers[key] = (f.timers[key] ?? 0) - dt;
      while (f.timers[key] <= 0) { f.timers[key] += sec; n++; }
      return n;
    };
    const left = f.life - f.age;
    if (f.kind === 'coin') {
      if (f.age < 0.6) {
        for (let n = every('fountain', 0.02); n > 0; n--) {
          sparks.push({ x: boat.x + rand(-4, 4) * unit, y: boat.y + rand(-2, 2) * unit, z: 8, vx: rand(-70, 70) * unit, vy: rand(-50, 50) * unit, vz: rand(90, 150), gravity: 210, life: 2, age: 0, frames: S.coinSpin, spin: rand(0, 2) });
        }
      }
      if (left > 0.6) {
        for (let n = every('glint', 0.04); n > 0; n--) {
          const q = boatPoint(-L * 0.5, rand(-10, 10) * unit);
          spark(q.x, q.y, 0, 0, 0, 0, rand(0.6, 1.1), pick([P.bloomY[3], P.bloomY[2]]));
        }
        if (every('star', 0.22)) {
          const q = boatPoint(-L * rand(0.5, 0.9), rand(-14, 14) * unit);
          sparks.push({ ...q, z: 1, vx: 0, vy: 0, vz: 0, gravity: 0, life: 0.7, age: 0, sprite: S.glint });
        }
      }
    }
    if (f.kind === 'heart' && left > 1.2 && every('hearts', 0.22)) {
      sparks.push({ x: boat.x + rand(-22, 22) * unit, y: boat.y + rand(-6, 6) * unit, z: 6, vx: rand(-6, 6) * unit, vy: 0, vz: rand(16, 26), life: 1.8, age: 0, sprite: S.miniHeart, gravity: 0 });
    }
    if (f.kind === 'sprout') {
      for (const p of props) {
        if (p.fx !== f || p.popped || f.age < p.at + 0.9) continue;
        p.popped = true;
        for (let i = 0; i < 10; i++) spark(p.x + rand(-8, 8) * unit, p.y + rand(-3, 3) * unit, rand(10, 26), rand(-30, 30) * unit, rand(-10, 10) * unit, rand(20, 50), 0.9, pick([P.leaf[4], P.leaf[5]]), 90);
      }
    }
    if (f.kind === 'sun' && fade(f) > 0.5 && every('mote', 0.09)) {
      spark(boat.x + rand(-40, 40) * unit, boat.y + rand(-20, 20) * unit, rand(2, 24), 0, 0, 6, 0.7, pick([P.bloomY[3], P.bloomY[2]]));
    }
    if (f.kind === 'bolt') {
      f.flash -= dt;
      if (f.flash < -1.1 && left > 1) f.flash = 0.12;
      // Four dashed lanes off the stern; the boat outruns them, so they draw out into streaks.
      if (left > 0.5) {
        for (let n = every('streak', 0.01); n > 0; n--) {
          const lane = (f.lane = ((f.lane ?? 0) + 1) % 4);
          if (Math.sin(time * 9 + lane * 1.7) < -0.6) continue;
          const q = boatPoint(-L * 0.46, (lane - 1.5) * 9 * unit);
          spark(q.x, q.y, 2, 0, 0, 0, 0.6, lane & 1 ? P.petal[3] : P.bloomY[3]);
        }
      }
    }
    if (f.kind === 'ghost' && fade(f) > 0.3 && every('mist', 0.07)) {
      const a = rand(0, Math.PI * 2), r = rand(40, 70) * unit;
      spark(boat.x + Math.cos(a) * r, boat.y + Math.sin(a) * r, rand(0, 6), 0, 0, 5, 1.2, pick([P.petal[1], P.stone[3]]));
    }
    // A sprite shade, not a water one: pixelate() would shade water-layer drops as water.
    if (f.kind === 'storm') {
      for (let n = every('rain', 0.007); n > 0; n--) spark(boat.x + rand(-80, 80) * unit, boat.y + rand(-24, 24) * unit, rand(44, 64), -8, 0, -130, 0.55, P.bloomB[3]);
      f.flash = (f.flash ?? 0) - dt;
      f.flashIn -= dt;
      if (f.flashIn <= 0 && left > 0.9) {
        f.flash = 0.3;
        f.flashIn = rand(1.3, 1.7);
        f.boltSeed = (Math.random() * 1e9) | 0;
        sfx('thunder');
      }
    }
    if (f.kind === 'broken') {
      for (let n = every('drip', 0.025); n > 0; n--) spark(boat.x + rand(-50, 50) * unit, boat.y + rand(-16, 16) * unit, rand(30, 44), rand(-6, 6), 0, -48, 1.2, pick([P.stone[4], P.stone[3], P.stone[2]]));
    }
  }
  for (const f of effects) if (f.age >= f.life) stopEffectSound(f);
  effects = effects.filter((f) => f.age < f.life);
  props = props.filter((p) => effects.includes(p.fx));
  setMood(effectOn('storm') ? 'storm' : effects.some((f) => BAD_SYMBOLS.includes(f.kind)) ? 'bad' : effects.length ? 'good' : 'none');
}

function blitAt(sp, c, x, y, lift = 0) {
  const [px, py] = toPix(x, y);
  ctx.drawImage(c, px - sp.ax, py - sp.ay - lift);
}

// On the water, under the boat: the crates and the things effects leave on the scene.
function drawMysteryGround() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const S = mysterySprites;
  for (const b of boxes) {
    const sx = b.x - cam.x, sy = K * (b.y - cam.y);
    if (sx < -30 || sx > w + 30 || sy < -30 || sy > h + 30 || underGrass(b)) continue;
    const [px, py] = pinned(b);
    ctx.drawImage(S.box.c, px - S.box.ax, py - S.box.ay + (Math.sin(time * 2.4 + b.phase) > 0 ? 0 : 1));
  }
  for (const p of props) {
    const f = p.fx, left = f.life - f.age;
    if (p.kind === 'tree') {
      const t = Math.min(f.age - p.at, left - p.at * 0.5);
      if (t <= 0) continue;
      const sp = t < 0.45 ? S.sprout : t < 0.9 ? S.sapling : p.tree;
      blitAt(sp, sp.c, p.x, p.y);
    } else if (p.kind === 'bloom') {
      const t = Math.min(f.age - p.at, left - p.out);
      if (t <= 0 || underGrass(p)) continue;
      const sp = t < 0.3 ? p.bud : p.sp;
      blitAt(sp, sp.c, p.x, p.y);
    } else if (f.age > p.at && left > p.at * 0.5) {
      blitAt(p.sp, p.sp.c, p.x, p.y);
    }
  }
}

// Hovering over the boat, but never pushed off the top of the view. Returns the sprite's top.
function overhead(sp, c, lift) {
  const [px, py] = toPix(boat.x, boat.y), top = Math.max(1, py - sp.ay - lift);
  ctx.drawImage(c, px - sp.ax, top);
  return top;
}

// Above everything: ghosts, the sun, bolt and storm cloud, particles and the symbol rising from a box.
function drawMysteryAir() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const S = mysterySprites;
  const P = PIXEL_RAMPS, bob = Math.sin(time * 2.2) > 0 ? 1 : 0;
  for (const f of effects) {
    const left = f.life - f.age, e = fade(f, 0.8, 1);
    if (f.kind === 'ghost') {
      const g = e < 0.7 ? S.ghostFaint : S.ghostSoft;
      const r = (BOAT_LEN * 0.5 + 20 + (1 - e) * 50) * unit;
      for (const o of f.ghosts) {
        const a = time * 1.3 + o.phase;
        blitAt(g, g.c, boat.x + Math.cos(a) * r, boat.y + Math.sin(a) * r, 10 + (Math.sin(time * 2 + o.bob) > 0 ? 1 : 0));
      }
    } else if (f.kind === 'sun') {
      const sp = e < 0.6 ? S.sunSoft : S.sun;
      overhead(sp, sp.c, Math.round(12 + 18 * e) + bob);
    } else if (f.kind === 'bolt') {
      const sp = e < 0.6 ? S.boltSoft : S.bolt;
      overhead(sp, sp.c, Math.round(12 + 16 * e) + (f.flash > 0 ? 2 : bob));
    } else if (f.kind === 'storm') {
      const cloudY = overhead(S.bigCloud, S.bigCloud.c, Math.round(30 + 14 * e));
      if (f.flash > 0.1) {
        const rnd = seeded(f.boltSeed);
        let [x, y] = toPix(boat.x + (rnd() - 0.5) * 40 * unit, boat.y);
        const top = cloudY + S.bigCloud.c.height - 6;
        for (let yy = top; yy < y; yy += 3) {
          ctx.fillStyle = P.petal[3];
          ctx.fillRect(x, yy, 1, 3);
          ctx.fillStyle = P.bloomY[3];
          ctx.fillRect(x + 1, yy, 1, 3);
          x += Math.round(rnd() * 4 - 2);
        }
      }
    }
  }
  for (const s of sparks) {
    const [px, py] = toPix(s.x, s.y), z = Math.round(s.z);
    const sp = s.frames ? s.frames[Math.floor(s.age * 10 + s.spin) % s.frames.length] : s.sprite;
    if (sp) ctx.drawImage(sp.c, px - sp.ax, py - sp.ay - z);
    else {
      ctx.fillStyle = s.color;
      ctx.fillRect(px, py - z, s.size, s.vz < -40 ? 2 : s.size);
    }
  }
  for (const p of popups) {
    const sp = S[p.kind], lift = Math.round(Math.min(1, p.age / 0.9) * 20);
    blitAt(sp, sp.c, p.x, p.y, lift + 4);
  }
}

// After pixelate, so the palette can't snap them away: light and colour washes over the
// finished frame. Sun and bolt light the boat; the bad symbols darken, chill or grey the scene.
function drawMoodTint() {
  const g = viewCtx, W = view.width, H = view.height;
  const wash = (color, a, op = 'source-over') => {
    if (a <= 0.002) return;
    g.globalCompositeOperation = op;
    g.fillStyle = `rgba(${color},${a})`;
    g.fillRect(0, 0, W, H);
  };
  // A round pool of light, squashed onto the water like everything else.
  const glow = (x, y, r, stops, op = 'lighter') => {
    g.setTransform(1, 0, 0, K, 0, 0);
    const gr = g.createRadialGradient(x, y / K, 0, x, y / K, r);
    for (const [at, c] of stops) gr.addColorStop(at, c);
    g.globalCompositeOperation = op;
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H / K);
    g.setTransform(1, 0, 0, 1, 0, 0);
  };
  const [bx, by] = toPix(boat.x, boat.y);
  for (const f of effects) {
    const e = fade(f, 0.8, 1.2);
    if (f.kind === 'sun') {
      // Tinted toward amber first, then lifted: light alone would turn the blue water white.
      wash('255,190,110', 0.1 * e);
      glow(bx, by - 4, 130 * unit * rs, [[0, `rgba(255,165,50,${0.4 * e})`], [0.6, `rgba(255,165,50,${0.18 * e})`], [1, 'rgba(255,165,50,0)']], 'source-over');
      glow(bx, by - 4, 90 * unit * rs, [[0, `rgba(255,210,120,${0.3 * e})`], [1, 'rgba(255,190,90,0)']]);
    } else if (f.kind === 'bolt') {
      const sp = mysterySprites.bolt;
      glow(bx, Math.max(1, by - sp.ay - 28 * e) + sp.c.height / 2, 50 * unit * rs, [[0, `rgba(255,240,150,${0.35 * e})`], [1, 'rgba(255,220,100,0)']]);
      if (f.flash > 0) wash('255,250,215', 0.4 * (f.flash / 0.25));
    } else if (f.kind === 'ghost') {
      wash('128,128,128', 0.35 * e, 'saturation');
      wash('70,60,115', 0.26 * e);
    } else if (f.kind === 'storm') {
      wash('16,24,60', 0.4 * e);
      if (f.flash > 0) wash('235,240,255', (f.flash > 0.2 || f.flash < 0.12 ? 0.6 : 0.2) * (f.flash / 0.3 + 0.3));
    } else if (f.kind === 'broken') {
      wash('128,128,128', 0.7 * e, 'saturation');
      wash('105,105,115', 0.16 * e);
    } else if (f.kind === 'skull') {
      wash('70,150,50', 0.26 * e);
    }
  }
  g.globalCompositeOperation = 'source-over';
}

/* sound: one small chiptune voice set shared by the music and every effect */

let audio = null, muted = false;
const inGallery = window.parent !== window;
let galleryActive = !inGallery;

function initAudio() {
  if (!PIXEL_ART) return;
  if (audio) {
    if (!muted && galleryActive && audio.ac.state !== 'running') wakeAudio(audio.ac);
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  // iOS mutes web audio with the ring/silent switch unless the page plays as media.
  if (navigator.audioSession) navigator.audioSession.type = 'playback';
  const ac = new AC();
  if (galleryActive) wakeAudio(ac); else ac.suspend();
  const master = ac.createGain();
  master.gain.value = SFX_VOLUME;
  master.connect(ac.destination);
  const fxBus = ac.createGain();
  fxBus.connect(master);
  const musicFilter = ac.createBiquadFilter();
  musicFilter.type = 'lowpass';
  musicFilter.frequency.value = 3200;
  musicFilter.connect(master);
  const musicBus = ac.createGain();
  musicBus.gain.value = MUSIC_VOLUME;
  musicBus.connect(musicFilter);
  const noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  audio = { ac, master, fxBus, musicBus, musicFilter, noiseBuf, mood: 'none', step: 0, next: ac.currentTime + 0.1, melody: 7 };
  ac.onstatechange = updateSoundButton;
  startMusic();
}

const soundButton = document.getElementById('sound');
function updateSoundButton() {
  soundButton.textContent = muted ? 'SOUND OFF' : audio && audio.ac.state === 'running' ? 'SOUND ON' : 'TAP FOR SOUND';
}

// Browsers only let audio start inside a tap, click or key press, so this is retried on each
// one until it sticks. A one-sample buffer is what actually unlocks older iOS.
let silentLoop = null;
function wakeAudio(ac) {
  ac.resume();
  const unlock = ac.createBufferSource();
  unlock.buffer = ac.createBuffer(1, 1, 22050);
  unlock.connect(ac.destination);
  unlock.start(0);
  if (navigator.audioSession) return;
  silentLoop ??= makeSilentLoop();
  if (silentLoop.paused) silentLoop.play().catch(() => {});
}

// Older iOS without navigator.audioSession: a looping silent <audio> moves the page into the
// media category, which the silent switch doesn't mute.
function makeSilentLoop() {
  const n = 800, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const str = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  str(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  const el = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
  el.loop = true;
  el.setAttribute('playsinline', '');
  return el;
}

const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

function tone(type, freq, start, dur, { slide, vol = 0.5, bus, vib, attack = 0.005 } = {}) {
  const { ac } = audio;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, start);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, start + dur);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(g).connect(bus || audio.fxBus);
  if (vib) {
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = vib[0];
    lg.gain.value = vib[1];
    lfo.connect(lg).connect(o.frequency);
    lfo.start(start);
    lfo.stop(start + dur + 0.05);
  }
  o.start(start);
  o.stop(start + dur + 0.05);
}

function hiss(start, dur, { type = 'lowpass', freq = 1000, to, vol = 0.5, bus, attack = 0.005, loop = false } = {}) {
  const { ac } = audio;
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = audio.noiseBuf;
  src.loop = true;
  f.type = type;
  f.frequency.setValueAtTime(freq, start);
  if (to) f.frequency.exponentialRampToValueAtTime(to, start + dur);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(vol, start + attack);
  if (!loop) g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  src.connect(f).connect(g).connect(bus || audio.fxBus);
  src.start(start);
  if (!loop) src.stop(start + dur + 0.05);
  return { src, g };
}

function sfx(kind) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + 0.01;
  const mb = audio.musicBus.gain;
  mb.cancelScheduledValues(t);
  mb.setValueAtTime(mb.value, t);
  mb.linearRampToValueAtTime(MUSIC_VOLUME * 0.35, t + 0.05);
  mb.linearRampToValueAtTime(MUSIC_VOLUME, t + 0.9);
  const seq = (type, notes, gap, dur, vol) => notes.forEach((m, i) => tone(type, midi(m), t + i * gap, dur, { vol }));
  switch (kind) {
    case 'open':
      hiss(t, 0.07, { type: 'bandpass', freq: 900, vol: 0.6 });
      tone('square', 400, t, 0.12, { slide: 800, vol: 0.25 });
      seq('triangle', [76, 81, 88], 0.06, 0.12, 0.35);
      break;
    case 'coin':
      tone('square', midi(83), t, 0.08, { vol: 0.36 });
      tone('square', midi(88), t + 0.08, 0.5, { vol: 0.36 });
      [95, 91, 96, 93, 100].forEach((m, i) => tone('square', midi(m), t + 0.32 + i * 0.07, 0.06, { vol: 0.1 }));
      break;
    case 'heart':
      tone('triangle', midi(76), t, 0.5, { vol: 0.5 });
      tone('triangle', midi(80), t, 0.5, { vol: 0.4 });
      tone('triangle', midi(79), t + 0.24, 0.6, { vol: 0.5 });
      tone('triangle', midi(83), t + 0.24, 0.6, { vol: 0.4 });
      tone('triangle', midi(84), t + 0.5, 0.9, { vol: 0.45, vib: [5, 4] });
      tone('triangle', midi(88), t + 0.5, 0.9, { vol: 0.35, vib: [5, 4] });
      break;
    case 'sprout':
      seq('triangle', [67, 71, 74, 79, 83, 86], 0.09, 0.26, 0.5);
      tone('triangle', midi(91), t + 0.54, 0.6, { vol: 0.3 });
      break;
    case 'sun':
      [72, 76, 79, 84, 88].forEach((m, i) => tone('triangle', midi(m), t + i * 0.11, 0.5, { vol: 0.45, vib: [5.5, 5], attack: 0.02 }));
      [84, 88, 91].forEach((m) => tone('triangle', midi(m), t + 0.55, 1.1, { vol: 0.28, vib: [5.5, 5], attack: 0.06 }));
      break;
    case 'bolt':
      tone('square', 260, t, 0.2, { slide: 2600, vol: 0.28 });
      tone('square', 390, t + 0.03, 0.2, { slide: 3200, vol: 0.12 });
      hiss(t + 0.17, 0.16, { type: 'highpass', freq: 1800, vol: 0.8, attack: 0.002 });
      hiss(t + 0.19, 0.3, { freq: 900, to: 200, vol: 0.4 });
      break;
    case 'thunder':
      hiss(t, 0.1, { type: 'bandpass', freq: 1800, vol: 0.7, attack: 0.002 });
      hiss(t + 0.03, 1.6, { freq: 420, to: 70, vol: 1, attack: 0.03 });
      tone('triangle', 58, t + 0.03, 1.2, { slide: 38, vol: 0.5, vib: [9, 6], attack: 0.04 });
      break;
    case 'ghost':
      tone('triangle', 560, t, 1.6, { slide: 220, vol: 0.5, vib: [6, 22], attack: 0.15 });
      tone('triangle', 840, t + 0.3, 1.3, { slide: 330, vol: 0.22, vib: [5, 26], attack: 0.2 });
      break;
    case 'storm':
      hiss(t, 2.4, { freq: 260, vol: 1, attack: 0.08 });
      hiss(t + 0.06, 0.2, { type: 'bandpass', freq: 2200, vol: 0.8 });
      break;
    case 'broken':
      hiss(t, 0.06, { type: 'highpass', freq: 3000, vol: 0.4 });
      tone('triangle', midi(64), t + 0.05, 0.4, { vol: 0.5 });
      tone('triangle', midi(63), t + 0.45, 0.5, { vol: 0.5 });
      tone('triangle', midi(59), t + 0.95, 1.1, { vol: 0.45, vib: [4, 3] });
      break;
    case 'skull':
      tone('square', 220, t, 0.9, { slide: 146.8, vol: 0.2, vib: [7, 6] });
      tone('square', 110, t, 0.9, { slide: 73.4, vol: 0.2 });
      tone('square', 233, t + 0.45, 0.6, { slide: 110, vol: 0.1 });
      break;
    case 'thorns':
      tone('sawtooth', 180, t, 0.7, { slide: 70, vol: 0.24, vib: [30, 40] });
      hiss(t, 0.6, { type: 'bandpass', freq: 1400, to: 260, vol: 0.5 });
      hiss(t + 0.3, 0.4, { type: 'bandpass', freq: 900, to: 200, vol: 0.35 });
      break;
  }
  if (kind === 'storm') {
    const f = effectOn('storm');
    if (f && !f.rain) f.rain = hiss(t + 0.3, 1, { type: 'highpass', freq: 2600, vol: 0.18, attack: 0.6, loop: true });
  }
}

function stopEffectSound(f) {
  if (!f.rain || !audio) return;
  const t = audio.ac.currentTime;
  f.rain.g.gain.cancelScheduledValues(t);
  f.rain.g.gain.setValueAtTime(f.rain.g.gain.value, t);
  f.rain.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  f.rain.src.stop(t + 0.9);
  f.rain = null;
}

// A calm four-chord loop in eighths: a slow bass, a soft arpeggio, a wandering pentatonic
// melody and now and then a swell of lapping water. Notes are queued a little ahead on the
// audio clock so the beat stays even when frames drop.
const MUSIC_MOODS = {
  bright: { chords: [[48, 60, 64, 67], [45, 57, 60, 64], [41, 53, 57, 60], [43, 55, 59, 62]], scale: [0, 2, 4, 7, 9], shift: 0 },
  minor: { chords: [[48, 60, 63, 67], [44, 56, 60, 63], [41, 53, 56, 60], [43, 55, 59, 62]], scale: [0, 3, 5, 7, 10], shift: -2 },
};

function startMusic() {
  const eighth = 60 / MUSIC_BPM / 2;
  audio.timer = setInterval(() => {
    if (!audio || audio.ac.state !== 'running') return;
    const { ac, musicBus: bus } = audio;
    while (audio.next < ac.currentTime + 0.1) {
      const t = audio.next, s = audio.step;
      const M = MUSIC_MOODS[audio.mood === 'bad' || audio.mood === 'storm' ? 'minor' : 'bright'];
      const chord = M.chords[(s >> 3) & 3].map((m) => m + M.shift);
      const beat = s & 7;
      if (beat === 0 || beat === 4) tone('triangle', midi(chord[0]), t, eighth * 3.6, { vol: 0.5, bus, attack: 0.02 });
      tone('square', midi(chord[1 + (beat % 3)] + 12), t, eighth * 0.5, { vol: 0.07, bus });
      if (!(beat & 1) && Math.random() < 0.55) {
        audio.melody = clamp(audio.melody + ((Math.random() * 5) | 0) - 2, 0, 9);
        const deg = audio.melody, note = 72 + M.shift + M.scale[deg % 5] + 12 * Math.floor(deg / 5);
        tone('triangle', midi(note), t, eighth * 1.8, { vol: 0.3, bus, attack: 0.02 });
      }
      if (audio.mood === 'good') tone('square', midi(chord[1 + ((beat + 1) % 3)] + 24), t, eighth * 0.3, { vol: 0.03, bus });
      if (s % 16 === 0) hiss(t, eighth * 8, { freq: 480, vol: 0.18, bus, attack: eighth * 3 });
      audio.step = (s + 1) % 32;
      audio.next += eighth;
    }
  }, 25);
}

function setMood(mood) {
  if (!audio || audio.mood === mood) return;
  audio.mood = mood;
  const t = audio.ac.currentTime;
  audio.musicFilter.frequency.setTargetAtTime(mood === 'storm' ? 700 : 3200, t, 0.4);
}

if (PIXEL_ART) {
  // Touch only counts as permission to play audio when the finger lifts, not on pointerdown.
  for (const type of ['pointerup', 'touchend', 'click']) window.addEventListener(type, initAudio, { passive: true });
  const setMuted = (m) => {
    muted = m;
    if (!muted) initAudio();
    if (audio) { if (muted) audio.ac.suspend(); else audio.ac.resume(); }
    updateSoundButton();
  };
  window.addEventListener('keydown', (e) => {
    if (e.key === 'm' || e.key === 'M') setMuted(!muted);
    else initAudio();
  });
  soundButton.hidden = false;
  // The page-wide unlock would switch sound on just before this click toggles it back off.
  for (const type of ['pointerdown', 'pointerup', 'touchend']) soundButton.addEventListener(type, (e) => e.stopPropagation());
  soundButton.addEventListener('click', (e) => {
    e.stopPropagation();
    const playing = audio && audio.ac.state === 'running' && !muted;
    setMuted(playing);
  });
  document.addEventListener('visibilitychange', () => {
    if (!audio) return;
    if (document.hidden) audio.ac.suspend();
    else if (!muted && galleryActive) {
      audio.ac.resume();
      audio.next = Math.max(audio.next, audio.ac.currentTime + 0.05);
    }
  });
  // As a gallery preview, play only while the card is hovered, like the other projects.
  if (inGallery) {
    soundButton.hidden = true;
    window.addEventListener('message', (e) => {
      if (e.source !== window.parent || e.data?.type !== 'gallery-audio') return;
      galleryActive = !!e.data.active;
      if (!audio) return;
      if (galleryActive && !muted) wakeAudio(audio.ac); else audio.ac.suspend();
    });
  }
  // Some desktop browsers allow sound straight away on a site the visitor has played before;
  // everywhere else this waits, suspended, for the first tap.
  initAudio();
  updateSoundButton();
}

/* drawing */

// Fixed things and bridges sit on the whole-pixel grid.
function drawFixedAt(sp, c, x, y) {
  ctx.drawImage(c, Math.round(x * rs) - Math.round(cam.x * rs) - sp.ax, Math.round(y * K * rs) - Math.round(cam.y * K * rs) - sp.ay);
}

function drawSpriteAt(sp, c, sx, sy, dy = 0) {
  ctx.drawImage(c, Math.round(sx * rs) - sp.ax, Math.round(sy * rs) - sp.ay + dy);
}

function drawPinnedAt(sp, c, l) {
  const [px, py] = pinned(l);
  ctx.drawImage(c, px - sp.ax, py - sp.ay);
}

// Grass tiles in world pixels: broad lighter and darker patches with small blade tufts
// (turf shade indices, 128 square), and a staggered row of round bumps (0..1, 48 square)
// that scallops the meadow's edge.
const GRASS_TILE = 128, BUMP_TILE = 48;
const GRASS_TUFTS = [['+.+', '.+.'], ['+...+', '.+.+.'], ['.#.', '+.+'], ['#', '+'], ['+.#', '.+.'], ['-.-'], ['-', '-'], ['.-.', '-.-']];
function makeGrass(W, H) {
  const N = GRASS_TILE, P = 4, rnd = seeded(worldSeed ^ 0x2c1b3c6d);
  const pn = (x, y, period, seed) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const at = (i, j) => hash((((i % period) + period) % period) + seed, ((j % period) + period) % period);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  const patch = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const n = pn(x / (N / P), y / (N / P), P, 11) * 0.6 + pn(x / (N / P / 2), y / (N / P / 2), P * 2, 37) * 0.4;
      const odd = (x + y) & 1;
      patch[y * N + x] = n < 0.31 || (n < 0.34 && odd) ? 2 : n > 0.6 || (n > 0.56 && odd) ? 4 : 3;
    }
  }
  const tile = patch.slice();
  for (let i = 0; i < (N * N) / 22; i++) {
    const pat = GRASS_TUFTS[(rnd() * GRASS_TUFTS.length) | 0], x0 = (rnd() * N) | 0, y0 = (rnd() * N) | 0;
    const base = patch[y0 * N + x0];
    for (let r = 0; r < pat.length; r++) {
      for (let k = 0; k < pat[r].length; k++) {
        const ch = pat[r][k];
        if (ch === '.') continue;
        tile[((y0 + r) & (N - 1)) * N + ((x0 + k) & (N - 1))] = clamp(base + (ch === '#' ? 2 : ch === '+' ? 1 : -1), 1, 5);
      }
    }
  }
  const B = BUMP_TILE, bump = new Float32Array(B * B);
  for (let y = 0; y < B; y++) {
    for (let x = 0; x < B; x++) {
      const sx = ((x + ((y >> 2) & 1) * 3) % 6) - 2.5, sy = (y % 4) - 1.5;
      bump[y * B + x] = Math.max(0, 1 - (sx * sx) / 7 - (sy * sy) / 3.2);
    }
  }
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const g = c.getContext('2d'), img = g.createImageData(W, H);
  return {
    W, H, c, g, img, out: new Uint32Array(img.data.buffer), tile, bump,
    field: new Float32Array(W * H), solid: new Uint8Array(W * H),
    turf: PIXEL_RAMPS.turf.map(hexRGBA), foam: PIXEL_RAMPS.water.map(hexRGBA),
  };
}

// The pads of the grass cover aren't drawn one by one: each adds a soft bump to a field at the
// virtual pixel size, and wherever the bumps add up past GRASS_LEVEL is meadow, so pads that
// touch or nearly touch merge into one field. Its edge gets a dark outline, a lit rim on top,
// a dark bank hanging below and foam on the water. The texture, scallops and foam are looked
// up in world pixels and the pads are pinned, so nothing crawls as the view scrolls.
function drawGrass() {
  const W = canvas.width, H = canvas.height;
  if (!grass || grass.W !== W || grass.H !== H) grass = makeGrass(W, H);
  const { field, solid, out, tile, bump, turf: T, foam: F } = grass, N = GRASS_TILE, B = BUMP_TILE;
  const ox = Math.round(rs * cam.x), oy = Math.round(rs * K * cam.y);
  // The meadow only changes when a pad has moved a whole pixel or the view has scrolled.
  let moved = grass.ox !== ox || grass.oy !== oy || grass.leaves !== leaves;
  for (const l of leaves) {
    const [px, py] = l.fixed ? [Math.round(rs * l.x) - ox, Math.round(rs * K * l.y) - oy] : pinned(l);
    if (l.gx !== px || l.gy !== py) {
      l.gx = px;
      l.gy = py;
      moved = true;
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!moved) {
    ctx.drawImage(grass.c, 0, 0);
    return;
  }
  Object.assign(grass, { ox, oy, leaves });
  field.fill(0);
  const blob = (px, py, R, wt) => {
    const Ry = R * K;
    if (px < -R || px > W + R || py < -Ry || py > H + Ry) return;
    const ya = Math.max(0, Math.ceil(py - Ry)), yb = Math.min(H - 1, Math.floor(py + Ry));
    const ia = 1 / (R * R), ib = 1 / (Ry * Ry);
    for (let y = ya; y <= yb; y++) {
      const dy = y + 0.5 - py, vy = 1 - dy * dy * ib, row = y * W;
      if (vy <= 0) continue;
      const span = R * Math.sqrt(vy);
      const xa = Math.max(0, Math.ceil(px - 0.5 - span)), xb = Math.min(W - 1, Math.floor(px - 0.5 + span));
      let dx = xa + 0.5 - px, v = vy - dx * dx * ia, dv = -(2 * dx + 1) * ia;
      for (let x = xa; x <= xb; x++) {
        if (v > 0) field[row + x] += v * v * wt;
        v += dv;
        dv -= 2 * ia;
      }
    }
  };
  // Reeds, rocks, logs, ducks and piers each clear a little pool around themselves, and a
  // stream runs under every bridge.
  for (const l of leaves) {
    const pool = l.solid && !l.mat;
    blob(l.gx, l.gy, (pool ? l.r * 1.4 + 14 * unit : l.r * GRASS_REACH) * rs, pool ? -1.6 : 1);
  }
  for (const b of bridges) {
    const half = b.sp.half, py = Math.round(rs * K * (b.y + 8 * unit)) - oy;
    for (let t = -1; t <= 1; t += 0.25) blob(Math.round(rs * (b.x + t * half)) - ox, py, 40 * unit * rs, -1.6);
  }
  // Scallops only where the field slopes steeply: across a flat stretch near the threshold
  // they'd break the grass into a mesh of specks.
  const hi = GRASS_LEVEL + 0.12, lo = GRASS_LEVEL - 0.2;
  for (let y = 0, p = 0; y < H; y++) {
    const by = ((((y + oy) % B) + B) % B) * B;
    for (let x = 0; x < W; x++, p++) {
      const f = field[p];
      if (f > hi || f < lo) {
        solid[p] = f > hi ? 1 : 0;
        continue;
      }
      const slope = Math.abs(field[x < W - 1 ? p + 1 : p] - field[x > 0 ? p - 1 : p]) + Math.abs(field[y < H - 1 ? p + W : p] - field[y > 0 ? p - W : p]);
      const amp = 0.32 * Math.min(1, slope / 0.12);
      solid[p] = f > hi - 0.12 + amp * (0.375 - bump[by + ((((x + ox) % B) + B) % B)]) ? 1 : 0;
    }
  }
  const drip = (wx) => hash(wx, 7) < 0.45;
  for (let y = 0, p = 0; y < H; y++) {
    const wy = y + oy, trow = (wy & (N - 1)) * N;
    for (let x = 0; x < W; x++, p++) {
      const wx = x + ox;
      const up = y > 0 ? solid[p - W] : solid[p], dn = y < H - 1 ? solid[p + W] : solid[p];
      const lf = x > 0 ? solid[p - 1] : solid[p], rt = x < W - 1 ? solid[p + 1] : solid[p];
      // Lone specks and one-pixel slivers are left as water.
      const s = solid[p] && (up || dn) && (lf || rt);
      if (s) {
        if (!up || !lf || !rt) out[p] = T[0];
        else if (!dn) out[p] = T[2];
        else if (y > 1 && !solid[p - 2 * W]) out[p] = T[5];
        else if ((x > 1 && !solid[p - 2]) || (y > 2 && !solid[p - 3 * W] && wx & 1)) out[p] = T[4];
        else if (x < W - 2 && !solid[p + 2]) out[p] = T[2];
        else out[p] = T[tile[trow + (wx & (N - 1))]];
        continue;
      }
      const u2 = y > 1 && solid[p - 2 * W], u3 = y > 2 && solid[p - 3 * W];
      if (up) out[p] = T[1];
      else if (u2) out[p] = drip(wx) ? T[1] : T[0];
      else if (u3 && drip(wx)) out[p] = T[0];
      else if ((dn || lf || rt) && (wx * 3 + wy * 5) % 7) out[p] = F[4];
      else out[p] = 0;
    }
  }
  grass.g.putImageData(grass.img, 0, 0);
  ctx.drawImage(grass.c, 0, 0);
}

// Floating things behind the boat are drawn before it and the rest after, so it passes
// between them.
function drawFloaters(front) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (!front) floaters.sort((a, b) => a.y - b.y);
  for (const l of floaters) {
    if (l.y >= boat.y !== front) continue;
    const sp = l.float || l.deco, sx = l.x - cam.x, sy = K * (l.y - cam.y), m = sp.c.width / rs;
    if (sx < -m || sx > w + m || sy < -m || sy > h + sp.c.height / rs) continue;
    if (l.fixed) {
      drawFixedAt(sp, sp.c, l.x, l.y);
      continue;
    }
    if (l.vx > 0.4) l.face = 1;
    else if (l.vx < -0.4) l.face = -1;
    drawPinnedAt(sp, sp.c2 && l.face < 0 ? sp.c2 : sp.c, l);
  }
}

function drawFrogs() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const l of frogs) {
    const sx = l.x - cam.x, sy = K * (l.y - cam.y);
    if (sx < -40 || sx > w + 40 || sy < -40 || sy > h + 40) continue;
    drawPinnedAt(l.frog, l.frog.c, l);
  }
}

const bridgeOff = (b, sp) => {
  const sx = b.x - cam.x, sy = K * (b.y - cam.y), m = sp.c.width / rs;
  return sx < -m || sx > w + m || sy < -40 || sy > h + sp.c.height / rs;
};

// Under the pads: fish, and the bridges' shadows on the water.
function drawFishAndShadows() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const f of fishes) {
    const t = time * f.w + f.ph;
    const sx = f.x + Math.cos(t) * f.R - cam.x, sy = K * (f.y + Math.sin(t) * f.R * 0.7 - cam.y);
    if (sx < -40 || sx > w + 40 || sy < -40 || sy > h + 40) continue;
    const a = Math.atan2(Math.cos(t) * f.w * 0.7 * K, -Math.sin(t) * f.w);
    const sp = decorSprites.fish[(((Math.round(a / (Math.PI / 4)) % 8) + 8) % 8)];
    drawSpriteAt(sp, sp.c, sx, sy);
  }
  for (const b of bridges) {
    const s = b.sp.shadow;
    if (!bridgeOff(b, s)) drawFixedAt(s, s.c, b.x, b.y);
  }
}

// Bridges behind the boat are drawn before it and the rest after, so it rows under them.
function drawBridges(front) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const b of bridges) if (b.y > boat.y === front && !bridgeOff(b, b.sp)) drawFixedAt(b.sp, b.sp.c, b.x, b.y);
}

// Dragonflies hover, then dart: the path is a slow loop with quick sideways flicks.
function drawFlies() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const f of flies) {
    const t = time * f.sp + f.ph;
    const sx = f.x + (Math.sin(t * 0.9) * 70 + Math.sin(t * 2.7) ** 9 * 30) * unit - cam.x;
    const sy = K * (f.y + (Math.sin(t * 0.6 + 1) * 60 + Math.cos(t * 2.1) ** 9 * 20) * unit - cam.y) - 10 * unit;
    if (sx < -30 || sx > w + 30 || sy < -30 || sy > h + 30) continue;
    const sp = decorSprites.fly[Math.floor(time * 5 + f.ph * 7) & 1];
    ctx.drawImage(sp.c, Math.round(sx * rs) - sp.ax, Math.round(sy * rs) - sp.ay);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  time += dt;
  updateCamera(dt);
  updatePaths(dt);
  step(dt);
  if (PIXEL_ART) updateMystery(dt);
  if (!PIXEL_ART) updateGarden(dt);
  render();
  requestAnimationFrame(frame);
}

let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(setup, 150);
});

setup();
requestAnimationFrame(frame);
</script>
</body>
