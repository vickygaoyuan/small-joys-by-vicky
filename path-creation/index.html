<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Create Your Path</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #5a6ea8; }
  canvas {
    display: block;
    image-rendering: auto;
    width: 100%;
    height: 100%;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    cursor: crosshair;
  }
  canvas.pixel { image-rendering: pixelated; image-rendering: crisp-edges; }
  #sound {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right));
    padding: 8px 12px; border: 3px solid #26242e; background: #e2e0e0; color: #26242e;
    font: bold 13px/1 monospace; letter-spacing: 1px; cursor: pointer;
    box-shadow: 3px 3px 0 #26242e; -webkit-tap-highlight-color: transparent;
  }
  #sound[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="sound" type="button" hidden>TAP FOR SOUND</button>
<script>
// Pixel art: flat-shaded sprites are drawn into a small offscreen canvas, then every frame is
// snapped to a palette of shade ramps, outlined and shadowed, and shown with hard, unsmoothed
// pixels. The older watercolour branches behind !PIXEL_ART no longer run.
const PIXEL_ART = true;
const view = document.getElementById('c');
const canvas = PIXEL_ART ? document.createElement('canvas') : view;
const ctx = canvas.getContext('2d');
const viewCtx = PIXEL_ART ? view.getContext('2d', { willReadFrequently: true }) : null;
if (PIXEL_ART) view.classList.add('pixel');

// The lake is a flat plane seen at an angle: world y is squashed by K on screen.
const K = 0.6;
const DAMPING = 0.78;
const HOME_SPRING = 0.0018;
const CHANNEL_PUSH = 0.07;
const SEPARATION = 0.02;
// How far a leaf flattens along the direction it's pressed, and how much it widens the other way.
const SQUEEZE_MAX = 0.3, SQUEEZE_SPREAD = 0.6;
const HOVER_RADIUS = 60;
const HOVER_FORCE = 1.2;

let dpr = 1, rs = 1, w = 0, h = 0, worldH = 0, unit = 1;
let water = null;
let padSprites = [], flowerSprites = [], padAtlas = [];
let leaves = [], shimmer = [], paths = [], ripples = [], leafCell = 48, leafMaxR = 100;
let washBlob, washLayer, washG;
let drawing = null;
let boat = null, boatSprites = null, grain = null, dabSprites = [], sunDabs = [], sunlight = null;
let hover = null;
let time = 0;
// The lake has no edges: leaves are grown in square chunks around the view as it moves.
// Water is mostly reflected sky, which travels with the viewer, so it stays on screen.
let cam = { x: 0, y: 0 }, pointer = null, chunks = new Map(), placed = new Map(), worldSeed = 0;
let rng = Math.random;
const CHUNK = 520, LEAF_DEPTH = 0.9;

/* ---------- utilities ---------- */

const rand = (a, b) => a + rng() * (b - a);
const pick = (arr) => arr[(rng() * arr.length) | 0];
function seeded(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function hash(x, y) {
  let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function fbm(x, y, seed) {
  return noise(x + seed, y - seed) * 0.65 + noise(x * 2.3 + seed, y * 2.3) * 0.35;
}

function makeCanvas(cssW, cssH) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(cssW * dpr);
  c.height = Math.ceil(cssH * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  return [c, g];
}

function brush(g, x1, y1, cx, cy, x2, y2, width, color, alpha = 1) {
  g.globalAlpha = alpha;
  g.strokeStyle = color;
  g.lineWidth = width;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(x1, y1);
  g.quadraticCurveTo(cx, cy, x2, y2);
  g.stroke();
}

const rgbCache = new Map();
function shade(hex, amt) {
  let rgb = rgbCache.get(hex);
  if (!rgb) {
    const n = parseInt(hex.slice(1), 16);
    rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    rgbCache.set(hex, rgb);
  }
  const f = (v) => clamp(Math.round(v + amt), 0, 255);
  return `rgb(${f(rgb[0])},${f(rgb[1])},${f(rgb[2])})`;
}

// A loaded brush dragged once: a thin body of paint, then separate bristle tracks
// in slightly different values, each lifting off at its own point.
function paint(g, x1, y1, cx, cy, x2, y2, width, color, alpha = 1) {
  brush(g, x1, y1, cx, cy, x2, y2, width * 0.8, color, alpha * 0.5);
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;
  const n = clamp(Math.round(width / 1.4), 2, 7);
  for (let i = 0; i < n; i++) {
    const off = (n === 1 ? 0 : i / (n - 1) - 0.5) * width * 0.9;
    const s0 = rand(0, 0.18), s1 = rand(0.78, 1);
    const ox = nx * off, oy = ny * off;
    brush(
      g,
      x1 + dx * s0 + ox, y1 + dy * s0 + oy,
      cx + ox, cy + oy,
      x1 + dx * s1 + ox, y1 + dy * s1 + oy,
      (width / n) * rand(0.7, 1.25), shade(color, PIXEL_ART ? rand(-24, 24) : rand(-9, 9)), alpha * rand(0.55, 0.95)
    );
  }
}

// Thick paint catching the light: a pale stroke with a faint shadow along its lower edge.
function impasto(g, x1, y1, x2, y2, width, color, alpha = 1) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + rand(-1, 1);
  brush(g, x1, y1 + width * 0.45, mx, my + width * 0.45, x2, y2 + width * 0.45, width * 0.6, '#3a3a60', alpha * 0.18);
  paint(g, x1, y1, mx, my, x2, y2, width, color, alpha);
}

// Oil paint stands up off the canvas. Height is taken from the paint's own value, so every
// bristle track, curl and dab becomes a ridge that catches light from above and drops a
// thin shadow below. Fine and broad slopes are mixed so both bristles and whole strokes
// read as thick. Transparent pixels count as level ground, so soft edges stay soft.
// Watercolour on cold-press paper: pigment settles into the paper's tooth in small clumps,
// heavier where the wash is dark, and pools into a soft tide line where a wash dries at
// its edge.
function watercolorWash(c, strength = 1, soak = 1) {
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  // Wet-into-wet: colours soak into one another inside the wash, and a faint bleed
  // creeps just past its edge, so individual brush marks dissolve into dyed paper.
  if (soak > 0) {
    const wet = document.createElement('canvas');
    wet.width = W; wet.height = H;
    const wg = wet.getContext('2d');
    wg.filter = `blur(${dpr * 3.2 * soak}px)`;
    wg.drawImage(c, 0, 0);
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.globalAlpha = 0.72 * Math.min(1, soak);
    g.drawImage(wet, 0, 0);
    g.globalCompositeOperation = 'destination-over';
    g.globalAlpha = 0.4 * Math.min(1, soak);
    g.drawImage(wet, 0, 0);
    g.restore();
  }
  const img = g.getImageData(0, 0, W, H);
  const d = img.data;
  const r = Math.max(2, Math.round(dpr * 2.5));
  const seed = Math.random() * 1000;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const a = d[i + 3];
      if (a < 8) continue;
      const lum = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) / 255;
      const tooth = noise(x / (dpr * 2.2) + seed, y / (dpr * 2.2)) * 0.6 + hash(x, y) * 0.4;
      let k = 1 - (tooth - 0.45) * 0.26 * (1.1 - lum) * strength;
      if (a < 250 || x < r || y < r || x >= W - r || y >= H - r) {
        const near = Math.min(
          x >= r ? d[i - r * 4 + 3] : 0, x < W - r ? d[i + r * 4 + 3] : 0,
          y >= r ? d[i - r * W * 4 + 3] : 0, y < H - r ? d[i + r * W * 4 + 3] : 0,
        );
        if (near < a * 0.6) k *= 1 - 0.2 * strength * (a / 255);
      }
      d[i] *= k; d[i + 1] *= k; d[i + 2] *= k;
    }
  }
  g.putImageData(img, 0, 0);
}

// Softens a sprite's silhouette: the alpha fades in over `px` from the edge, and a faint
// halo of the same colours bleeds outward, like a wash spreading into damp paper.
function featherEdges(c, px) {
  const W = c.width, H = c.height;
  const soft = document.createElement('canvas');
  soft.width = W; soft.height = H;
  const sg = soft.getContext('2d');
  sg.filter = `blur(${dpr * px}px)`;
  sg.drawImage(c, 0, 0);
  const g = c.getContext('2d');
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-in';
  g.drawImage(soft, 0, 0);
  g.globalCompositeOperation = 'destination-over';
  g.globalAlpha = 0.55;
  g.drawImage(soft, 0, 0);
  g.restore();
}

function impastoRelief(c, strength = 1, lightX = 0, soak = 1) {
  if (!PIXEL_ART) return watercolorWash(c, strength, soak);
  const g = c.getContext('2d');
  const W = c.width, H = c.height;
  const img = g.getImageData(0, 0, W, H);
  const d = img.data;
  const ht = new Float32Array(W * H);
  for (let p = 0, i = 0; p < W * H; p++, i += 4) {
    ht[p] = d[i + 3] > 8 ? d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11 : -1;
  }
  const r = Math.max(2, Math.round(dpr * 1.6));
  for (let y = r; y < H - r; y++) {
    for (let x = r; x < W - r; x++) {
      const p = y * W + x;
      const h0 = ht[p];
      if (h0 < 0) continue;
      const at = (q) => (ht[q] < 0 ? h0 : ht[q]);
      const fy = at(p + W) - at(p - W), fx = at(p + 1) - at(p - 1);
      const by = at(p + r * W) - at(p - r * W), bx = at(p + r) - at(p - r);
      const s = clamp(((fy + by * 0.7) + (fx + bx * 0.7) * lightX) * 0.55 * strength, -54, 54);
      const i = p * 4;
      if (s > 0) {
        d[i] += s; d[i + 1] += s * 0.94; d[i + 2] += s * 0.82;
      } else {
        const k = 1 + s / 150;
        d[i] *= k; d[i + 1] *= k; d[i + 2] *= k * 1.02;
      }
    }
  }
  g.putImageData(img, 0, 0);
}

function makeCanvasGrain() {
  const size = 192;
  const [c, g] = makeCanvas(size, size);
  const px = Math.ceil(size * dpr);
  const img = g.getImageData(0, 0, px, px);
  for (let i = 0; i < img.data.length; i += 4) {
    const x = (i / 4) % px, y = ((i / 4) / px) | 0;
    // Linen weave: alternating threads plus a little tooth.
    // Cold-press paper: soft irregular hills and pits rather than a woven thread. The
    // noise wraps at the tile size so the pattern repeats without a seam.
    const t = size / 12, px2 = (x / dpr) / 12, py2 = (y / dpr) / 12;
    const tooth = (noise(px2 % t, py2 % t) - 0.5) * 34 + (noise((px2 * 3) % (t * 3), (py2 * 3) % (t * 3)) - 0.5) * 18;
    const v = 128 + tooth + (Math.random() - 0.5) * 22;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return ctx.createPattern(c, 'repeat');
}

/* ---------- water ---------- */

// A still autumn lake: cool cerulean and slate blue, pale sky caught on the surface, a warm
// cream glow where the sun is mirrored, and the gold and rust of the trees reflected in it.
// The cool water is what makes the warm leaves glow.
const WATER = {
  deep:    ['#1e4676', '#22507e', '#1a406c', '#285a88'],
  blue:    ['#3a6ea4', '#4478ac', '#4f84b6', '#33649a'],
  violet:  ['#3e6c8e', '#4a7a9a', '#336282', '#5888a2'],
  lilac:   ['#8cb4d2', '#9cc0da', '#aac8de', '#80aacc'],
  sky:     ['#b8d2e4', '#c6dcea', '#accae0', '#d4e4ee', '#bed6e6'],
  foliage: ['#9a6a34', '#a8783a', '#6e6c44', '#b0643a'],
  rose:    ['#c89a64', '#d4aa70', '#b88a5a'],
  sun:     ['#f6ead2', '#fbf0dc', '#f2e2c0', '#fff6e6', '#f4e6cc'],
};
let sun = { x: 0, y: 0, r: 1 };

function sunAmount(x, y) {
  const d = Math.hypot(x - sun.x, (y - sun.y) * 1.4) / sun.r;
  return d < 1 ? (1 - d) ** 1.5 : 0;
}

function waterColor(x, y) {
  const s = 0.003 / unit;
  if (Math.random() < sunAmount(x, y)) return pick(Math.random() < 0.75 ? WATER.sun : WATER.sky);
  const sky = fbm(x * s, y * s * 1.6, 83.1);
  const trees = fbm(x * s * 2.4, y * s * 0.5, 17.7);
  const rose = fbm(x * s * 1.4, y * s * 2, 47.9);
  const mix = fbm(x * s * 1.6, y * s * 2.4, 5.7);
  if (sky > 0.7) return pick(Math.random() < 0.5 ? WATER.sky : WATER.lilac);
  if (trees > 0.7) return pick(WATER.foliage);
  if (rose > 0.76) return pick(WATER.rose);
  if (mix < 0.36) return pick(WATER.deep);
  if (mix < 0.6) return pick(WATER.blue);
  if (mix < 0.78) return pick(WATER.violet);
  return pick(WATER.lilac);
}

// A loose curl of paint, as Monet scribbles the ripples and reflections around the pads.
function swirl(g, x, y, radius, width, color, alpha) {
  const a0 = rand(0, Math.PI * 2), span = rand(1, 2.6) * (Math.random() < 0.5 ? -1 : 1);
  const am = a0 + span / 2, a1 = a0 + span;
  const bulge = radius / Math.cos(span / 2);
  paint(g, x + Math.cos(a0) * radius, y + Math.sin(a0) * radius * 0.6,
    x + Math.cos(am) * bulge, y + Math.sin(am) * bulge * 0.6,
    x + Math.cos(a1) * radius, y + Math.sin(a1) * radius * 0.6, width, color, alpha);
}

// Flat blue in a few broad zones with sparse light ripple dashes, laid on the virtual pixel
// grid so it stays crisp once the scene is shrunk.
function paintPixelWater() {
  const [c, g] = makeCanvas(w, h);
  const R = PIXEL_RAMPS.water, px = 1 / rs, s = 0.004 / unit;
  // Under the grass meadow all open water is the lighter blue; the deeper shade is kept
  // for the channel the boat opens, so the drawn path is the only dark water.
  const [base, low, high] = GRASS_MAT ? [R[3], R[3], R[3]] : [R[2], R[1], R[3]];
  g.fillStyle = base;
  g.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += px) {
    for (let x = 0; x < w; x += px) {
      const n = fbm(x * s, y * s * 1.8, 83.1);
      if (n > 0.36 && n < 0.66) continue;
      g.fillStyle = n < 0.36 ? low : high;
      g.fillRect(x, y, px, px);
    }
  }
  for (let i = 0; i < (w * h) / (px * px * 90); i++) {
    const x = Math.floor(rand(0, w) / px) * px, y = Math.floor(rand(0, h) / px) * px;
    const len = (2 + (Math.random() * 4 | 0)) * px;
    g.fillStyle = R[4];
    g.fillRect(x, y, len, px);
    if (Math.random() < 0.3) {
      g.fillStyle = R[5];
      g.fillRect(x + px, y, px, px);
    }
  }
  return c;
}

function paintWater() {
  if (PIXEL_ART) return paintPixelWater();
  // Broad, well-blended underpainting, then falling reflection strokes mixed with loose
  // curls, the willow's reflected strands, and finally a pass that softly melts it together.
  const [under, ug] = makeCanvas(w, h);
  const grad = ug.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#5a8cb4');
  grad.addColorStop(0.35, '#3a6c9e');
  grad.addColorStop(1, '#2a5888');
  ug.fillStyle = grad;
  ug.fillRect(0, 0, w, h);
  const glow = ug.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.r * 1.3);
  glow.addColorStop(0, 'rgba(246, 236, 214, 0.8)');
  glow.addColorStop(0.45, 'rgba(204, 226, 238, 0.4)');
  glow.addColorStop(1, 'rgba(190, 214, 232, 0)');
  ug.fillStyle = glow;
  ug.fillRect(0, 0, w, h);
  const area = w * h;
  for (let i = 0; i < area / 320; i++) {
    const x = rand(-10, w + 10), y = rand(-60, h);
    const len = rand(30, 90) * unit;
    brush(ug, x, y, x + rand(-4, 4) * unit, y + len / 2, x + rand(-3, 3) * unit, y + len, rand(12, 20) * unit, waterColor(x, y + len / 2), 0.6);
  }

  const [c, g] = makeCanvas(w, h);
  g.filter = `blur(${5 * unit}px)`;
  g.drawImage(under, 0, 0, w, h);
  g.filter = 'none';
  for (let i = 0; i < area / 220; i++) {
    const x = rand(-10, w + 10), y = rand(-40, h);
    if (Math.random() < 0.65) {
      const len = rand(20, 60) * unit;
      const lean = rand(-0.1, 0.1) * len;
      paint(g, x, y, x + lean * 0.5 + rand(-2, 2) * unit, y + len / 2, x + lean, y + len, rand(4, 8) * unit, waterColor(x, y), 0.55);
    } else {
      swirl(g, x, y, rand(10, 32) * unit, rand(3, 6) * unit, waterColor(x, y), 0.5);
    }
  }
  // Around the sun's reflection the paint curls in pale, warm loops.
  for (let i = 0; i < 60; i++) {
    const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * sun.r * 0.8;
    const x = sun.x + Math.cos(a) * d, y = sun.y + Math.sin(a) * d * 0.7;
    swirl(g, x, y, rand(10, 26) * unit, rand(4, 8) * unit, pick([...WATER.sun, ...WATER.sky]), rand(0.4, 0.65));
  }
  // Reflected autumn trees: long, slightly wavering gold and rust lines falling down the water.
  g.filter = `blur(${0.8 * unit}px)`;
  for (let i = 0; i < w / 90; i++) {
    let x = rand(0, w), y = rand(-80, h * 0.6);
    const len = rand(120, 320) * unit, steps = 12, sway = rand(4, 10) * unit, ph = rand(0, 6.3);
    const color = pick(WATER.foliage), width = rand(2, 3.6) * unit;
    for (let k = 0; k < steps; k++) {
      const y2 = y + len / steps;
      const x2 = x + Math.sin(ph + k * 0.7) * sway * 0.3;
      brush(g, x, y, (x + x2) / 2 + rand(-1, 1) * unit, (y + y2) / 2, x2, y2, width * (1 - k / steps * 0.5), color, 0.5);
      x = x2; y = y2;
    }
  }
  g.filter = 'none';
  // Melt the strokes into one another, as wet-into-wet paint does.
  const [soft, sg] = makeCanvas(w, h);
  sg.filter = `blur(${2.6 * unit}px)`;
  sg.drawImage(c, 0, 0, w, h);
  g.globalAlpha = 0.7;
  g.drawImage(soft, 0, 0, w, h);
  g.globalAlpha = 1;
  impastoRelief(c, 1.2, 0.3);
  return c;
}

// The sunlight on the water: a few soft warm pools, painted small and drawn scaled up so
// they stay smooth, then drifted and breathed slowly each frame.
function makeSunlight() {
  const sw = Math.ceil(w / 4), sh = Math.ceil(h / 4);
  const c = document.createElement('canvas');
  c.width = sw; c.height = sh;
  const g = c.getContext('2d');
  const pool = (x, y, r, color, alpha) => {
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = alpha;
    g.fillStyle = grad;
    g.beginPath();
    g.ellipse(x, y, r, r * 0.7, 0, 0, Math.PI * 2);
    g.fill();
  };
  pool(sun.x / 4, sun.y / 4, sun.r / 4 * 1.2, 'rgba(255, 236, 206, 1)', 0.9);
  for (let i = 0; i < 14; i++) {
    const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * sun.r * 1.6;
    pool((sun.x + Math.cos(a) * d) / 4, (sun.y + Math.sin(a) * d * 0.6) / 4, rand(0.15, 0.35) * sun.r / 4, pick(['rgba(255, 242, 220, 1)', 'rgba(222, 238, 248, 1)', 'rgba(255, 234, 206, 1)']), rand(0.35, 0.7));
  }
  for (let i = 0; i < 10; i++) {
    pool(rand(0, sw), rand(0, sh), rand(10, 26) * unit, 'rgba(220, 236, 248, 1)', rand(0.15, 0.3));
  }
  g.globalAlpha = 1;
  return c;
}

function drawSunlight() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'screen';
  const drift = swellX(sun.y) * 0.6;
  ctx.globalAlpha = 0.2 + 0.05 * Math.sin(time * 0.35);
  ctx.drawImage(sunlight, drift * rs, 0, canvas.width, canvas.height);
  ctx.globalAlpha = 0.1 + 0.04 * Math.sin(time * 0.27 + 2);
  ctx.drawImage(sunlight, (-drift * 0.7 + 3 * unit) * rs, 2 * unit * rs, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// The same sunlight falling faintly across leaves and flowers near the reflection.
function drawSunVeil() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.12 + 0.03 * Math.sin(time * 0.35);
  ctx.drawImage(sunlight, swellX(sun.y) * 0.6 * rs, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// One loaded stroke of pale paint. Glints, the wake and oar rings are all made of these,
// so moving water is painted with the same brush as everything else.
const DAB_W = 64, DAB_H = 30;
function makeDabSprite(warm = false) {
  const [c, g] = makeCanvas(DAB_W, DAB_H);
  if (PIXEL_ART) {
    const R = PIXEL_RAMPS.water, gap = rand(26, 36);
    g.fillStyle = R[4];
    g.fillRect(6, DAB_H / 2 - 4, gap - 6, 8);
    g.fillRect(gap + 6, DAB_H / 2 - 4, DAB_W - gap - 12, 8);
    g.fillStyle = R[5];
    g.fillRect(10, DAB_H / 2 - 4, rand(6, 12), 8);
    return c;
  }
  const colors = warm ? [...WATER.sun, WATER.sky[2]] : [...WATER.lilac, ...WATER.violet, WATER.sky[0]];
  const y = DAB_H / 2;
  // A thin main swipe broken into two, with a fainter sliver beside it, like light caught
  // on the slope of a small wave rather than a painted line.
  const gap = rand(26, 36);
  paint(g, 8, y + rand(-1, 1), gap / 2 + 4, y + rand(-2, 2), gap, y + rand(-1, 1), rand(4, 6), pick(colors), 0.8);
  paint(g, gap + rand(3, 7), y + rand(-1, 1), (gap + DAB_W) / 2, y + rand(-2, 2), DAB_W - 8, y + rand(-1, 1), rand(3, 5), pick(colors), 0.7);
  const x0 = rand(12, 30), len = rand(12, 20), y0 = y + rand(3, 6) * (Math.random() < 0.5 ? -1 : 1);
  paint(g, x0, y0, x0 + len / 2, y0 + rand(-1, 1), x0 + len, y0 + rand(-1, 1), rand(2, 3.5), pick(colors), 0.5);
  g.globalAlpha = 1;
  return c;
}

function drawDab(sprite, x, y, angle, len, alpha) {
  const s = len / DAB_W;
  const cos = Math.cos(angle) * s * rs, sin = Math.sin(angle) * s * rs;
  ctx.setTransform(cos, sin, -sin, cos, x * rs, y * rs);
  // Faint dabs would vanish when snapped to the palette, so pixel mode shows them stronger.
  ctx.globalAlpha = PIXEL_ART ? Math.min(1, alpha * 2.6) : alpha;
  ctx.drawImage(sprite, -DAB_W / 2, -DAB_H / 2, DAB_W, DAB_H);
}

// Glints gather where the sun is mirrored and thin out across the rest of the water.
function makeShimmer() {
  const n = Math.round((w * h) / 30000);
  return Array.from({ length: n }, (_, i) => {
    const nearSun = i % 2 === 0;
    const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * sun.r * 1.3;
    return {
      x: nearSun ? sun.x + Math.cos(a) * d : rand(0, w),
      y: nearSun ? sun.y + Math.sin(a) * d * 0.6 : rand(0, h),
      len: rand(18, 56) * unit, tilt: rand(-0.1, 0.1),
      phase: rand(0, Math.PI * 2), speed: rand(0.15, 0.4),
      sprite: pick(nearSun ? sunDabs : dabSprites),
    };
  });
}

/* ---------- lily pads ---------- */

// Teal, sea-green, pale aqua and a little olive, as the pads in Monet's willow painting,
// with the deep ultramarine of the water curling around them.
const PADS = [
  { weight: 30, px: 'teal', base: ['#3e9a90', '#46a294', '#38908a'], strokes: ['#5ab4a4', '#6cc0ac', '#3a8c88', '#7ccab8', '#4a9ca8', '#3e64b8', '#4a74c4'], top: ['#a8dccc', '#bce4d6'], shadow: '#141e66' },
  { weight: 24, px: 'green', base: ['#5aac8c', '#64b494', '#52a484'], strokes: ['#78c4a0', '#8ed0ac', '#4a9a7c', '#a4d8b4', '#6ab4b8', '#4668bc'], top: ['#c4e8d0', '#d2eedc'], shadow: '#141e66' },
  { weight: 10, px: 'teal', pxLift: 1, base: ['#7cc4b8', '#88ccc0', '#70bcb0'], strokes: ['#9cd8cc', '#b0e2d8', '#6cb4b4', '#a8c8e8', '#c4e8dc'], top: ['#e0f4ee', '#eaf8f4'], shadow: '#18226e' },
  { weight: 12, px: 'olive', base: ['#6e9e58', '#78a660', '#64944e'], strokes: ['#8cb46c', '#9cc07a', '#5c8a4c', '#7cae8c', '#b0c88a'], top: ['#cce0b0', '#d8e8c0'], shadow: '#141e60' },
  { weight: 24, px: 'green', base: ['#2e7a7c', '#347e84', '#286e74'], strokes: ['#3e8e8e', '#4a9a96', '#2a6a7a', '#5a8ec4', '#58a89a', '#2e4ea8'], top: ['#8cc8c0', '#9cd0c8'], shadow: '#101a5a' },
];
// Pads lying in the reflected sky, and pads lying in the shadow of the willow.
const SKY_PADS = { px: 'teal', pxLift: 1, base: ['#9cb4dc', '#aab4e0', '#94b8d0'], strokes: ['#b8c4ea', '#ccc8ee', '#8ca8d4', '#a8d4cc', '#e8d0e4', '#f2dcc8'], top: ['#f4ecf4', '#fbf0e4'], shadow: '#18206e' };
const DUSK_PADS = { px: 'green', base: ['#24606e', '#2a6878', '#205868'], strokes: ['#30707c', '#3a7c86', '#1e5262', '#3c62a8', '#468a8a'], top: ['#6aa4a8', '#7ab0b0'], shadow: '#0c144e' };
// Soft colour that gathers at a leaf's edge: mostly the deep blue of the water, sometimes pink.
const RIMS = [
  { weight: 34, colors: ['#26348e', '#2c3c9c', '#1e2c80', '#34449e'] },
  { weight: 26, colors: ['#e870b0', '#f08cc0', '#d85c9c', '#f4a8d0'] },
  { weight: 20, colors: ['#1e6a6c', '#26747a', '#1a5e66', '#2e7e80'] },
  { weight: 10, colors: ['#f4c8a0', '#f8dcc0', '#f0c0a8', '#fae4cc'] },
  { weight: 10, colors: ['#a898dc', '#b8a8e4', '#9a8cd4', '#c4b8ec'] },
];
const SPRITE_R = 64;

function pickWeighted(list) {
  let r = Math.random() * list.reduce((s, f) => s + f.weight, 0);
  for (const f of list) { if ((r -= f.weight) < 0) return f; }
  return list[0];
}
const pickFamily = () => pickWeighted(PADS);

// Watercolour floats fallen autumn leaves instead of pads: gold, orange, amber, rust and
// crimson, with a little ochre and a few leaves still turning from green.
const FALL = [
  { weight: 22, base: ['#e8a83a', '#eeb444', '#e09c30'], strokes: ['#f4c858', '#e88a2c', '#d8742a', '#f0d070', '#c8862a'], top: ['#fae4a0', '#f8dc8c'], vein: '#9a5a1c' },
  { weight: 20, base: ['#e07a2a', '#e68632', '#d86e26'], strokes: ['#f09a3c', '#c85a24', '#e8a040', '#d0482a', '#f4b450'], top: ['#f8c880', '#f6d090'], vein: '#8a3a18' },
  { weight: 16, base: ['#d48c2c', '#dc9834', '#c88026'], strokes: ['#e8a840', '#b86a24', '#f0bc54', '#c4502a', '#a8762a'], top: ['#f4d48c', '#f0cc80'], vein: '#7a4416' },
  { weight: 14, base: ['#b84a26', '#c4542a', '#ac4222'], strokes: ['#d0662e', '#9a3420', '#e08038', '#a83c28', '#c86a30'], top: ['#ec9a64', '#f0a870'], vein: '#5e2012' },
  { weight: 11, base: ['#c0322a', '#cc3c2e', '#b02a26'], strokes: ['#d8503a', '#9a2224', '#e0683c', '#a82a30', '#e88848'], top: ['#f08a70', '#f49c7c'], vein: '#5a1418' },
  { weight: 9, base: ['#c8a040', '#d0aa4a', '#bc9638'], strokes: ['#dcb858', '#a88a34', '#e4c468', '#b4943c', '#d88c34'], top: ['#f0dc98', '#ecd490'], vein: '#6e541c' },
  { weight: 7, base: ['#b0ae48', '#bab650', '#a4a242'], strokes: ['#c8c05a', '#e0b844', '#9aa040', '#d8a038', '#8a9a3c'], top: ['#e8e49c', '#e4e094'], vein: '#5e6020' },
];
const pickFall = () => pickWeighted(FALL);
// Drifts lying in the mirrored sun are paler gold; drifts in the trees' reflection are deeper.
const FALL_SUNLIT = { base: ['#f0c45a', '#f4cc66', '#eab852'], strokes: ['#f8dc84', '#f0b048', '#fae6a0', '#e8a040', '#f4d070'], top: ['#fff0c4', '#fcecb8'], vein: '#a8701e' };
const FALL_SHADE = { base: ['#b43a26', '#bc4428', '#a83224'], strokes: ['#c8502c', '#8e2a20', '#d0682e', '#a02a2a', '#c4702e'], top: ['#e88060', '#e48a5c'], vein: '#501410' };

// Leaf forms, so the lake mixes ordinary pads with round ones, long ovals, lobed leaves,
// deeply split ones and leaves with an edge curled over to show the rosy underside.
// Aspect is the painted (already foreshortened) height over width.
const LEAF_FORMS = [
  { weight: 26, aspect: [0.46, 0.56], waves: 1, dents: [0, 2], notch: [0.08, 0.16] },
  { weight: 16, aspect: [0.55, 0.66], waves: 0.6, dents: [0, 1], notch: [0.05, 0.12] },
  { weight: 18, aspect: [0.32, 0.43], waves: 1, dents: [0, 2], notch: [0.08, 0.18] },
  { weight: 14, aspect: [0.42, 0.55], waves: 1, dents: [0, 1], notch: [0.08, 0.16], lobes: true },
  { weight: 12, aspect: [0.44, 0.56], waves: 1.2, dents: [1, 3], notch: [0.24, 0.42] },
  { weight: 14, aspect: [0.4, 0.54], waves: 1.3, dents: [1, 2], notch: [0.1, 0.2], curl: true },
];
const UNDERSIDE = ['#c06a8e', '#a862a0', '#c8828e', '#9c70b0'];

// Pads are painted already foreshortened so they're drawn upright on screen rather than
// spun in the lake plane.
// Pixel art covers the lake with floating plants instead of flat lily pads, built like the
// islet trees and bushes: overlapping blobs, each with a dark rim, a body, a lit cap and a
// glint toward the upper left. ?cover= picks one or more kinds (comma-separated) to mix.
// The default, grass, draws no pad sprites at all: the pads merge into one meadow (drawGrass).
const COVER_KINDS = ['grass', 'clump', 'bush', 'duckweed', 'blossom', 'moss'];
const PIXEL_COVER = (() => {
  const want = (new URLSearchParams(location.search).get('cover') || 'grass').split(',').map((k) => k.trim());
  const ok = want.filter((k) => COVER_KINDS.includes(k));
  return ok.length ? ok : ['grass'];
})();
const GRASS_MAT = PIXEL_ART && PIXEL_COVER.includes('grass');

function paintPixelCover(g, kind, R, lift, rx, ry) {
  if (kind === 'moss') R = PIXEL_RAMPS.grass;
  const top = R.length - 1, m = Math.min(rx, ry);
  const oval = (x, y, r, color, sq = 0.86) => {
    g.fillStyle = color;
    g.beginPath();
    g.ellipse(x, y, r, r * sq, 0, 0, Math.PI * 2);
    g.fill();
  };
  const ring = (n, lo, hi, reach, lift3 = 0) => {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand(-0.25, 0.25), br = m * rand(lo, hi), k = rand(...reach);
      out.push([Math.cos(a) * (rx - br) * k, Math.sin(a) * (ry - br) * k - lift3, br]);
    }
    return out;
  };
  const shadeBlobs = (blobs) => {
    blobs.sort((a, b) => a[1] - b[1]);
    for (const [bx, by, br] of blobs) oval(bx + br * 0.08, by + br * 0.16, br, R[lift]);
    for (const [bx, by, br] of blobs) {
      const lit = clamp(0.55 - ((bx * 0.6 + by) / Math.max(rx, ry)) * 0.7, 0, 1);
      const body = Math.min(top - 2, (lit > 0.5 ? 3 : 2) + lift - 1);
      oval(bx, by, br, R[Math.max(0, body - 1)]);
      oval(bx - br * 0.05, by - br * 0.07, br * 0.88, R[body]);
      oval(bx - br * 0.3, by - br * 0.34, br * 0.5, R[Math.min(top, body + 1)]);
      if (lit > 0.4) oval(bx - br * 0.42, by - br * 0.5, br * 0.2, R[Math.min(top, body + 2)]);
    }
  };
  const florets = (n, spread) => {
    for (let i = 0; i < n; i++) {
      const F = PIXEL_RAMPS[pick(['pink', 'bloomY', 'bloomB', 'petal'])];
      const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * spread;
      const x = Math.cos(a) * d * rx, y = Math.sin(a) * d * ry, r = m * rand(0.07, 0.1);
      oval(x + r * 0.3, y + r * 0.4, r * 1.1, F[0]);
      oval(x, y, r, F[Math.min(F.length - 2, 2)]);
      oval(x - r * 0.25, y - r * 0.3, r * 0.45, F[F.length - 1]);
    }
  };

  if (kind === 'clump' || kind === 'blossom') {
    shadeBlobs([[0, 0, m * rand(0.42, 0.52)], ...ring(7 + (Math.random() * 4 | 0), 0.32, 0.46, [0.7, 0.98])]);
    if (kind === 'blossom') florets(3 + (Math.random() * 4 | 0), 0.7);
  } else if (kind === 'bush') {
    // A low floating shrub: a ring of blobs at the waterline and a heaped crown above it.
    oval(rx * 0.04, ry * 0.12, rx * 0.92, R[0], ry / rx * 0.9);
    shadeBlobs([
      ...ring(7, 0.36, 0.48, [0.75, 0.95]),
      ...ring(4, 0.34, 0.44, [0.2, 0.45], m * 0.22),
      [0, -m * 0.3, m * rand(0.42, 0.5)],
    ]);
  } else if (kind === 'duckweed') {
    // A loose mat of tiny round fronds, scattered rather than heaped.
    const n = 70 + (Math.random() * 40 | 0);
    const dots = [];
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), d = Math.pow(Math.random(), 0.7) * rand(0.6, 1);
      dots.push([Math.cos(a) * d * rx * 0.95, Math.sin(a) * d * ry * 0.95, m * rand(0.06, 0.11)]);
    }
    dots.sort((a, b) => a[1] - b[1]);
    for (const [x, y, r] of dots) oval(x + r * 0.2, y + r * 0.35, r * 1.15, R[lift]);
    for (const [x, y, r] of dots) {
      const lit = clamp(0.55 - ((x * 0.6 + y) / Math.max(rx, ry)) * 0.7, 0, 1);
      const body = Math.min(top - 1, (lit > 0.5 ? 3 : 2) + lift);
      oval(x, y, r, R[body]);
      oval(x - r * 0.3, y - r * 0.35, r * 0.4, R[Math.min(top, body + 1)]);
    }
  } else {
    // A floating mat of moss and turf, like the islet tops, tufted and lit at the upper left.
    g.save();
    g.beginPath();
    for (let i = 0; i <= 40; i++) {
      const a = (i / 40) * Math.PI * 2, e = 0.88 + 0.08 * Math.sin(a * 3 + rx) + 0.05 * Math.sin(a * 7);
      const x = Math.cos(a) * rx * e, y = Math.sin(a) * ry * e;
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    }
    g.closePath();
    g.fillStyle = PIXEL_RAMPS.bank[1];
    g.translate(0, ry * 0.1);
    g.fill();
    g.translate(0, -ry * 0.1);
    g.fillStyle = R[1];
    g.fill();
    g.clip();
    oval(-rx * 0.06, -ry * 0.08, rx * 0.86, R[2], ry / rx);
    oval(-rx * 0.28, -ry * 0.3, rx * 0.5, R[3], ry / rx);
    for (let i = 0; i < 14; i++) {
      const x = rand(-0.75, 0.75) * rx, y = rand(-0.7, 0.7) * ry, r = m * rand(0.05, 0.08);
      const lit = x + y < 0;
      oval(x, y + r, r * 1.2, R[1]);
      oval(x, y, r, R[lit ? 4 : 3]);
    }
    g.restore();
  }
}

function makePadSprite(fam = pickFamily()) {
  const form = pickWeighted(LEAF_FORMS);
  const aspect = rand(...form.aspect);
  // Leaves of every form cover about the same area, so collisions stay fair.
  const rx = SPRITE_R * Math.sqrt(0.5 / aspect), ry = rx * aspect;
  const pad = 20;
  const W = rx * 2 + pad * 2, H = ry * 2 + pad * 2;
  const [c, g] = makeCanvas(W, H);
  g.translate(W / 2, H / 2);

  // A wavy, lopsided outline: several harmonics at random strengths, plus soft dents where
  // the leaf has curled or been nibbled.
  const angDist = (a, b) => Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
  const waves = [[2, 0.04, 0.09], [3, 0.03, 0.07], [5, 0.02, 0.05], [8, 0.015, 0.035], [13, 0.008, 0.02]]
    .map(([k, lo, hi]) => [k, rand(lo, hi) * form.waves, rand(0, 6.3)]);
  if (form.lobes) waves.push([Math.random() < 0.5 ? 3 : 4, rand(0.07, 0.13), rand(0, 6.3)]);
  const notchA = rand(0, Math.PI * 2);
  const notchW = rand(...form.notch);
  const dentCount = form.dents[0] + (Math.random() * (form.dents[1] - form.dents[0] + 1) | 0);
  const dents = Array.from({ length: dentCount }, () => [rand(0, 6.3), rand(0.05, 0.13), rand(0.25, 0.5)]);
  let curlA = 0;
  if (form.curl) {
    curlA = notchA + Math.PI + rand(-1.6, 1.6);
    dents.push([curlA, rand(0.12, 0.2), rand(0.35, 0.5)]);
  }
  const edge = (a) => {
    let e = 1;
    for (const [k, amp, ph] of waves) e += amp * Math.sin(k * a + ph);
    for (const [da, depth, width] of dents) e -= depth * Math.exp(-((angDist(a, da) / width) ** 2));
    return e;
  };
  const at = (a, s = 1) => [Math.cos(a) * rx * s * edge(a), Math.sin(a) * ry * s * edge(a)];
  const inNotch = (x, y) => {
    const a = Math.atan2(y / ry, x / rx);
    return angDist(a, notchA) < notchW * 1.15 && (x * x) / (rx * rx) + (y * y) / (ry * ry) > 0.09;
  };
  const outline = (ctx2, s, dy = 0) => {
    ctx2.beginPath();
    for (let i = 0; i <= 96; i++) {
      const [x, y] = at((i / 96) * Math.PI * 2, s);
      if (i) ctx2.lineTo(x, y + dy); else ctx2.moveTo(x, y + dy);
    }
    ctx2.closePath();
  };
  // Cupped leaves bow their swipes up or down, so the surface reads as gently curved.
  const bow = rand(-0.14, 0.14) * ry;
  const bowY = (x, y) => y + bow * (1 - Math.min(1, (x / rx) ** 2));

  if (PIXEL_ART) {
    if (!GRASS_MAT) paintPixelCover(g, pick(PIXEL_COVER), PIXEL_RAMPS[fam.px], fam.pxLift ?? (Math.random() < 0.35 ? 1 : 0), rx, ry);
    return withMips(c, W, H);
  }

  // A wash of the leaf colour under the swipes, so leaves lying on top of each other
  // don't show through one another.
  g.filter = 'blur(2px)';
  g.globalAlpha = 0.86;
  g.fillStyle = pick(fam.base);
  outline(g, 0.92);
  g.fill();
  g.filter = 'none';

  // Each leaf gets its own brush direction and rhythm: swept on a diagonal, radiating from
  // the stem like veins, or circling round the leaf, mixing long sweeps with quick dabs.
  const strokeColor = () => {
    const roll = Math.random();
    if (roll < 0.05) return pick(WATER.sky);
    if (roll < 0.2) return pick(fam.top);
    return pick(fam.strokes);
  };
  const inside = (x, y) => (x / rx) ** 2 + (y / ry) ** 2 < 0.92;
  const strokeLen = () => (Math.random() < 0.35 ? rand(0.12, 0.25) : rand(0.35, 0.8)) * rx;
  const strokeW = () => ry * rand(0.22, 0.42);
  const flow = pick(['diagonal', 'diagonal', 'radial', 'contour']);
  if (flow === 'diagonal') {
    const th = rand(-0.75, 0.75), cs = Math.cos(th), sn = Math.sin(th);
    const toLeaf = (u, v) => { const x = u * cs - v * sn; return [x, bowY(x, u * sn + v * cs)]; };
    for (let v = -rx; v <= rx; v += ry * rand(0.2, 0.34)) {
      let u = -rx + rand(0, 6);
      while (u < rx) {
        const len = strokeLen(), mu = u + len / 2;
        const [mx, my] = toLeaf(mu, v);
        if (inside(mx, my) && !inNotch(mx, my)) {
          const [x1, y1] = toLeaf(u, v), [xc, yc] = toLeaf(mu, v + rand(-0.12, 0.12) * len), [x2, y2] = toLeaf(u + len, v + rand(-0.06, 0.06) * len);
          paint(g, x1, y1, xc, yc, x2, y2, strokeW(), strokeColor(), rand(0.6, 0.88));
        }
        u += len * rand(0.7, 1.05);
      }
    }
  } else if (flow === 'radial') {
    const n = 18 + (Math.random() * 12 | 0);
    for (let i = 0; i < n; i++) {
      const a = notchA + notchW * 1.3 + (i / n) * (Math.PI * 2 - notchW * 2.6) + rand(-0.08, 0.08);
      // Some veins are one long sweep, others broken into two quicker strokes.
      const breaks = Math.random() < 0.4 ? [[rand(0.05, 0.3), rand(0.45, 0.6)], [rand(0.6, 0.7), rand(0.85, 0.98)]] : [[rand(0.05, 0.3), rand(0.75, 0.98)]];
      for (const [s0, s1] of breaks) {
        const [x1, y1] = at(a, s0), [x2, y2] = at(a + rand(-0.12, 0.12), s1);
        const bend = rand(-0.1, 0.1);
        const [xc, yc] = at(a + bend, (s0 + s1) / 2);
        paint(g, x1, y1, xc, yc, x2, y2, strokeW() * 0.85, strokeColor(), rand(0.6, 0.88));
      }
    }
  } else {
    for (let sc = rand(0.84, 0.92); sc > 0.12; sc -= rand(0.14, 0.22)) {
      let a = rand(0, Math.PI * 2);
      const end = a + Math.PI * 2;
      while (a < end) {
        const span = (Math.random() < 0.35 ? rand(0.25, 0.5) : rand(0.6, 1.3)) / Math.max(0.4, sc);
        const a1 = Math.min(a + span, end);
        const [x1, y1] = at(a, sc), [x2, y2] = at(a1, sc);
        const [xc, yc] = at((a + a1) / 2, sc / Math.cos(Math.min(1.2, (a1 - a) / 2)));
        if (!inNotch((x1 + x2) / 2, (y1 + y2) / 2)) paint(g, x1, y1, xc, yc, x2, y2, strokeW() * 0.9, strokeColor(), rand(0.6, 0.88));
        a = a1 + rand(0, 0.15);
      }
    }
  }
  // A few pale touches where the sky lands on the leaf, kept close in value to the leaf.
  for (let i = 0; i < 2 + (Math.random() * 2 | 0); i++) {
    const x = rand(-0.5, 0.5) * rx, y = bowY(x, rand(-0.55, 0.3) * ry);
    if (inNotch(x, y)) continue;
    const len = rand(0.15, 0.3) * rx;
    brush(g, x - len / 2, y, x, y + rand(-1, 1), x + len / 2, y + rand(-1.5, 1.5), ry * rand(0.14, 0.2), pick(fam.top), 0.45);
  }
  // No outline: on some leaves the rim colour is only a blush that fades inward from the edge.
  if (Math.random() < 0.45) {
    const rim = pickWeighted(RIMS).colors;
    g.filter = 'blur(4px)';
    for (let a = rand(0, 0.5); a < Math.PI; a += rand(0.4, 0.7)) {
      const [x1, y1] = at(a, 0.82), [x2, y2] = at(a + 0.5, 0.82), [xm, ym] = at(a + 0.25, 0.86);
      brush(g, x1, y1, xm, ym, x2, y2, rx * 0.12, pick(rim), rand(0.18, 0.3));
    }
    g.filter = 'none';
  }
  // Loose curling strokes that follow the leaf's contour, as Monet circles each pad with
  // the brush; blurred so they read as paint pooling, not as an outline.
  g.filter = 'blur(1.2px)';
  for (let i = 0; i < 4 + (Math.random() * 4 | 0); i++) {
    const a0 = rand(0, Math.PI * 2), span = rand(0.6, 1.8), sc = rand(0.4, 0.88);
    const [x1, y1] = at(a0, sc), [x2, y2] = at(a0 + span, sc);
    const [xm, ym] = at(a0 + span / 2, sc / Math.cos(span / 2));
    if (inNotch((x1 + x2) / 2, (y1 + y2) / 2)) continue;
    const color = Math.random() < 0.35 ? pick(RIMS[0].colors) : pick(fam.strokes);
    paint(g, x1, y1, xm, ym, x2, y2, rx * rand(0.05, 0.09), color, rand(0.35, 0.6));
  }
  g.filter = 'none';
  // A curled edge: the rosy underside turned up along the rim, with light on the fold.
  if (form.curl) {
    g.filter = 'blur(2px)';
    for (let i = 0; i < 3; i++) {
      const a0 = curlA - 0.4 + i * 0.16;
      const [x1, y1] = at(a0, 0.78), [x2, y2] = at(a0 + 0.5, 0.78), [xm, ym] = at(a0 + 0.25, 0.88);
      brush(g, x1, y1, xm, ym, x2, y2, rx * rand(0.08, 0.12), pick(UNDERSIDE), rand(0.45, 0.6));
    }
    const [x1, y1] = at(curlA - 0.35, 0.62), [x2, y2] = at(curlA + 0.35, 0.62), [xm, ym] = at(curlA, 0.68);
    brush(g, x1, y1, xm, ym, x2, y2, rx * 0.05, pick(fam.top), 0.5);
    g.filter = 'none';
  }

  // The edge is cut by a mask painted with the same swipes, so it ends raggedly where the
  // strokes run out, and the mask is blurred so the leaf melts into the water.
  const [mc, mg] = makeCanvas(W, H);
  mg.translate(W / 2, H / 2);
  mg.fillStyle = '#000';
  outline(mg, 0.84);
  mg.fill();
  for (let y = -ry * 0.86; y <= ry * 0.86; y += ry * rand(0.14, 0.22)) {
    const half = Math.sqrt(Math.max(0, 1 - (y / ry) ** 2));
    const a0 = Math.atan2(y / ry, -half), a1 = Math.atan2(y / ry, half);
    const [xl] = at(a0, rand(0.86, 1.02)), [xr] = at(a1, rand(0.86, 1.02));
    brush(mg, xl, y, (xl + xr) / 2, y + rand(-1, 1), xr, y + rand(-1.5, 1.5), ry * rand(0.16, 0.26), '#000', 1);
  }
  g.globalCompositeOperation = 'destination-in';
  g.filter = `blur(${rand(2, 3.2)}px)`;
  g.globalAlpha = 1;
  g.drawImage(mc, -W / 2, -H / 2, W, H);
  // Only the faintest cool shadow underneath, so the leaf lies on the water rather than
  // standing above it.
  g.globalCompositeOperation = 'destination-over';
  g.filter = 'blur(5px)';
  g.globalAlpha = 0.2;
  g.fillStyle = fam.shadow;
  outline(g, 0.95, ry * 0.04);
  g.fill();
  g.filter = 'none';

  // The notch: a soft-edged slit from the centre out through the edge, narrow on most
  // leaves and a wide split on some.
  g.globalCompositeOperation = 'destination-out';
  g.filter = 'blur(2.5px)';
  g.beginPath();
  g.moveTo(rand(-0.03, 0.03) * rx, rand(-0.03, 0.03) * ry);
  for (let k = -1; k <= 1; k += 2) {
    const na = notchA + k * notchW;
    g.lineTo(Math.cos(na) * (rx + pad), Math.sin(na) * (ry + pad));
  }
  g.closePath();
  g.fill();
  g.filter = 'none';
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  impastoRelief(c, 1.1);
  featherEdges(c, 7);
  return withMips(c, W, H);
}

// Pre-shrunk copies, since scaling a big sprite down to a tiny leaf every frame is slow.
function withMips(c, W, H) {
  const mips = [c];
  for (let i = 0; i < 3; i++) {
    const src = mips[mips.length - 1];
    const m = document.createElement('canvas');
    m.width = Math.max(1, Math.round(src.width / 2));
    m.height = Math.max(1, Math.round(src.height / 2));
    m.getContext('2d').drawImage(src, 0, 0, m.width, m.height);
    mips.push(m);
  }
  return { canvas: c, mips, w: W, h: H };
}

/* ---------- fallen leaves (watercolour) ---------- */

const FALL_FORMS = [
  { weight: 58, kind: 'maple' },
  { weight: 20, kind: 'oak' },
  { weight: 22, kind: 'birch' },
];

// A leaf in plan view, tip toward +x and stalk toward -x, centred on the origin. Veins are
// [x1, y1, cx, cy, x2, y2, width] curves.
function fallLeafShape(kind, R) {
  const pts = [], veins = [];
  if (kind === 'maple') {
    const lobes = [[0, 1], [0.95, 0.86], [-0.95, 0.86], [1.9, 0.56], [-1.9, 0.56]]
      .map(([a, l]) => [a + rand(-0.08, 0.08), l * rand(0.86, 1.06)]);
    const sinus = rand(0.36, 0.48), ph = rand(0, 6.3);
    for (let i = 0; i < 240; i++) {
      const a = (i / 240) * Math.PI * 2 - Math.PI;
      let r = sinus, peak = 0;
      for (const [la, ll] of lobes) {
        const p = Math.exp(-((Math.abs(Math.atan2(Math.sin(a - la), Math.cos(a - la))) / 0.34) ** 1.25));
        r = Math.max(r, sinus + (ll - sinus) * p);
        peak = Math.max(peak, p);
      }
      r *= 1 + 0.07 * (Math.abs(Math.sin(a * 14 + ph)) - 0.5) * Math.min(1, peak * 2.5);
      r *= 1 - 0.4 * Math.exp(-(((Math.PI - Math.abs(a)) / 0.28) ** 2));
      pts.push([Math.cos(a) * r * R, Math.sin(a) * r * R]);
    }
    for (const [la, ll] of lobes) {
      const d = ll * 0.8 * R, bend = rand(-0.06, 0.06);
      veins.push([0, 0, Math.cos(la + bend) * d * 0.5, Math.sin(la + bend) * d * 0.5, Math.cos(la) * d, Math.sin(la) * d, ll > 0.7 ? 1.9 : 1.4]);
    }
    return { pts, veins, stalk: [0, 0, -0.32 * R, rand(-0.06, 0.06) * R, -0.5 * R, rand(-0.12, 0.12) * R] };
  }
  const L = R * rand(0.92, 1.02), x = (u) => -L + 2 * L * u;
  let half, tooth;
  if (kind === 'oak') {
    const wd = R * rand(0.4, 0.5), n = 3 + (Math.random() * 2 | 0), ph = rand(0, 1.2);
    half = (u, side) => wd * Math.pow(Math.sin(Math.PI * u), 0.7) * (0.55 + 0.55 * u) * (0.5 + 0.5 * Math.abs(Math.sin(Math.PI * n * u + ph + side * 0.3)) ** 0.6);
    tooth = () => 1;
    for (let k = 0; k < n; k++) {
      const u = (k + 0.5 - ph / Math.PI) / n;
      if (u < 0.1 || u > 0.92) continue;
      for (const side of [-1, 1]) veins.push([x(u - 0.1), 0, x(u - 0.04), side * half(u, side) * 0.4, x(u), side * half(u, side) * 0.8, 1.2]);
    }
  } else {
    const wd = R * rand(0.4, 0.5);
    half = (u) => wd * Math.pow(Math.sin(Math.PI * u), 0.75) * (1.15 - 0.5 * u);
    tooth = (u) => 1 + 0.08 * (Math.abs(Math.sin(u * Math.PI * 17)) - 0.5);
    for (let u = 0.16; u < 0.86; u += rand(0.1, 0.13)) {
      for (const side of [-1, 1]) veins.push([x(u), 0, x(u + 0.06), side * half(u + 0.06) * 0.4, x(u + 0.13), side * half(u + 0.13) * 0.82, 1.1]);
    }
  }
  for (let i = 0; i <= 80; i++) { const u = i / 80; pts.push([x(u), -half(u, -1) * tooth(u)]); }
  for (let i = 80; i >= 0; i--) { const u = i / 80; pts.push([x(u), half(u, 1) * tooth(u + 0.03)]); }
  veins.push([-L, 0, 0, rand(-0.04, 0.04) * R, L * 0.9, 0, 1.8]);
  return { pts, veins, stalk: [-L * 0.9, 0, -L - 0.1 * R, rand(-0.05, 0.05) * R, -L - 0.24 * R, rand(-0.1, 0.1) * R] };
}

// Painted flat in plan view, so drawLeaves can turn it on the water and foreshorten it after.
// A transparent wash mottled with neighbouring hues, paler where the wash thins at the rim,
// pooling darker toward the stalk, with fine darker veins.
function makeFallLeafSprite(fam = pickFall()) {
  const R = SPRITE_R;
  const kind = pickWeighted(FALL_FORMS).kind;
  const { pts, veins, stalk } = fallLeafShape(kind, R);
  let hx = Math.abs(stalk[4]), hy = Math.abs(stalk[5]);
  for (const [x, y] of pts) { hx = Math.max(hx, Math.abs(x)); hy = Math.max(hy, Math.abs(y)); }
  const pad = 10, W = (hx + pad) * 2, H = (hy + pad) * 2;
  const [c, g] = makeCanvas(W, H);
  g.translate(W / 2, H / 2);
  const outline = () => {
    g.beginPath();
    pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.closePath();
  };
  const within = (k) => { const [x, y] = pick(pts), s = Math.sqrt(Math.random()) * k; return [x * s, y * s]; };
  const blot = (colors, k, size, alpha) => {
    const [x, y] = within(k), r = R * rand(...size);
    g.globalAlpha = alpha;
    g.fillStyle = pick(colors);
    g.beginPath();
    g.ellipse(x, y, r, r * rand(0.6, 1), rand(0, 3), 0, Math.PI * 2);
    g.fill();
  };

  g.save();
  outline();
  g.clip();
  g.globalAlpha = 0.92;
  g.fillStyle = pick(fam.base);
  g.fillRect(-W / 2, -H / 2, W, H);
  g.filter = 'blur(5px)';
  for (let i = 0; i < 6 + (Math.random() * 4 | 0); i++) blot(fam.strokes, 0.95, [0.16, 0.36], rand(0.35, 0.6));
  if (Math.random() < 0.35) blot(pickFall().strokes, 0.9, [0.2, 0.34], 0.5);
  g.filter = 'blur(4px)';
  g.globalAlpha = 0.55;
  g.strokeStyle = pick(fam.top);
  g.lineWidth = R * 0.14;
  outline();
  g.stroke();
  g.filter = 'none';
  const ox = kind === 'maple' ? 0 : stalk[0] * 0.6;
  const pool = g.createRadialGradient(ox, 0, 0, ox, 0, R * 0.62);
  pool.addColorStop(0, fam.vein);
  pool.addColorStop(1, fam.vein + '00');
  g.globalAlpha = 0.42;
  g.fillStyle = pool;
  g.fillRect(-W / 2, -H / 2, W, H);
  g.filter = 'blur(0.6px)';
  for (const [x1, y1, xc, yc, x2, y2, wd] of veins) brush(g, x1, y1, xc, yc, x2, y2, wd, fam.vein, rand(0.4, 0.62));
  g.filter = 'none';
  g.restore();
  brush(g, ...stalk, 2.2, shade(fam.vein, 12), 0.85);

  g.globalCompositeOperation = 'destination-over';
  g.filter = 'blur(4px)';
  g.globalAlpha = 0.18;
  g.fillStyle = '#12305a';
  outline();
  g.fill();
  g.filter = 'none';
  g.globalCompositeOperation = 'source-over';
  g.globalAlpha = 1;
  impastoRelief(c, 1.1, 0, 0.6);
  featherEdges(c, 2);
  return withMips(c, W, H);
}

/* ---------- water lilies ---------- */

// Cupped pink blooms, a few deeper magenta or pale ones, and the odd small orange-red bud,
// as in the willow painting.
const BLOOMS = [
  { weight: 30, colors: ['#d8408c', '#ec6aa8', '#f48cc0', '#fcd0e6'] },
  { weight: 26, colors: ['#e05c9c', '#f080b8', '#f8a8d0', '#fde0ee'] },
  { weight: 18, colors: ['#c83a7c', '#e0609c', '#f088b8', '#fac8e0'] },
  { weight: 16, colors: ['#e890c0', '#f4b0d4', '#f8cce4', '#fff0f6'] },
  { weight: 10, colors: ['#c8402c', '#e0603c', '#f08a5a', '#f8c0a0'] },
];

// Every bloom is built from its own recipe (petal count, length, width, pointed or round
// tips, how open the cup is, lean, and how many layers) so no two look alike.
// Pixel art: flat petals in three shades of one ramp around a yellow centre.
function makePixelFlower() {
  const f = rand(18, 30);
  const W = f * 3.2, H = f * 2.8;
  const [c, g] = makeCanvas(W, H);
  g.translate(W / 2, H * 0.68);
  const ramp = PIXEL_RAMPS[Math.random() < 0.12 ? 'red' : 'pink'];
  const bud = Math.random() < 0.18;
  const petals = bud ? 3 : 5 + (Math.random() * 4 | 0);
  const spread = bud ? 0.35 : rand(0.8, 1.3);
  const len = f * (bud ? 0.7 : rand(0.75, 1));
  const width = f * (bud ? 0.42 : rand(0.32, 0.42));
  const petal = (a, l, wd, color, flat) => {
    g.save();
    g.scale(1, flat);
    g.rotate(a);
    g.fillStyle = color;
    g.beginPath();
    g.ellipse(l * 0.5, 0, l * 0.5, wd * 0.5, 0, 0, Math.PI * 2);
    g.fill();
    g.restore();
  };
  if (!bud) {
    for (const a of [rand(-0.2, 0.2), Math.PI + rand(-0.2, 0.2), rand(0.4, 0.8), Math.PI - rand(0.4, 0.8)]) {
      petal(a, len * 1.05, width * 1.1, ramp[1], 0.4);
    }
  }
  for (let i = 0; i < petals; i++) {
    const a = -Math.PI / 2 + (i / (petals - 1) - 0.5) * 2 * spread;
    petal(a, len, width, i % 2 ? ramp[2] : ramp[3], 0.8);
  }
  for (let i = 0; i < petals - 2; i++) {
    const a = -Math.PI / 2 + (i / Math.max(1, petals - 3) - 0.5) * spread;
    petal(a, len * 0.75, width * 0.9, i === 0 ? ramp[4] : ramp[3], 0.8);
  }
  if (!bud) {
    g.fillStyle = PIXEL_RAMPS.gold[2];
    g.beginPath();
    g.ellipse(0, -f * 0.28, f * 0.17, f * 0.11, 0, 0, Math.PI * 2);
    g.fill();
  }
  return { canvas: c, w: W, h: H, f };
}

function makeFlowerSprite() {
  if (PIXEL_ART) return makePixelFlower();
  const f = rand(16, 28);
  const W = f * 3.2, H = f * 2.8;
  const [c, g] = makeCanvas(W, H);
  g.translate(W / 2, H * 0.68);
  const tint = pickWeighted(BLOOMS).colors;
  const bud = Math.random() < 0.18;
  const petals = bud ? 3 + (Math.random() * 3 | 0) : 5 + (Math.random() * 12 | 0);
  const spread = bud ? rand(0.25, 0.45) : rand(0.7, 1.55);
  const len = f * (bud ? rand(0.6, 0.85) : rand(0.6, 1.05));
  const width = f * (bud ? rand(0.3, 0.4) : rand(0.2, 0.42));
  const pointed = Math.random() < 0.5;
  const squash = rand(0.6, 0.95);
  const lean = rand(-0.3, 0.3);
  const tiers = bud ? 1 : 1 + (Math.random() * 3 | 0);

  const petal = (a, l, wd, color, alpha, flat) => {
    const tx = Math.cos(a) * l, ty = Math.sin(a) * l * flat;
    const side = rand(-0.25, 0.25) * l;
    const cx = tx * 0.5 - Math.sin(a) * side, cy = ty * 0.5 + Math.cos(a) * side * flat;
    if (pointed) {
      paint(g, 0, 0, cx, cy, tx * 0.85, ty * 0.85, wd, color, alpha);
      brush(g, tx * 0.55, ty * 0.55, tx * 0.8, ty * 0.8, tx * 1.05, ty * 1.05, wd * 0.35, color, alpha * 0.9);
    } else {
      brush(g, 0, 0, cx, cy, tx * 0.9, ty * 0.9, wd, color, alpha * 0.85);
      paint(g, 0, 0, cx, cy, tx, ty, wd * 0.8, color, alpha);
    }
    if (Math.random() < 0.5) brush(g, tx * 0.55, ty * 0.55, tx * 0.7, ty * 0.7 - 1, tx * 0.85, ty * 0.85, wd * 0.35, tint[3], 0.55);
  };

  // A faint blue shadow where the bloom sits on its pad.
  g.filter = 'blur(2px)';
  g.fillStyle = 'rgba(40, 50, 130, .22)';
  g.beginPath();
  g.ellipse(0, f * 0.1, f * rand(0.6, 1), f * rand(0.18, 0.3), 0, 0, Math.PI * 2);
  g.fill();
  g.filter = 'blur(1.1px)';
  // Open blooms first lay a few flat outer petals on the water.
  if (!bud && Math.random() < 0.7) {
    for (let i = 0; i < 3 + (Math.random() * 4 | 0); i++) {
      const a = Math.random() < 0.5 ? rand(-0.3, 0.25) : Math.PI + rand(-0.25, 0.3);
      petal(a, len * rand(0.8, 1.1), width * 1.05, tint[0], 0.8, 0.35);
    }
  }
  // Then the cup, outer petals first so the upright middle ones sit in front.
  for (let t = 0; t < tiers; t++) {
    const k = 1 - t * 0.28;
    const n = Math.max(3, Math.round(petals * k));
    const angles = Array.from({ length: n }, (_, i) =>
      -Math.PI / 2 + lean + (i / (n - 1) - 0.5) * 2 * spread * k + rand(-0.12, 0.12));
    angles.sort((p, q) => Math.abs(q + Math.PI / 2 - lean) - Math.abs(p + Math.PI / 2 - lean));
    for (const a of angles) {
      petal(a, len * k * rand(0.8, 1.1), width * k * rand(0.85, 1.15), tint[Math.min(2, t + (Math.random() < 0.5 ? 0 : 1))], 0.88, squash);
    }
  }
  if (!bud && tint !== BLOOMS[4].colors && Math.random() < 0.6) {
    brush(g, -f * 0.08, -f * 0.3, 0, -f * 0.36, f * 0.08, -f * 0.3, f * rand(0.1, 0.18), '#f4d070', 0.8);
  }
  g.filter = 'none';
  g.globalAlpha = 1;
  impastoRelief(c, 0.9);
  return { canvas: c, w: W, h: H, f };
}

/* ---------- lake setup ---------- */

// Small canvases stay on the CPU in most browsers and get re-uploaded on every draw,
// so pad sprites and their shrunk copies are packed into atlas pages. Each page is kept
// at most 2048px square: a single larger canvas drops off the GPU and every draw from
// it becomes dozens of times slower.
const ATLAS_PAGE = 2048;
function buildPadAtlas(sprites) {
  const cellW = Math.max(...sprites.map((sp) => sp.mips.reduce((s, m) => s + m.width, 0)));
  const cellH = Math.max(...sprites.map((sp) => sp.mips[0].height));
  const cols = Math.max(1, Math.floor(ATLAS_PAGE / cellW));
  const rows = Math.max(1, Math.floor(ATLAS_PAGE / cellH));
  const perPage = cols * rows;
  const pages = [];
  sprites.forEach((sp, i) => {
    const pi = Math.floor(i / perPage), slot = i % perPage;
    if (!pages[pi]) {
      const count = Math.min(perPage, sprites.length - pi * perPage);
      const page = document.createElement('canvas');
      page.width = cellW * Math.min(cols, count);
      page.height = cellH * Math.ceil(count / cols);
      pages[pi] = page;
    }
    const ag = pages[pi].getContext('2d');
    let x = (slot % cols) * cellW;
    const y = Math.floor(slot / cols) * cellH;
    sp.page = pi;
    sp.rects = sp.mips.map((m) => {
      ag.drawImage(m, x, y);
      const rect = [x, y, m.width, m.height];
      x += m.width;
      return rect;
    });
    sp.mips = null;
  });
  return pages;
}

// Broad drifts of sky-lit and shadowed pads give the lake Monet's violet-blue light.
function padSpriteAt(x, y) {
  if (rng() < sunAmount(x - cam.x, (y - cam.y) * K) * 1.4) return pick(padSprites.sky);
  const s = 0.0026 / unit;
  const sky = fbm(x * s, y * s * 0.8, 61.2);
  const dusk = fbm(x * s * 1.3, y * s * 0.6, 13.4);
  if (rng() < clamp((sky - 0.52) * 4, 0, 0.9)) return pick(padSprites.sky);
  if (rng() < clamp((dusk - 0.56) * 4, 0, 0.75)) return pick(padSprites.dusk);
  return pick(padSprites.green);
}

function setup() {
  // Soft painted strokes don't need full retina sharpness, and 1.5x paints 44% fewer pixels than 2x.
  dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  w = innerWidth;
  h = innerHeight;
  worldH = h / K;
  unit = clamp(Math.min(w, h) / 760, 0.65, 1.35);
  // The scene is drawn at rs device pixels per CSS pixel; sprites are still painted at dpr.
  // Phone-sized views (short side under 600 CSS px, in either orientation) use 2 px art pixels.
  rs = PIXEL_ART ? 1 / (Math.min(w, h) < 600 ? 2 : 3) : dpr;
  canvas.width = Math.round(w * rs);
  canvas.height = Math.round(h * rs);
  if (PIXEL_ART) {
    view.width = canvas.width;
    view.height = canvas.height;
  }

  sun = { x: w * rand(0.32, 0.68), y: h * rand(0.14, 0.32), r: Math.min(w, h) * rand(0.2, 0.26) };
  water = paintWater();
  sunlight = makeSunlight();
  makeWash();
  grain = makeCanvasGrain();
  dabSprites = Array.from({ length: 14 }, () => makeDabSprite());
  sunDabs = Array.from({ length: 8 }, () => makeDabSprite(true));
  shimmer = makeShimmer();
  padSprites = PIXEL_ART ? {
    green: Array.from({ length: 44 }, () => makePadSprite()),
    sky: Array.from({ length: 14 }, () => makePadSprite(SKY_PADS)),
    dusk: Array.from({ length: 12 }, () => makePadSprite(DUSK_PADS)),
  } : {
    green: Array.from({ length: 48 }, () => makeFallLeafSprite()),
    sky: Array.from({ length: 12 }, () => makeFallLeafSprite(FALL_SUNLIT)),
    dusk: Array.from({ length: 10 }, () => makeFallLeafSprite(FALL_SHADE)),
  };
  padAtlas = buildPadAtlas([...padSprites.green, ...padSprites.sky, ...padSprites.dusk]);
  flowerSprites = PIXEL_ART ? Array.from({ length: 40 }, makeFlowerSprite) : [];

  leaves = [];
  paths = [];
  ripples = [];
  drawing = null;
  boat = { x: w * 0.5, y: worldH * 0.5, angle: -0.3, route: null, d: 0, speed: 0, row: 0, wakeTimer: 0 };
  boatSprites = makeBoatSprites();
  cam = { x: 0, y: 0 };
  pointer = null;
  chunks = new Map();
  placed = new Map();
  worldSeed = (Math.random() * 2 ** 31) | 0;
  leafCell = 48 * unit;
  leafMaxR = (PIXEL_ART ? 124 : WC_LEAF_SIZES[0][1]) * unit * LEAF_DEPTH * leafScale();
  if (PIXEL_ART) setupPixelWorld();
  ensureChunks(Infinity);
  if (!PIXEL_ART) setupGarden();
}

// A few broad leaves first, then each smaller size tucked into the gaps left by the last,
// so the water is nearly covered. No bubble-sized fillers: leaves overlap loosely instead.
const LEAF_SIZES = [[84, 124, 0.6, 0.03], [60, 90, 0.6, 0.08], [38, 62, 0.58, 0.34], [22, 40, 0.56, 0.6], [12, 22, 0.55, 0.45]];
// Watercolour leaves are drawn smaller, with proportionally more of them to keep the cover.
const WC_LEAF_SCALE = 0.7;
const leafScale = () => (PIXEL_ART ? 1 : WC_LEAF_SCALE);
// Fallen leaves are more alike in size than pads, and packed so they lie on top of one
// another: the lake is buried in them, with water only where the boat opens it.
const WC_LEAF_SIZES = [[84, 112, 0.5, 0.1], [64, 84, 0.47, 0.45], [46, 64, 0.45, 0.8], [32, 46, 0.42, 0.9], [22, 32, 0.4, 0.6]];

// Each chunk is seeded by its position, so water you come back to holds the same leaves.
function growChunk(cx, cy) {
  const key = cx + ',' + cy;
  const C = CHUNK * unit, x0 = cx * C, y0 = cy * C;
  const attempts = (C * C) / (90 * unit * unit) / leafScale() ** 2;
  const gcell = leafCell;
  const list = PIXEL_ART ? growPixelChunk(cx, cy) : [];
  rng = seeded(worldSeed ^ Math.imul(cx, 73856093) ^ Math.imul(cy, 19349663));
  // The tiniest leaves would be only a pixel or two wide in pixel art, so they're left out.
  for (const [rMin, rMax, overlap, share] of PIXEL_ART ? LEAF_SIZES.slice(0, -1) : WC_LEAF_SIZES) {
    for (let attempt = 0; attempt < attempts * share; attempt++) {
      const x = x0 + rand(0, C), y = y0 + rand(0, C);
      const r = rand(rMin, rMax) * unit * LEAF_DEPTH * leafScale();
      let ok = Math.hypot(x - boat.x, (y - boat.y) * K) > BOAT_LEN * unit * 0.6 + r * 0.6;
      const reach = Math.ceil(((r + leafMaxR) * overlap) / gcell);
      const gx = Math.floor(x / gcell), gy = Math.floor(y / gcell);
      for (let ox = -reach; ok && ox <= reach; ox++) {
        for (let oy = -reach; ok && oy <= reach; oy++) {
          const bucket = placed.get((gx + ox) + ',' + (gy + oy));
          if (!bucket) continue;
          for (const o of bucket) {
            const dx = o.hx - x, dy = o.hy - y;
            const min = (o.r + r) * overlap;
            if (dx * dx + dy * dy < min * min) { ok = false; break; }
          }
        }
      }
      if (!ok || (PIXEL_ART && !padFits(x, y, r)) || (GRASS_MAT && riverAt(x, y) < r * RIVER_BANK)) continue;
      const leaf = {
        x, y, hx: x, hy: y, vx: 0, vy: 0, r, qx: 0, qy: 0,
        a: rand(0, Math.PI * 2),
        spin: rng() < 0.5 ? -1 : 1,
        phase: rand(0, Math.PI * 2),
        sprite: padSpriteAt(x, y),
        flip: rng() < 0.5 ? -1 : 1, stretch: rand(0.86, 1.16),
        flower: r > 22 * unit && rng() < 0.07 ? pick(flowerSprites) : null,
        flowerFlip: rng() < 0.5 ? -1 : 1, flowerScale: rand(0.8, 1.25),
        cell: gx + ',' + gy,
      };
      if (GRASS_MAT) {
        leaf.flower = null;
        if (r > 24 * unit && rng() < PAD_DECOR) leaf.deco = pick(decorSprites.padDecor);
      }
      if (PIXEL_ART && !leaf.flower && !leaf.deco && r > 26 * unit && rng() < 0.018) leaf.frog = pick(decorSprites.frog);
      if (PIXEL_ART && underBridge(x, y, r)) leaf.flower = leaf.frog = leaf.deco = null;
      list.push(leaf);
      if (!placed.has(leaf.cell)) placed.set(leaf.cell, []);
      placed.get(leaf.cell).push(leaf);
    }
  }
  rng = Math.random;
  chunks.set(key, list);
}

// Grow chunks just beyond the view (a few per frame, so panning never stalls) and let go
// of ones left well behind.
function ensureChunks(budget = 2) {
  const C = CHUNK * unit, m = C * 0.5;
  const ax = Math.floor((cam.x - m) / C), bx = Math.floor((cam.x + w + m) / C);
  const ay = Math.floor((cam.y - m) / C), by = Math.floor((cam.y + worldH + m) / C);
  let changed = false;
  const mx = (ax + bx) / 2, my = (ay + by) / 2;
  const missing = [];
  for (let cx = ax; cx <= bx; cx++) {
    for (let cy = ay; cy <= by; cy++) if (!chunks.has(cx + ',' + cy)) missing.push([cx, cy]);
  }
  missing.sort((a, b) => Math.hypot(a[0] - mx, a[1] - my) - Math.hypot(b[0] - mx, b[1] - my));
  for (const [cx, cy] of missing.slice(0, budget)) { growChunk(cx, cy); changed = true; }
  for (const [key, list] of chunks) {
    const [cx, cy] = key.split(',').map(Number);
    if (cx >= ax - 2 && cx <= bx + 2 && cy >= ay - 2 && cy <= by + 2) continue;
    chunks.delete(key);
    if (PIXEL_ART) pixelChunks.delete(key);
    for (const l of list) {
      const bucket = placed.get(l.cell);
      if (!bucket) continue;
      bucket.splice(bucket.indexOf(l), 1);
      if (!bucket.length) placed.delete(l.cell);
    }
    changed = true;
  }
  if (changed) {
    leaves = [].concat(...chunks.values());
    leaves.sort((a, b) => a.hy - b.hy);
    if (PIXEL_ART) gatherPixelWorld();
  }
}

// While drawing, holding the pointer near an edge slides the view that way and the path
// keeps growing under it. Otherwise the view drifts to keep the boat comfortably in sight.
function updateCamera(dt) {
  if (drawing && pointer) {
    const zone = Math.min(120, Math.min(w, h) * 0.14);
    const push = (d) => (d < zone ? Math.pow(1 - Math.max(0, d) / zone, 1.5) : 0);
    const speed = 520 * unit;
    const vx = (push(w - pointer.clientX) - push(pointer.clientX)) * speed;
    const vy = (push(h - pointer.clientY) - push(pointer.clientY)) * speed;
    if (vx || vy) {
      cam.x += vx * dt;
      cam.y += (vy * dt) / K;
      const q = toWorld(pointer);
      const last = drawing.pts[drawing.pts.length - 1];
      if (Math.hypot(q.x - last.x, q.y - last.y) >= 5 * unit) addSegment(drawing, q.x, q.y, 1);
    }
  } else if (!drawing) {
    const bx = boat.x - cam.x, by = (boat.y - cam.y) * K;
    const mx = w * 0.2, my = h * 0.2;
    const ox = bx < mx ? bx - mx : bx > w - mx ? bx - (w - mx) : 0;
    const oy = by < my ? by - my : by > h - my ? by - (h - my) : 0;
    const ease = 1 - Math.exp(-dt * 1.6);
    cam.x += ox * ease;
    cam.y += (oy * ease) / K;
    if (hover && pointer) hover = toWorld(pointer);
  }
  ensureChunks();
}

/* ---------- paths ---------- */

function toWorld(e) {
  return { x: e.clientX + cam.x, y: e.clientY / K + cam.y };
}

// Points with s = 0 are route only: the boat travels them but they don't clear a channel.
function addPoint(path, x, y, s) {
  const pts = path.pts;
  const prev = pts[pts.length - 1];
  const d = prev ? prev.d + Math.hypot(x - prev.x, y - prev.y) : 0;
  pts.push({ x, y, s, d });
  path.length = d;
  const b = path.bounds;
  b.x0 = Math.min(b.x0, x); b.y0 = Math.min(b.y0, y);
  b.x1 = Math.max(b.x1, x); b.y1 = Math.max(b.y1, y);
}

function addSegment(path, x, y, s) {
  const last = path.pts[path.pts.length - 1];
  const dist = Math.hypot(x - last.x, y - last.y);
  const steps = Math.ceil(dist / (8 * unit));
  for (let i = 1; i <= steps; i++) {
    const px = last.x + (x - last.x) * i / steps, py = last.y + (y - last.y) * i / steps;
    if (!PIXEL_ART) {
      addPoint(path, px, py, s);
      continue;
    }
    const p = steerClear(path, px, py), prev = path.pts[path.pts.length - 1];
    if (Math.hypot(p.x - prev.x, p.y - prev.y) >= unit) addPoint(path, p.x, p.y, s);
  }
}

// A line drawn through a rock or pier bends around it, on the side it was already passing,
// leaving room for the hull: half a boat before and after it, a little over half its beam beside.
// Only a line heading towards one bends; one already beside it and leaving is left alone.
function steerClear(path, x, y) {
  const L = BOAT_LEN * unit, beam = BOAT_WIDTH * unit * 0.62;
  const local = (det) => {
    const cx = x - det.o.x, cy = (y - det.o.y) * K;
    return { t: (cx * det.ux + cy * det.uy) / (det.o.r + L * 0.5), n: (cy * det.ux - cx * det.uy) / (det.o.r + beam) };
  };
  let det = path.detour, q = det && local(det);
  if (!q || q.t * q.t + q.n * q.n >= 1) {
    det = path.detour = null;
    const prev = path.pts[path.pts.length - 1];
    const dx = x - prev.x, dy = (y - prev.y) * K, d = Math.hypot(dx, dy);
    if (!d) return { x, y };
    for (const o of fixedNear(x, y, L)) {
      const c = { o, ux: dx / d, uy: dy / d, side: 1 }, l = local(c);
      if (l.t < 0 && l.t * l.t + l.n * l.n < 1) {
        c.side = l.n < 0 ? -1 : 1;
        det = path.detour = c;
        q = l;
        break;
      }
    }
    if (!det) return { x, y };
  }
  const t = clamp(q.t, -1, 1), n = det.side * Math.sqrt(1 - t * t);
  const A = t * (det.o.r + L * 0.5), B = n * (det.o.r + beam);
  return { x: det.o.x + A * det.ux - B * det.uy, y: det.o.y + (A * det.uy + B * det.ux) / K };
}

function pointAt(path, d) {
  const pts = path.pts;
  d = clamp(d, 0, path.length);
  let lo = 0, hi = pts.length - 1;
  while (hi - lo > 1) {
    const mid = (lo + hi) >> 1;
    if (pts[mid].d < d) lo = mid; else hi = mid;
  }
  const a = pts[lo], b = pts[hi];
  const t = b.d > a.d ? (d - a.d) / (b.d - a.d) : 0;
  return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
}

view.addEventListener('pointerdown', (e) => {
  try { view.setPointerCapture(e.pointerId); } catch (_) {}
  pointer = { clientX: e.clientX, clientY: e.clientY };
  const p = toWorld(e);
  drawing = { pts: [], length: 0, bounds: { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity }, halfWidth: 46 * unit, idle: 0, released: false };
  // The boat only sets off along a line that begins at the boat.
  if (nearBoat(p)) {
    addPoint(drawing, boat.x, boat.y, 1);
    addSegment(drawing, p.x, p.y, 1);
    boat.route = drawing;
    boat.d = 0;
  } else {
    addPoint(drawing, p.x, p.y, 1);
  }
  paths.push(drawing);
  hover = null;
});

view.addEventListener('pointermove', (e) => {
  pointer = { clientX: e.clientX, clientY: e.clientY };
  const p = toWorld(e);
  if (!drawing) {
    hover = e.pointerType === 'mouse' ? p : null;
    view.style.cursor = nearBoat(p) ? 'pointer' : 'crosshair';
    return;
  }
  const coalesced = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const events = coalesced.length ? coalesced : [e];
  for (const ev of events) {
    const q = toWorld(ev);
    const last = drawing.pts[drawing.pts.length - 1];
    if (Math.hypot(q.x - last.x, q.y - last.y) < 5 * unit) continue;
    addSegment(drawing, q.x, q.y, 1);
  }
});

function release() {
  if (!drawing) return;
  drawing.released = true;
  drawing = null;
}
view.addEventListener('pointerup', release);
view.addEventListener('pointercancel', release);
view.addEventListener('pointerleave', () => { hover = null; });

/* ---------- simulation ---------- */

const BOAT_LEN = 92, BOAT_WIDTH = 38, BOAT_SPEED = 80;

// The boat is drawn flat on screen (no lake perspective), so its geometry lives in screen space.
function boatScreenAngle() {
  return Math.atan2(Math.sin(boat.angle) * K, Math.cos(boat.angle));
}

function boatPoint(along, side) {
  const a = boatScreenAngle();
  const sx = Math.cos(a) * along - Math.sin(a) * side;
  const sy = Math.sin(a) * along + Math.cos(a) * side;
  return { x: boat.x + sx, y: boat.y + sy / K };
}

// Rocks and bridge piers, which never move.
function fixedNear(x, y, reach) {
  const out = [], gx = Math.floor(x / leafCell), gy = Math.floor(y / leafCell);
  const rx = Math.ceil(reach / leafCell), ry = Math.ceil(reach / K / leafCell);
  for (let ox = -rx; ox <= rx; ox++) {
    for (let oy = -ry; oy <= ry; oy++) {
      const bucket = placed.get((gx + ox) + ',' + (gy + oy));
      if (bucket) for (const o of bucket) if (o.fixed) out.push(o);
    }
  }
  return out;
}

// How deep a hull at (x, y) heading along angle sinks into the nearest fixed thing. The hull
// is a capsule on screen; a fixed thing's footprint is the world circle pads bump into, so an
// ellipse on screen.
function hullOverlap(x, y, angle) {
  const L = BOAT_LEN * unit, hr = BOAT_WIDTH * unit * 0.45;
  const a = Math.atan2(Math.sin(angle) * K, Math.cos(angle));
  const ex = Math.cos(a) * L * 0.34, ey = Math.sin(a) * L * 0.34;
  let worst = 0;
  for (const o of fixedNear(x, y, L)) {
    const cx = o.x - x, cy = (o.y - y) * K;
    const t = clamp((cx * ex + cy * ey) / (ex * ex + ey * ey), -1, 1);
    const dx = cx - ex * t, dy = cy - ey * t, d = Math.hypot(dx, dy) || 1e-6;
    const re = (o.r * K) / Math.hypot((K * dx) / d, dy / d);
    worst = Math.max(worst, re + hr - d);
  }
  return worst;
}

function nearBoat(p) {
  return Math.hypot(p.x - boat.x, (p.y - boat.y) * K) < BOAT_LEN * unit * 0.8;
}

function boatRemaining() {
  const route = boat.route;
  if (!route) return 0;
  const lead = route.released ? 0 : 36 * unit;
  return Math.max(0, route.length - lead - boat.d);
}

function updateBoat(dt) {
  const remaining = boatRemaining();
  const cruise = BOAT_SPEED * unit * (PIXEL_ART ? boatSpeedMul() : 1);
  const target = Math.min(cruise, remaining * 1.6);
  boat.speed += (target - boat.speed) * Math.min(1, dt * 3);
  if (boat.route) {
    const was = PIXEL_ART && { x: boat.x, y: boat.y, angle: boat.angle, d: boat.d };
    boat.d = Math.min(boat.d + boat.speed * dt, boat.d + remaining);
    const here = pointAt(boat.route, boat.d);
    boat.x = here.x;
    boat.y = here.y;
    if (boat.speed > 4 * unit) {
      const ahead = pointAt(boat.route, boat.d + 12 * unit);
      const behind = pointAt(boat.route, boat.d - 12 * unit);
      if (Math.hypot(ahead.x - behind.x, ahead.y - behind.y) > 1) {
        let diff = Math.atan2(ahead.y - behind.y, ahead.x - behind.x) - boat.angle;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        boat.angle += diff * Math.min(1, dt * 5);
      }
    }
    // A move that presses deeper into a rock or pier is refused: if only the turn swings the hull
    // into it the boat sidles on without turning, otherwise it halts still against it. Any move
    // that eases out is allowed, so it never stays wedged.
    if (was) {
      const before = hullOverlap(was.x, was.y, was.angle);
      const blocked = (angle) => {
        const depth = hullOverlap(boat.x, boat.y, angle);
        return depth > 0 && depth > before;
      };
      if (blocked(boat.angle)) {
        if (!blocked(was.angle)) boat.angle = was.angle;
        else {
          Object.assign(boat, was);
          boat.speed = 0;
        }
      }
    }
  }

  const effort = boat.speed / cruise;
  boat.effort = effort;
  boat.row += dt * 3.2 * effort;
  if (effort < 0.25) return;
  const L = BOAT_LEN * unit;
  // Ripples live in screen space, since the boat is drawn without the lake's perspective.
  const a = boatScreenAngle();
  boat.wakeTimer -= dt;
  if (boat.wakeTimer <= 0) {
    boat.wakeTimer = rand(0.16, 0.24);
    for (const side of [-1, 1]) {
      const p = boatPoint(-L * rand(0.3, 0.42), side * L * 0.16);
      const out = a + Math.PI + side * rand(1.05, 1.35);
      const v = rand(20, 30) * unit * effort;
      ripples.push({
        x: p.x, y: p.y * K, vx: Math.cos(out) * v, vy: Math.sin(out) * v,
        angle: a + side * rand(0.35, 0.6), len: rand(16, 26) * unit,
        age: 0, life: rand(1.6, 2.2), sprite: pick(dabSprites),
      });
    }
    if (Math.random() < 0.35) {
      const p = boatPoint(-L * 0.5, rand(-0.06, 0.06) * L);
      ripples.push({
        x: p.x, y: p.y * K, vx: 0, vy: 0,
        angle: a + Math.PI / 2 + rand(-0.3, 0.3), len: rand(12, 18) * unit,
        age: 0, life: rand(1.2, 1.8), sprite: pick(dabSprites),
      });
    }
  }
  const dip = Math.sin(boat.row) > 0.96;
  if (dip && !boat.dipped) {
    for (const side of [-1, 1]) {
      const p = boatPoint(-L * 0.1, side * L * 0.58);
      const start = rand(0, Math.PI * 2);
      const dabs = Array.from({ length: 7 }, (_, i) => ({
        a: start + (i / 7) * Math.PI * 2 + rand(-0.2, 0.2), sprite: pick(dabSprites),
      })).filter(() => Math.random() < 0.8);
      ripples.push({ ring: true, x: p.x, y: p.y * K, vx: 0, vy: 0, dabs, age: 0, life: 1.6 });
    }
  }
  boat.dipped = dip;
}

function updatePaths(dt) {
  updateBoat(dt);
  for (const path of paths) {
    const sailing = path === boat.route && (!path.released || boatRemaining() > 1);
    if (path.released && !sailing) path.idle += dt;
    for (const p of path.pts) {
      const passed = (path === boat.route && boat.d > p.d + 90 * unit) || path.idle > 0.8;
      if (passed) p.s = Math.max(0, p.s - dt / 3.5);
    }
  }
  paths = paths.filter((p) => !p.released || p === boat.route || p.pts.some((q) => q.s > 0));
  const drag = Math.pow(0.4, dt);
  for (const r of ripples) {
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    r.vx *= drag;
    r.vy *= drag;
  }
  ripples = ripples.filter((r) => (r.age += dt) < r.life);
}

function channelForce(leaf, path) {
  const R = path.halfWidth + leaf.r;
  const b = path.bounds;
  if (leaf.x < b.x0 - R || leaf.x > b.x1 + R || leaf.y < b.y0 - R || leaf.y > b.y1 + R) return null;
  const pts = path.pts;
  let best = Infinity, bx = 0, by = 0, bs = 0, nx = 0, ny = 0;
  if (pts.length === 1) {
    best = Math.hypot(leaf.x - pts[0].x, leaf.y - pts[0].y);
    bx = pts[0].x; by = pts[0].y; bs = pts[0].s;
  }
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], q = pts[i + 1];
    if (a.s <= 0 && q.s <= 0) continue;
    const sx = q.x - a.x, sy = q.y - a.y;
    const len2 = sx * sx + sy * sy || 1;
    const t = clamp(((leaf.x - a.x) * sx + (leaf.y - a.y) * sy) / len2, 0, 1);
    const cx = a.x + sx * t, cy = a.y + sy * t;
    const d = Math.hypot(leaf.x - cx, leaf.y - cy);
    if (d < best) {
      best = d; bx = cx; by = cy;
      bs = a.s + (q.s - a.s) * t;
      const sl = Math.sqrt(len2);
      nx = -sy / sl; ny = sx / sl;
    }
  }
  if (best >= R || bs <= 0) return null;
  let ux, uy;
  if (best > 0.5) {
    ux = (leaf.x - bx) / best;
    uy = (leaf.y - by) / best;
  } else {
    ux = nx * leaf.spin;
    uy = ny * leaf.spin;
  }
  const push = (R - best) * CHANNEL_PUSH * bs;
  return { x: ux * push, y: uy * push, depth: (R - best) * bs };
}

function step(dt) {
  const f = dt * 60;
  const damp = Math.pow(DAMPING, f);
  const cell = leafCell;
  const grid = new Map();
  const cellKey = (gx, gy) => (gx & 0xffff) * 65536 + (gy & 0xffff);
  for (let i = 0; i < leaves.length; i++) {
    const key = cellKey(Math.floor(leaves[i].x / cell), Math.floor(leaves[i].y / cell));
    const bucket = grid.get(key);
    if (bucket) bucket.push(i); else grid.set(key, [i]);
  }

  const hullA = boatPoint(-BOAT_LEN * unit * 0.3, 0);
  const hullB = boatPoint(BOAT_LEN * unit * 0.3, 0);
  const hullDX = hullB.x - hullA.x, hullDY = (hullB.y - hullA.y) * K;
  const hullLen2 = hullDX * hullDX + hullDY * hullDY || 1;

  for (let i = 0; i < leaves.length; i++) {
    const l = leaves[i];
    if (l.fixed) continue;
    if (l.wander) {
      const t = time * l.wander + l.phase;
      l.hx = l.ox + Math.cos(t) * l.loop;
      l.hy = l.oy + Math.sin(t) * l.loop * 0.7;
    }
    const drift = PIXEL_ART ? 0 : unit;
    const tx = l.hx + Math.sin(time * 0.25 + l.phase) * 2.5 * drift;
    const ty = l.hy + Math.cos(time * 0.2 + l.phase) * 2 * drift;
    let fx = (tx - l.x) * HOME_SPRING;
    let fy = (ty - l.y) * HOME_SPRING;
    // Every overlap squeezes the leaf along its line of action, by how deep it is pressed.
    // Directions are summed as doubled angles in screen space, so pressure from opposite
    // sides adds up instead of cancelling.
    let qx = 0, qy = 0;
    const press = (dx, dy, m) => {
      const sx = dx, sy = dy * K;
      const len2 = sx * sx + sy * sy || 1;
      qx += m * (sx * sx - sy * sy) / len2;
      qy += m * (2 * sx * sy) / len2;
    };

    for (const path of paths) {
      const c = channelForce(l, path);
      if (c) {
        fx += c.x; fy += c.y;
        press(c.x, c.y, c.depth / l.r * 2);
      }
    }

    {
      // Measured in screen space against the hull's spine, since the boat isn't foreshortened.
      const R = BOAT_WIDTH * unit * 0.7 + l.r * 0.8;
      const px = l.x - hullA.x, py = (l.y - hullA.y) * K;
      const t = clamp((px * hullDX + py * hullDY) / hullLen2, 0, 1);
      const dx = px - hullDX * t, dy = py - hullDY * t;
      const d = Math.hypot(dx, dy);
      if (d < R && d > 0) {
        const push = (R - d) * 0.08;
        fx += dx / d * push; fy += dy / d * push / K;
        press(dx, dy / K, (R - d) / l.r * 2);
      }
    }

    if (hover) {
      const dx = l.x - hover.x, dy = l.y - hover.y;
      const d = Math.hypot(dx, dy);
      const R = HOVER_RADIUS * unit + l.r * 0.5;
      if (d < R && d > 0) {
        const push = (1 - d / R) * HOVER_FORCE;
        fx += dx / d * push; fy += dy / d * push;
        press(dx, dy, (1 - d / R) * 0.6);
      }
    }

    // Search only as far as this leaf can actually touch a neighbour.
    const gx = Math.floor(l.x / cell), gy = Math.floor(l.y / cell);
    const reach = Math.ceil((l.r + leafMaxR) * 0.55 / cell);
    for (let ox = -reach; ox <= reach; ox++) {
      for (let oy = -reach; oy <= reach; oy++) {
        const bucket = grid.get(cellKey(gx + ox, gy + oy));
        if (!bucket) continue;
        for (const j of bucket) {
          if (j === i) continue;
          const o = leaves[j];
          const dx = l.x - o.x, dy = l.y - o.y;
          const min = l.solid || o.solid ? solidGap(l, o) : (l.r + o.r) * 0.55;
          const d2 = dx * dx + dy * dy;
          if (d2 < min * min && d2 > 0.01) {
            const d = Math.sqrt(d2);
            const push = (min - d) * SEPARATION;
            fx += dx / d * push; fy += dy / d * push;
            press(dx, dy, (min - d) / min * 4);
          }
        }
      }
    }

    // The squeeze eases in quickly and relaxes slowly, like a leaf settling back flat,
    // with a faint idle undulation from the swell so no leaf ever holds a rigid shape.
    const q = Math.hypot(qx, qy);
    const amount = SQUEEZE_MAX * (1 - Math.exp(-q));
    const idle = PIXEL_ART ? 0 : 0.025;
    const idleX = Math.cos(time * 0.6 + l.phase) * idle, idleY = Math.sin(time * 0.45 + l.phase * 1.3) * idle;
    const targetX = (q > 0 ? qx / q * amount : 0) + idleX, targetY = (q > 0 ? qy / q * amount : 0) + idleY;
    const toward = Math.hypot(targetX, targetY) > Math.hypot(l.qx, l.qy) ? 0.1 : 0.03;
    const ease = 1 - Math.pow(1 - toward, f);
    l.qx += (targetX - l.qx) * ease;
    l.qy += (targetY - l.qy) * ease;

    // Pressed leaves move as if through a crowd: extra drag instead of springing back.
    const crowd = Math.min(1, Math.hypot(l.qx, l.qy) / SQUEEZE_MAX);
    const leafDamp = crowd > 0 ? Math.pow(DAMPING - 0.12 * crowd, f) : damp;
    const mass = l.mass || 1;
    l.vx = (l.vx + fx * f / mass) * leafDamp;
    l.vy = (l.vy + fy * f / mass) * leafDamp;
    l.x += l.vx * f;
    l.y += l.vy * f;
    if (!PIXEL_ART) {
      // A pushed leaf turns: a little with its own speed, more where the push swings its
      // path aside, and it slows to a stop as the water drags on it.
      const torque = (l.vx * fy - l.vy * fx) * 0.05 + Math.hypot(l.vx, l.vy) * 0.0016 * l.spin;
