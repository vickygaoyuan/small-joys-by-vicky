<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>漫步世界 · Wandering World</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 50% -10%, #3a3052 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 120%, #2a1f3c 0%, transparent 60%),
      #17131f;
    color: #cfc6dd;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100svh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0; }

  /* ---------- console shell ---------- */
  .console {
    --w: min(800px, 94vw, calc((100svh - 70px) * 0.66));
    width: var(--w);
    font-size: calc(var(--w) / 40);
    position: relative;
    padding: 2em 2em 3.4em;
    border-radius: 2em 2em 7.5em 2em;
    background:
      radial-gradient(120% 60% at 30% 0%, rgba(255,255,255,.55), transparent 55%),
      linear-gradient(160deg, #f8eccf 0%, #efdcb3 55%, #e3c993 100%);
    box-shadow:
      inset 0 .2em .3em rgba(255,255,255,.6),
      inset 0 -.25em .5em rgba(150,105,40,.22),
      0 1em 3em rgba(0,0,0,.55);
  }
  .console::before { /* seam line across the top */
    content: ""; position: absolute; left: 1.2em; right: 1.2em; top: .9em; height: .15em;
    border-radius: 1em; background: rgba(150,110,50,.25);
  }
  .bezel {
    position: relative;
    background: linear-gradient(180deg, #3b3a4a, #2a2936);
    border-radius: 1.1em 1.1em 4.2em 1.1em;
    padding: 1.1em 2.4em 2.6em 3.4em;
    box-shadow: inset 0 .2em .4em rgba(0,0,0,.5), 0 0 0 .1em rgba(255,255,255,.35);
  }
  .bezel-top {
    display: flex; align-items: center; gap: .6em;
    margin: 0 -1em .8em -2.2em;
    font-size: .75em; letter-spacing: .12em; color: #a9a3c0; white-space: nowrap;
  }
  .bezel-top .stripe { flex: 1; height: .45em; border-radius: 1em;
    background: linear-gradient(180deg, #e2557a 0 45%, transparent 45% 55%, #6d6ad8 55% 100%); opacity: .85; }
  .led-wrap { position: absolute; left: 1.05em; top: 45%; display: flex; flex-direction: column; align-items: center; gap: .5em; }
  .led {
    width: .95em; height: .95em; border-radius: 50%;
    background: #5a2a32; box-shadow: inset 0 .1em .2em rgba(0,0,0,.6);
    transition: background .3s, box-shadow .3s;
  }
  .led.on { background: #ff4d5e; box-shadow: 0 0 .5em #ff4d5e, 0 0 1.2em rgba(255,77,94,.6), inset 0 -.1em .15em rgba(0,0,0,.3); }
  .led.low { animation: ledblink .5s steps(2) infinite; }
  @keyframes ledblink { 50% { background: #5a2a32; box-shadow: none; } }
  .led-label { font-size: .55em; color: #8d88a3; letter-spacing: .1em; writing-mode: vertical-rl; transform: rotate(180deg); }
  .screen-frame {
    position: relative; border-radius: .35em; overflow: hidden;
    box-shadow: 0 0 0 .2em #17161f, inset 0 0 1em rgba(0,0,0,.6);
    background: #0f0c19;
  }
  #screen { display: block; width: 100%; aspect-ratio: 10 / 9; touch-action: none; cursor: pointer; image-rendering: pixelated; }
  .screen-frame::after { /* glass sheen */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(135deg, rgba(255,255,255,.08), transparent 35%, transparent 70%, rgba(255,255,255,.03));
  }

  .brand { display: flex; align-items: center; min-height: 1.9em; margin: 1.1em 0 0 .4em; }
  .brand-tm { font-size: .7em; font-weight: 700; color: #8f7a52; letter-spacing: .15em; margin-left: auto; margin-right: .4em; }

  .controls { position: relative; display: flex; justify-content: space-between; align-items: center; margin-top: 2.2em; height: 12em; }

  /* D-pad */
  .dpad { position: relative; width: 11.4em; height: 11.4em; margin-left: .3em; touch-action: none; cursor: pointer; }
  .dpad .well { position: absolute; inset: -.5em; border-radius: 50%; background: rgba(150,105,40,.12);
    box-shadow: inset 0 .3em .5em rgba(110,70,20,.28), inset 0 -.15em .25em rgba(255,255,255,.45); }
  .dpad .bar { position: absolute; background: linear-gradient(180deg, #3d3849, #262331); border-radius: .7em;
    box-shadow: inset 0 .12em .15em rgba(255,255,255,.14), inset 0 -.15em .2em rgba(0,0,0,.35); }
  .dpad .bar.v { left: 50%; top: 0; width: 3.8em; height: 100%; transform: translateX(-50%); }
  .dpad .bar.h { top: 50%; left: 0; height: 3.8em; width: 100%; transform: translateY(-50%); }
  .dpad .hub { position: absolute; left: 50%; top: 50%; width: 2em; height: 2em; transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #1d1a25, #2c2836); box-shadow: inset 0 .15em .3em rgba(0,0,0,.6); }
  .dpad .tri { position: absolute; width: 0; height: 0; border: .55em solid transparent; opacity: .45; transition: opacity .06s; }
  .dpad .tri.up    { left: 50%; top: .9em; transform: translateX(-50%); border-bottom-color: #9d97b3; border-top-width: 0; }
  .dpad .tri.down  { left: 50%; bottom: .9em; transform: translateX(-50%); border-top-color: #9d97b3; border-bottom-width: 0; }
  .dpad .tri.left  { top: 50%; left: .9em; transform: translateY(-50%); border-right-color: #9d97b3; border-left-width: 0; }
  .dpad .tri.right { top: 50%; right: .9em; transform: translateY(-50%); border-left-color: #9d97b3; border-right-width: 0; }
  .dpad[data-dir="up"] .tri.up, .dpad[data-dir="down"] .tri.down,
  .dpad[data-dir="left"] .tri.left, .dpad[data-dir="right"] .tri.right { opacity: 1; }
  .dpad .bars { position: absolute; inset: 0; filter: drop-shadow(0 .25em .35em rgba(0,0,0,.3)); transition: filter .06s; }
  .dpad[data-dir="up"] .bars, .dpad[data-dir="down"] .bars,
  .dpad[data-dir="left"] .bars, .dpad[data-dir="right"] .bars { filter: drop-shadow(0 .1em .15em rgba(0,0,0,.3)) brightness(.9); }

  /* A / B */
  .ab { position: relative; width: 14em; height: 10em; margin-right: -.2em; }
  .ab .track { position: absolute; left: .2em; top: 2.4em; width: 13.4em; height: 6.4em; border-radius: 4em;
    background: rgba(150,105,40,.2); box-shadow: inset -.08em .18em .3em rgba(110,70,20,.25); transform: rotate(-25deg); }
  /* buttons sit on the track's two end caps (track center 6.9,5.6; axis at -25deg; caps 3.5em from center) */
  .abtn-wrap { position: absolute; width: 5.2em; height: 5.2em; }
  .abtn-wrap.b { left: 1.13em; top: 4.48em; }
  .abtn-wrap.a { left: 7.47em; top: 1.52em; }
  .abtn {
    width: 5.2em; height: 5.2em; border-radius: 50%; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
    font: 900 1em/1 "Avenir Next", "Trebuchet MS", sans-serif; color: #ffd0dc;
    background: radial-gradient(circle at 38% 30%, #ff8aa3 0%, #e2557a 45%, #b83a5e 100%);
    box-shadow: 0 .3em .6em rgba(0,0,0,.28), inset 0 -.3em .4em rgba(120,25,55,.35), inset 0 .2em .3em rgba(255,255,255,.2);
    transition: transform .05s, box-shadow .05s, filter .05s;
  }
  .abtn span { font-size: 1.7em; color: rgba(255,225,235,.6); pointer-events: none; }
  .abtn.down { transform: scale(.96); filter: brightness(.92); box-shadow: 0 .1em .2em rgba(0,0,0,.3), inset 0 .2em .4em rgba(120,25,55,.4); }
  .lbl { font: 800 .95em/1 "Avenir Next", "Trebuchet MS", sans-serif; color: #3b3580; letter-spacing: .08em; }
  .lbl small { display: block; text-align: center; font-size: .7em; letter-spacing: .12em; color: #8f7a52; margin-top: .25em; font-weight: 700; }

  /* Menu */
  .menu-row { display: flex; justify-content: center; margin-top: .6em; }
  .pill-wrap { display: flex; flex-direction: column; align-items: center; gap: .55em; transform: rotate(-25deg); margin-left: 1.5em; }
  /* the pill sits in a rotated frame, so its light and shadow offsets are counter-rotated to stay straight down on screen */
  .pill {
    width: 4.8em; height: 1.35em; border-radius: 1em; border: 0; cursor: pointer;
    background: linear-gradient(205deg, #a39eb2, #7f7a90);
    box-shadow: -.1em .23em .4em rgba(0,0,0,.28), inset -.04em .09em .1em rgba(255,255,255,.35);
    transition: transform .05s, box-shadow .05s, filter .05s;
  }
  .pill.down { transform: scale(.95); filter: brightness(.9); box-shadow: -.04em .08em .15em rgba(0,0,0,.3); }

  .speaker { position: absolute; right: 2.4em; bottom: 1.6em; display: flex; gap: .7em; transform: rotate(-25deg); }
  .speaker i { display: block; width: .55em; height: 5.2em; border-radius: 1em; background: rgba(110,75,25,.32); box-shadow: inset -.06em .14em .2em rgba(60,35,5,.35); }

  .help { font-size: 11px; color: #8b84a0; text-align: center; line-height: 1.7; max-width: 92vw; }
  .help kbd { font: inherit; color: #d8d0ea; background: rgba(255,255,255,.07); border-radius: 4px; padding: 0 5px; }
  @media (hover: none) { .help .keys { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="console" id="console">
    <div class="bezel">
      <div class="bezel-top"><span class="stripe"></span><span>漫步世界 · WANDERING WORLD</span><span class="stripe"></span></div>
      <div class="led-wrap"><div class="led" id="led"></div><div class="led-label">POWER</div></div>
      <div class="screen-frame"><canvas id="screen"></canvas></div>
    </div>
    <div class="brand"><span class="brand-tm">POCKET</span></div>
    <div class="controls">
      <div class="dpad" id="dpad" data-dir="" aria-label="Directional pad">
        <div class="well"></div>
        <div class="bars"><div class="bar v"></div><div class="bar h"></div><div class="hub"></div>
          <div class="tri up"></div><div class="tri down"></div><div class="tri left"></div><div class="tri right"></div></div>
      </div>
      <div class="ab">
        <div class="track"></div>
        <div class="abtn-wrap b"><button class="abtn" data-btn="B" aria-label="B: restart"><span>B</span></button></div>
        <div class="abtn-wrap a"><button class="abtn" data-btn="A" aria-label="A: start"><span>A</span></button></div>
      </div>
    </div>
    <div class="menu-row"><div class="pill-wrap"><button class="pill" data-btn="MENU" aria-label="Menu"></button><span class="lbl" style="font-size:.75em">MENU</span></div></div>
    <div class="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <p class="help"><span class="keys"><kbd>←↑↓→</kbd>/<kbd>WASD</kbd> move · <kbd>Enter</kbd> start · <kbd>R</kbd> restart · <kbd>M</kbd>/<kbd>Esc</kbd> title · </span>tap the screen to walk somewhere</p>
</div>

<script>
'use strict';
// ============================================================
//  constants & helpers
// ============================================================
const VW = 320, VH = 288;                   // logical screen (10:9)
let SC = 3;                                 // backing scale, follows the on-screen size
const T = 16, LH = 64, COLS = 36;          // cell width, layer height, world width in cells
const PLAY_TIME = 60;                       // seconds per journey
const FOG = '#07060c';
const CAM_FLOOR = -(VH / 2 - 44);           // keep L0 near the bottom of the screen; there is nothing below it
const cvs = document.getElementById('screen');
const ctx = cvs.getContext('2d');
function fitCanvas() {
  const s = clamp(Math.ceil(cvs.clientWidth * (window.devicePixelRatio || 1) / VW), 2, 8);
  if (s === SC && cvs.width === VW * s) return;
  SC = s; cvs.width = VW * SC; cvs.height = VH * SC;
}
cvs.width = VW * SC; cvs.height = VH * SC;
ctx.imageSmoothingEnabled = false;
const key = (L, x) => L + ',' + x;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const hsl = (h, s, l, a = 1) => `hsla(${(((h % 360) + 360) % 360) | 0},${clamp(s, 0, 100) | 0}%,${clamp(l, 0, 100) | 0}%,${a})`;
const F = (w, s) => `${w} ${s}px ui-monospace, "SF Mono", Menlo, monospace`;
const FCJK = (w, s) => `${w} ${s}px "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif`;
const fract = v => v - Math.floor(v);
const srand = i => fract(Math.sin(i * 12.9898 + 78.233) * 43758.5453);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let world = null, R = Math.random;
function setWorld(w) { world = w; R = w.R; }
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = a => a[Math.floor(R() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// deterministic per-cell noise for visuals
function H(a, b, c) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1274126177) + Math.imul(world.seed | 0, -1640531535)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
// a hard-edged line of square pixels
function pline(x0, y0, x1, y1, col, w = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  ctx.fillStyle = col;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, o = (w - 1) >> 1;
  let err = dx + dy;
  for (let i = 0; i < 4000; i++) {
    ctx.fillRect(x0 - o, y0 - o, w, w);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
// a box with notched corners and an optional 1px border
function pbox(x, y, w, h, fill, edge) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillStyle = fill; ctx.fillRect(x + 1, y, w - 2, h); ctx.fillRect(x, y + 1, w, h - 2);
  if (!edge) return;
  ctx.fillStyle = edge;
  ctx.fillRect(x + 1, y, w - 2, 1); ctx.fillRect(x + 1, y + h - 1, w - 2, 1);
  ctx.fillRect(x, y + 1, 1, h - 2); ctx.fillRect(x + w - 1, y + 1, 1, h - 2);
}
// text with a hard 1px drop shadow instead of a soft glow
function shadowText(s, x, y, font, col, shadow, align = 'left', off = 1) { text(s, x + off, y + off, font, shadow, align); text(s, x, y, font, col, align); }
function outlineText(s, x, y, font, col, edge, align = 'left') {
  for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 2; dy++) if (dx || dy) text(s, x + dx, y + dy, font, edge, align);
  text(s, x, y, font, col, align);
}

// ============================================================
//  THEME INVENTION
//  Themes are not listed anywhere: each one is composed from independent
//  ingredients (silhouette functions, palette scheme, bridge/ladder build,
//  decoration grammar, collectible form, layout rhythm) with continuous
//  parameters, then bent by height.
// ============================================================
const TOPS = ['flat', 'wave', 'scallop', 'jag', 'step', 'pillow', 'crenel', 'tuft', 'bumps'];
const BOTS = ['flat', 'island', 'stalactite', 'drip', 'crystal', 'roots', 'layered', 'round'];
const TEXS = ['none', 'stripes', 'bricks', 'dots', 'speckle', 'grain', 'checks', 'waves'];
const BRIDGES = ['planks', 'beam', 'chain', 'glass', 'vine', 'stones', 'ribbon', 'lattice'];
const RAILS = ['straight', 'wobble', 'none', 'rope', 'double'];
const RUNGS = ['bar', 'dot', 'block', 'loop'];
const DECOR = ['stalk', 'cluster', 'stack', 'floater', 'arch', 'blob', 'tuft', 'spire'];
const STRANGE = ['eye', 'spiral', 'orb'];
const HEADS = ['ball', 'cap', 'star', 'diamond', 'bulb', 'tri', 'leafy', 'bell'];
const FLOATS = ['ring', 'star', 'diamond', 'blob', 'lantern', 'fish', 'moon', 'kite'];
const PARTS = ['none', 'snow', 'motes', 'bubbles', 'petals', 'sparks', 'rain', 'fireflies'];
const BLOCKS = ['gate', 'broken', 'thorns'];
// lines stay at 18 characters or fewer so the pickup label reads at a glance
const MOMENTS = [
  { shape: 'heart', kind: 'love', lines: ['a goodnight kiss', 'holding hands', 'a slow dance'] },
  { shape: 'pair', kind: 'friends', lines: ['a big laugh', 'a friend calls', 'game night'] },
  { shape: 'house', kind: 'family', lines: ['Sunday dinner', 'mom calls', 'a family photo'] },
  { shape: 'mug', kind: 'coffee', lines: ['coffee, no rush', 'a slow morning', 'tea in the rain'] },
  { shape: 'paw', kind: 'pets', lines: ['a dog walk', 'a cat on your lap', 'a puppy says hi'] },
  { shape: 'note', kind: 'music', lines: ['a song on repeat', 'car karaoke', 'a live show'] },
  { shape: 'sun', kind: 'sunsets', lines: ['a sunset', 'a sunrise hike', 'golden hour'] },
  { shape: 'plane', kind: 'trips', lines: ['a weekend away', 'New city adventure', 'a road trip'] },
  { shape: 'brush', kind: 'hobbies', lines: ['painting for fun', 'a pottery class', 'a new hobby'] },
  { shape: 'book', kind: 'books', lines: ['a good book', 'a rainy-day read', 'a library visit'] },
  { shape: 'letter', kind: 'notes', lines: ['a kind note', 'a thank-you card', 'mail from home'] },
  { shape: 'flower', kind: 'kindness', lines: ['flowers, no reason', 'helping a stranger', 'a small kindness'] },
  { shape: 'cake', kind: 'birthdays', lines: ['a sweet treat', 'a surprise party', 'a homemade cake'] },
  { shape: 'star', kind: 'projects', lines: ['a side project', 'something you made', 'a 2am idea'] }];
const ADJ = ['Humming', 'Velvet', 'Drowsy', 'Copper', 'Paper', 'Lantern', 'Whispering', 'Honey', 'Salt', 'Marble', 'Sleepy', 'Tangerine', 'Pearl', 'Cotton', 'Clockwork', 'Fern', 'Frost', 'Candy', 'Dune', 'Coral', 'Thistle', 'Biscuit', 'Teacup', 'Feather', 'Pocket', 'Ribbon', 'Puddle', 'Button', 'Saffron', 'Mint', 'Chalk', 'Cinnamon'];
const NOUN = ['Orchard', 'Archive', 'Garden', 'Terrace', 'Market', 'Reef', 'Library', 'Steps', 'Bazaar', 'Meadow', 'Attic', 'Kitchen', 'Bathhouse', 'Canopy', 'Quarry', 'Station', 'Laundry', 'Greenhouse', 'Harbor', 'Arcade', 'Bakery', 'Workshop', 'Promenade', 'Pavilion', 'Courtyard'];
const OF = ['Lanterns', 'Echoes', 'Teacups', 'Moths', 'Small Hours', 'Lost Socks', 'Rain', 'Clocks', 'Foxes', 'Postcards', 'Bells', 'Spoons', 'Ferns', 'Kites', 'Lullabies', 'Paper Boats', 'Marbles', 'Snails'];
const HIGH_ADJ = ['Windswept', 'Cloud-High', 'Airy', 'Kite-String', 'Skylit', 'Breezy', 'Far-Up', 'Feather-Light'];
const HIGH_NOUN = ['Rooftops', 'Lookout', 'Belfry', 'Cloudfield', 'Balcony', 'Observatory', 'Aerie', 'Weathervane'];

let themeSeq = 0;
function mkDecor(kind) {
  const d = { kind, c1: ri(0, 3), c2: ri(0, 3) };
  if (d.c2 === d.c1) d.c2 = (d.c1 + 1) % 4;
  switch (kind) {
    case 'stalk': Object.assign(d, { h: ri(7, 20), head: pick(HEADS), hs: 2 + R() * 3.2, lean: (R() - .5) * 6, sw: 1 + R() * 1.2 }); break;
    case 'cluster': Object.assign(d, { n: ri(2, 5), h: ri(5, 13), w: 2 + R() * 2.5, tilt: R() * .5 }); break;
    case 'stack': Object.assign(d, { n: ri(1, 3), w: ri(6, 11), h: ri(3, 6), round: R() < .5 }); break;
    case 'floater': Object.assign(d, { shape: pick(FLOATS), s: 2 + R() * 2.5, y: .35 + R() * .35, bob: 1 + R() * 3, sp: .8 + R() * 1.5 }); break;
    case 'arch': Object.assign(d, { r: ri(5, 11), lw: 1.4 + R() * 1.4, bands: ri(1, 3) }); break;
    case 'blob': Object.assign(d, { w: ri(7, 14), h: ri(4, 8), bumps: ri(1, 3) }); break;
    case 'tuft': Object.assign(d, { n: ri(3, 6), h: ri(3, 7), curl: (R() - .5) * 3 }); break;
    case 'spire': Object.assign(d, { h: ri(14, 28), w: ri(4, 7), roof: pick(['tri', 'dome', 'flat', 'spike']) }); break;
    case 'eye': Object.assign(d, { s: ri(3, 5), y: .4 + R() * .25, bob: 1.5, sp: .6 }); break;
    case 'spiral': Object.assign(d, { s: ri(4, 7), turns: 2 + R() * 2, y: .35 + R() * .35, bob: 2, sp: .7 }); break;
    case 'orb': Object.assign(d, { s: ri(2, 4), y: .3 + R() * .4, ring: R() < .6, bob: 2.5, sp: 1.1 }); break;
  }
  return d;
}
function inventTheme(h, p) {
  const scheme = pick(['analog', 'comp', 'triad', 'split', 'mono']);
  const off = { analog: [32, -30], comp: [180, 160], triad: [120, 240], split: [150, 210], mono: [14, -14] }[scheme];

  pbox(x, by - 13, w, 26, '#12081c', t.theme ? t.theme.c.acc : '#3de0ff');
  if (t.theme) { pix(x + 4, by - 9, 5, 15, t.theme.c.sky2); pix(x + 4, by + 3, 5, 3, t.theme.c.plat); }
  let s1 = t.text; ctx.font = F(800, 9); while (ctx.measureText(s1).width > w - 24 && s1.length > 4) s1 = s1.slice(0, -2) + '…';
  text(s1, x + 14, y - 3.5, F(800, 9), '#fff4e2');
  text(t.sub || '', x + 14, y + 6.5, F(600, 6.5), 'rgba(225,215,245,.75)');
  ctx.restore();
}
function drawFx(time) {
  for (const f of G.fx) {
    const k = f.t / f.life;
    if (f.k === 'moment') {
      const hold = 1.7, a = f.t < hold ? 1 : clamp(1 - (f.t - hold) / (f.life - hold), 0, 1);
      ctx.font = F(800, 7.5);
      const w = Math.round(ctx.measureText(f.text).width);
      const cx = Math.round(clamp(f.x, w / 2 + 2, COLS * T - w / 2 - 2)), y = Math.round(f.y - k * 4);
      ctx.globalAlpha = a;
      outlineText(f.text, cx, y, F(800, 7.5), '#ffffff', '#12081c', 'center');
    }
    else if (f.k === 'spark') { ctx.globalAlpha = 1 - k; pix(f.x - 1, f.y - 1, 2, 2, f.col); }
    else if (f.k === 'nope') { ctx.globalAlpha = 1 - k; pline(f.x - 3, f.y - 3, f.x + 3, f.y + 3, '#ff8b9b', 2); pline(f.x + 3, f.y - 3, f.x - 3, f.y + 3, '#ff8b9b', 2); }
  }
  ctx.globalAlpha = 1;
  if (G.target) {
    const [px0, py0] = cellPos(G.target.L, G.target.x), px = Math.round(px0), py = Math.round(py0), b = Math.round(Math.abs(Math.sin(time * 5)) * 3);
    for (let i = 0; i < 4; i++) pix(px - 3 + i, py - 14 - b + i, 7 - i * 2, 1, '#fff4e2');
    ctx.globalAlpha = .7;
    pix(px - 4, py - 1, 9, 1, '#fff4e2'); pix(px - 4, py + 1, 9, 1, '#fff4e2');
    pix(px - 5, py, 1, 1, '#fff4e2'); pix(px + 5, py, 1, 1, '#fff4e2');
    ctx.globalAlpha = 1;
  }
}
function drawPlay(time) {
  drawFogBg(time);
  const done = drawWorld('play', time);
  drawClimber(P.px, P.py, P.move ? P.pose : 'stand', P.phase, P.facing, time);
  drawFx(time);
  done();
  drawHUD(time);
  drawToast(time);
  if (G.state === 'timeup') {
    const k = clamp(G.endT / .35, 0, 1);
    ctx.fillStyle = `rgba(15,12,25,${.45 * k})`; ctx.fillRect(0, 0, VW, VH);
    ctx.save(); ctx.translate(VW / 2, VH / 2); const s = .6 + .4 * ease(k); ctx.scale(s, s);
    shadowText("TIME'S UP", 0, -6, F(900, 22), '#fff4e2', '#ff4d9a', 'center', 2); ctx.restore();
    text('the journey ends right here', VW / 2, VH / 2 + 16, F(600, 7.5), 'rgba(235,225,250,.8)', 'center');
  }
}

// ---------------- review ----------------
function profile() {
  const c = Math.max(0, G.maxUp) / 5, v = G.moments / 15, sum = c + v;
  const view = sum > 0 ? v / sum : .5;
  let title, body;
  if (sum < .25) [title, body] = ['The Quiet Noticer', "You didn't chase the next rung, and you didn't fill your pockets with moments either. Sometimes a walk is just a walk."];
  else if (view < .35) [title, body] = ['All Climb', 'You kept your eyes on the next rung. Ladder after ladder, always toward the next thing. You got high. Did you see any of it?'];
  else if (view > .65) [title, body] = ['All View', 'You kept stopping for the small things: a song, a friend, a sunset. The ladder could wait, and it did.'];
  else [title, body] = ['A Little of Both', 'Some climbing, some looking around. You reached for the next thing and still stopped for a few. You cannot have it all, and you did not pretend to.'];
  return { view, title, body };
}
function viewSub() {
  const e = Object.entries(G.kinds).sort((a, b) => b[1] - a[1]);
  if (!e.length) return 'none stopped for';
  return `${e.length} kind${e.length > 1 ? 's' : ''}, mostly ${e[0][0]}`;
}
// every moment collected, in order, with repeats folded into a count
function collectedMoments() {
  const out = [], at = new Map();
  for (const r of G.remember) {
    if (at.has(r.line)) out[at.get(r.line)].n++;
    else { at.set(r.line, out.length); out.push({ ...r, n: 1 }); }
  }
  return out;
}
const climbSub = () => G.maxUp ? `${G.maxUp} ladder${G.maxUp > 1 ? 's' : ''} up` : 'stayed on L0';
function drawReview(time) {
  drawFogBg(time);
  const done = drawWorld('review', time);
  ctx.fillStyle = 'rgba(15,12,25,.42)'; ctx.fillRect(cam.x - VW / cam.z, cam.y - VH / cam.z, VW * 2 / cam.z, VH * 2 / cam.z);
  // the trail of choices
  const tr = G.trail, n = tr.length, prog = clamp((G.rt - 1.2) / 3.2, 0, 1), upto = Math.max(1, Math.floor(n * prog));
  const lw = 1 / cam.z, wide = Math.max(1, Math.round(5 * lw)), thin = Math.max(1, Math.round(2 * lw));
  for (let i = 1; i < upto; i++) pline(tr[i - 1][0], tr[i - 1][1] - 4, tr[i][0], tr[i][1] - 4, '#2e2742', wide);
  const CH = 24;
  for (let s = 0; s < upto - 1; s += CH) {
    const col = hsl(40 + 300 * (s / Math.max(1, n)), 95, 68);
    for (let i = s + 1; i <= Math.min(upto - 1, s + CH); i++) pline(tr[i - 1][0], tr[i - 1][1] - 4, tr[i][0], tr[i][1] - 4, col, thin);
  }
  // start flag + the climber where time ran out
  if (n) {
    const sx = Math.round(tr[0][0]), sy = Math.round(tr[0][1]), u = Math.max(1, Math.round(lw));
    pix(sx, sy - 16 * u, u, 16 * u, '#fff4e2');
    for (let i = 0; i < 6; i++) pix(sx + u, sy - 16 * u + i * u, (6 - Math.abs(i - 2.5) * 2) * u, u, '#ff4d9a');
    const head = tr[upto - 1];
    ctx.save(); ctx.translate(head[0], head[1]); ctx.scale(Math.max(1, .9 / cam.z), Math.max(1, .9 / cam.z)); drawClimber(0, 0, 'stand', 0, P.facing, time); ctx.restore();
  }
  done();
  // header
  const hk = clamp(G.rt / .6, 0, 1);
  ctx.globalAlpha = hk;
  ctx.fillStyle = 'rgba(12,9,22,.78)'; ctx.fillRect(0, 0, VW, 20);
  text('THE PATH YOU CHOSE', 8, 10.5, F(800, 8), '#fff4e2');
  // stat card
  const ck = ease(clamp((G.rt - 1.6) / .6, 0, 1));
  ctx.globalAlpha = ck;
  const y = Math.round(VH - 70 + (1 - ck) * 20);
  pbox(8, y, VW - 16, 62, '#12081c', '#3de0ff');
  pix(9, y + 1, VW - 18, 1, '#ff4d9a');
  const cols = [
    { x: 85, draw: () => drawLadderIcon(85, y + 14), n: 'L' + G.maxUp, lab: 'the climb', col: '#7ee8ff', sub: climbSub() },
    { x: 235, draw: () => drawMoment('heart', 235, y + 14, time), n: G.moments + ' moments', lab: 'the view', col: '#ffe9a0', sub: viewSub() },
  ];
  for (const c of cols) {
    c.draw();
    text(String(c.n), c.x, y + 31, F(900, 13), c.col, 'center');
    text(c.lab, c.x, y + 43, F(700, 6.5), 'rgba(235,225,250,.85)', 'center');
    text(c.sub, c.x, y + 52, F(500, 5.8), 'rgba(220,210,240,.55)', 'center');
  }
  ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(160, y + 10, 1, 42);
  ctx.globalAlpha = 1;
  if (G.rt > 3 && fract(time * .8) < .7) text('▶ what it says about you', VW - 12, y - 8, F(700, 6.5), '#fff4e2', 'right');
}
function drawMirror(time) {
  const pr = G.profile, k = ease(clamp(G.pageT / .5, 0, 1));
  ctx.fillStyle = '#120e1e'; ctx.fillRect(0, 0, VW, VH);
  // a ribbon of every world you uncovered, in the order you found them
  const vis = G.visited.map(L => world.layers.get(L).theme), sw = VW / Math.max(1, vis.length);
  vis.forEach((t, i) => { const a = Math.round(i * sw), b = Math.round((i + 1) * sw); pix(a, 0, b - a, 6, t.c.sky2); pix(a, 6, b - a, 2, t.c.plat); });
  ctx.globalAlpha = k;
  text('WHAT YOUR PATH SAYS', VW / 2, 20, F(700, 6.5), 'rgba(230,220,250,.6)', 'center');
  shadowText(pr.title, VW / 2, 36, F(900, 12.5), '#fff4e2', '#ff4d9a', 'center');
  // the balance: where your minute went, not a score
  const bx = 40, bw = 240, by = 70, segs = 24, sgw = bw / segs;
  text('the climb', bx, by - 9, F(800, 7), '#7ee8ff');
  text('the view', bx + bw, by - 9, F(800, 7), '#ffe9a0', 'right');
  for (let i = 0; i < segs; i++) {
    const f = i / (segs - 1), a = Math.round(bx + i * sgw), b = Math.round(bx + (i + 1) * sgw) - 1;
    pix(a, by, b - a, 6, hsl(190 - 140 * f, 90, 66 - 4 * Math.sin(f * Math.PI)));
  }
  pix(bx - 1, by - 1, bw + 1, 1, '#2e2742'); pix(bx - 1, by + 6, bw + 1, 1, '#2e2742');
  const grow = ease(clamp((G.pageT - .2) / .8, 0, 1));
  const mx = Math.round(bx + bw * lerp(.5, pr.view, grow));
  for (let i = 0; i < 4; i++) pix(mx - 3 + i, by - 6 + i, 7 - i * 2, 1, '#fff4e2');
  pix(mx, by - 2, 1, 10, '#fff4e2');
  const pc = Math.round(pr.view * 100);
  text(`${100 - pc}%`, bx, by + 15, F(500, 6), 'rgba(230,220,250,.55)');
  text(`${pc}%`, bx + bw, by + 15, F(500, 6), 'rgba(230,220,250,.55)', 'right');
  // the words
  const lines = wrap(pr.body, 250, F(500, 7.2));
  lines.slice(0, 5).forEach((l, i) => text(l, VW / 2, 108 + i * 11, F(500, 7.2), 'rgba(240,232,255,.9)', 'center'));
  // what you carried
  const y0 = 168;
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(14, y0 - 8, VW - 28, 1);
  drawLadderIcon(22, y0 + 4); text(`L${G.maxUp}  the climb`, 31, y0 + 4.5, F(800, 7.5), '#7ee8ff'); text(climbSub(), 140, y0 + 4.5, F(500, 6.5), 'rgba(225,215,245,.6)');
  drawMoment('heart', 22, y0 + 18, time, 0, false); text(`${G.moments}  the view`, 31, y0 + 18.5, F(800, 7.5), '#ffe9a0'); text(viewSub(), 140, y0 + 18.5, F(500, 6.5), 'rgba(225,215,245,.6)');
  // the moments themselves
  const ly = y0 + 36, got = collectedMoments();
  ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(14, ly - 6, VW - 28, 1);
  text('moments you experienced', 15, ly + 1, F(700, 6.5), 'rgba(255,233,160,.85)');
  if (!got.length) text('none this time', 15, ly + 13, F(500, 6.5), 'rgba(225,215,245,.5)');
  const cols = 3, rows = 5, cw = (VW - 28) / cols, cap = cols * rows;
  const shown = got.length > cap ? got.slice(0, cap - 1) : got;
  ctx.font = F(500, 6.2);
  shown.forEach((m, i) => {
    const cx = Math.round(15 + (i % cols) * cw), cy = ly + 13 + Math.floor(i / cols) * 11;
    drawMoment(m.shape, cx + 3, cy, time, i * .3, false);
    let s = m.n > 1 ? `${m.line} ×${m.n}` : m.line;
    while (ctx.measureText(s).width > cw - 14 && s.length > 4) s = s.slice(0, -2) + '…';
    text(s, cx + 10, cy + .5, F(500, 6.2), 'rgba(240,232,255,.85)');
  });
  if (got.length > cap) {
    const i = cap - 1, cx = Math.round(15 + (i % cols) * cw), cy = ly + 13 + Math.floor(i / cols) * 11;
    text(`and ${got.length - shown.length} more`, cx + 10, cy + .5, F(500, 6.2), 'rgba(225,215,245,.5)');
  }
  ctx.globalAlpha = 1;
  text('◀ path    A  wander again    MENU  title', VW / 2, VH - 9, F(700, 6.5), fract(time * .7) < .75 ? 'rgba(255,244,226,.85)' : 'rgba(255,244,226,.45)', 'center');
}

// ============================================================
//  LOOP
// ============================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt);
  fitCanvas();
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.globalAlpha = 1;
  const time = now / 1000;
  if (G.state === 'title') drawTitle(time);
  else if (G.state === 'play' || G.state === 'timeup') drawPlay(time);
  else if (G.state === 'review') { if (G.page === 'mirror') drawMirror(time); else drawReview(time); }
  requestAnimationFrame(frame);
}
goTitle();
requestAnimationFrame(frame);

// test hooks (harmless in play)
window.__ww = {
  get G() { return G; }, get world() { return world; }, P, startRun, endRun, findPath,
  connectivity() {
    // BFS over every generated cell using two-way ladders only, to prove nothing is cut off
    const w = world, seen = new Set(), q = [[0, w.startX]]; seen.add(key(0, w.startX));
    while (q.length) {
      const [L, x] = q.pop(), k = key(L, x), nb = [];
      for (const dx of [-1, 1]) if (walkable(L, x + dx)) nb.push([L, x + dx]);
      const u = w.upFrom.get(k); if (u && u.type === 'ladder' && w.layers.has(u.lo + 1)) nb.push([u.lo + 1, u.xb]);
      const d = w.downFrom.get(k); if (d && d.type === 'ladder' && w.layers.has(d.lo)) nb.push([d.lo, d.xa]);
      for (const [nL, nx] of nb) { const nk = key(nL, nx); if (!seen.has(nk)) { seen.add(nk); q.push([nL, nx]); } }
    }
    let total = 0, miss = [];
    for (const [L, lay] of w.layers) for (let x = 0; x < COLS; x++) if (isWalk(lay.cells[x])) { total++; if (!seen.has(key(L, x))) miss.push(key(L, x)); }
    return { total, reached: total - miss.length, miss: miss.slice(0, 10) };
  },
};
